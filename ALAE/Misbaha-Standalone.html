    newYear: {
      id:'newYear', icon:'🌙',
      banner:{ ar:'عَامٌ هِجْرِيٌّ جَدِيد', fr:'Bonne année hégirienne', en:'Happy Hijri New Year', nl:'Gelukkig Hijri-nieuwjaar' },
      duaa:{
        ar:'اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْيُمْنِ وَالْإِيمَانِ، وَالسَّلَامَةِ وَالْإِسْلَامِ، رَبِّي وَرَبُّكَ اللَّهُ',
        fr:'Ô Allah, fais lever ce mois sur nous avec la bénédiction, la foi, la sécurité et l’Islam. Mon Seigneur et ton Seigneur est Allah.',
        en:'O Allah, bring it upon us with blessing, faith, safety and Islam. My Lord and your Lord is Allah.',
        nl:'O Allah, laat het over ons opkomen met zegen, geloof, veiligheid en islam. Mijn Heer en jouw Heer is Allah.',
        ref:'الترمذي',
      },
    },
    friday: {
      id:'friday', icon:'✦',
      banner:{ ar:'يَوْمُ الجُمُعَة', fr:'Vendredi béni', en:'Blessed Friday', nl:'Gezegende vrijdag' },
      duaa:{
        ar:'اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ',
        fr:'Ô Allah, prie et accorde le salut sur notre Prophète Muhammad ﷺ.',
        en:'O Allah, send blessings and peace upon our Prophet Muhammad ﷺ.',
        nl:'O Allah, schenk zegeningen en vrede aan onze Profeet Mohammed ﷺ.',
        ref:'فَضْلُ الجُمُعَة',
      },
    },
  };

  if (h) {
    if (h.m === 12 && h.d === 9) return O.arafah;
    if (h.m === 12 && h.d >= 10 && h.d <= 13) return O.eidAdha;
    if (h.m === 12 && h.d >= 1 && h.d <= 8) return O.dhulhijja;
    if (h.m === 10 && h.d >= 1 && h.d <= 3) return O.eidFitr;
    if (h.m === 9) return O.ramadan;
    if (h.m === 1 && h.d === 10) return O.ashura;
    if (h.m === 1 && h.d === 1) return O.newYear;
  }
  return null;
};

function DuaaScreen({ lang = 'ar', randomDuaa = false, onTap }) {
  const T = window.THEME;
  const isAr = lang === 'ar';

  // Pick: random (for splash mode) or day-of-year (for menu mode)
  const duaaIdx = React.useMemo(() => {
    if (randomDuaa) {
      return Math.floor(Math.random() * window.DUAA_LIST.length);
    }
    const now = new Date();
    const startOfYear = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - startOfYear) / 86400000);
    return dayOfYear % window.DUAA_LIST.length;
  }, [randomDuaa]);
  const occasion = React.useMemo(() => (window.getDuaaOccasion ? window.getDuaaOccasion() : null), []);
  const duaa = (occasion && occasion.duaa) ? occasion.duaa : window.DUAA_LIST[duaaIdx];

  const now = new Date();
  const dateStr = now.toLocaleDateString(lang === 'ar' ? 'ar-u-nu-latn' : (lang === 'fr' ? 'fr-FR' : lang === 'nl' ? 'nl-NL' : 'en-US'), {
    weekday: 'long', day: 'numeric', month: 'long'
  });

  const L = {
    fr: { eyebrow:"PRIÈRE JOURNALIÈRE", sub:'Une invocation chaque jour', share:'Partager', meaning:'Sens' },
    en: { eyebrow:"TODAY'S DUAA", sub:'One invocation a day', share:'Share', meaning:'Meaning' },
    ar: { eyebrow:'دُعَاء اليَوم', sub:'دعاء جديد كل يوم', share:'مشاركة', meaning:'المعنى' },
    nl: { eyebrow:'DUA VAN DE DAG', sub:'Elke dag een smeekbede', share:'Delen', meaning:'Betekenis' },
  }[lang] || {};

  const greeting = React.useMemo(() => {
    const hr = new Date().getHours();
    // صباح jusqu'à ~13h · مساء ensuite — affiché toute la journée
    if (hr >= 3 && hr < 13) return { ar:'صَبَاحُ الخَيْر', fr:'Bonjour', en:'Good morning', nl:'Goedemorgen' };
    return { ar:'مَسَاءُ الخَيْر', fr:'Bonsoir', en:'Good evening', nl:'Goedenavond' };
  }, []);

  const [shareToast, setShareToast] = React.useState('');
  const handleShare = async (e) => {
    if (e) e.stopPropagation();
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (e2) {}
    const text = `${duaa.ar}\n\n${duaa[lang] || duaa.fr}\n— آلَاء\n\n📲 حمّل تطبيق آلاء:\nhttps://www.lestyle.be/alaeApp`;
    const okMsg = isAr ? 'تمّت المشاركة' : (lang === 'fr' ? 'Partagé' : 'Shared');
    const copyMsg = isAr ? 'تمّ نسخ الدعاء' : (lang === 'fr' ? "Dou'a copié" : 'Copied');
    const toast = (m) => { setShareToast(m); setTimeout(() => setShareToast(''), 1800); };
    // 1) Carte image (la plus belle) — partage natif avec fichier
    try {
      if (window.buildShareCard) {
        const blob = await window.buildShareCard({
          greeting: greeting ? (greeting[lang] || greeting.ar) : '',
          arabic: duaa.ar,
          translation: lang !== 'ar' ? (duaa[lang] || duaa.fr) : '',
          ref: duaa.ref, lang,
        });
        if (blob) {
          const file = new File([blob], 'alae-doua.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], text });
            toast(okMsg); return;
          }
        }
      }
    } catch (err) { if (err && err.name === 'AbortError') return; }
    // 2) Pont natif iOS (texte)
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.alae) {
        window.webkit.messageHandlers.alae.postMessage({ type:'share', text, url:'https://www.lestyle.be/alaeApp' });
        return;
      }
    } catch (e2) {}
    // 3) Web Share API (texte)
    if (navigator.share) {
      navigator.share({ title: L.eyebrow, text })
        .then(() => toast(okMsg))
        .catch((err) => { if (!err || err.name !== 'AbortError') { try { window.alaeCopy(text); } catch (e3) {} toast(copyMsg); } });
      return;
    }
    // 4) Copie presse-papier
    try { window.alaeCopy(text); } catch (e2) {}
    toast(copyMsg);
  };

  return (
    <div
      style={{ position:'absolute', inset:0, background:T.bg, overflow:'hidden', direction: isAr ? 'rtl' : 'ltr', cursor: onTap ? 'pointer' : 'default' }}
      onClick={onTap}
    >
      <window.SilkBg opacity={0.9} />
      <style>{`
        @font-face { font-family: 'QPC'; src: url('fonts/QPC-V2.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @keyframes duaaShine {
          0% { transform: translateX(-130%) skewX(-18deg); opacity: 0; }
          22% { opacity: 0.85; }
          55% { opacity: 0.85; }
          100% { transform: translateX(230%) skewX(-18deg); opacity: 0; }
        }
        @keyframes duaaGlow {
          0%,100% { box-shadow: 0 10px 26px rgba(120,70,15,0.5), 0 2px 6px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,244,200,0.9), inset 0 -2px 6px rgba(120,60,10,0.5); }
          50% { box-shadow: 0 12px 34px rgba(201,124,46,0.6), 0 2px 6px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,244,200,0.95), inset 0 -2px 6px rgba(120,60,10,0.5); }
        }
      `}</style>
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse 90% 80% at 50% 50%, rgba(11,13,16,0.02), rgba(11,13,16,0.14))', zIndex:1 }}/>

      <div style={{ position:'relative', zIndex:2, padding: onTap ? '120px 22px 40px' : '96px 22px 40px', height:'100%', boxSizing:'border-box', display:'flex', flexDirection:'column' }}>

        {/* Header */}
        <div style={{ textAlign:'center', marginBottom:22 }}>
          {occasion && (() => {
            const isEid = occasion.id === 'eidFitr' || occasion.id === 'eidAdha';
            return (
            <div style={{
              display:'inline-flex', alignItems:'center', gap: isEid ? 12 : 9, marginBottom:16,
              padding: isEid ? '9px 22px' : '7px 18px', borderRadius:999,
              background: isEid
                ? 'linear-gradient(180deg, rgba(255,228,150,0.42), rgba(214,142,54,0.30))'
                : 'linear-gradient(180deg, rgba(247,206,132,0.24), rgba(201,124,46,0.16))',
              border: isEid ? '0.5px solid rgba(255,224,150,0.85)' : '0.5px solid rgba(232,200,140,0.55)',
              boxShadow: isEid
                ? '0 4px 22px rgba(214,142,54,0.5), 0 0 14px rgba(255,214,120,0.4), inset 0 1px 0 rgba(255,245,210,0.6)'
                : '0 3px 16px rgba(201,124,46,0.30), inset 0 1px 0 rgba(255,240,200,0.35)',
              fontFamily:'"ArefRuqaa","Amiri",serif', fontSize: isEid ? 21 : 19, fontWeight:700,
              color:'#FBEDC4', letterSpacing:'0.01em', direction: isAr ? 'rtl' : 'ltr',
              whiteSpace:'nowrap', maxWidth:'92%',
              filter: isEid ? 'drop-shadow(0 0 11px rgba(255,205,110,0.6))' : 'drop-shadow(0 0 7px rgba(232,185,122,0.35))',
              position:'relative', overflow:'hidden',
              animation: isEid ? 'eidBannerGlow 2.6s ease-in-out infinite' : 'none',
            }}>
              {isEid && (
                <span style={{
                  position:'absolute', inset:0, pointerEvents:'none',
                  background:'linear-gradient(115deg, transparent 25%, rgba(255,250,225,0.55) 48%, rgba(255,250,225,0.2) 56%, transparent 72%)',
                  backgroundSize:'250% 100%', mixBlendMode:'screen',
                  animation:'eidShimmer 3.4s ease-in-out infinite',
                }}/>
              )}
              {isEid
                ? <span style={{ fontSize:15, filter:'drop-shadow(0 0 4px rgba(255,220,140,0.8))' }}>✦</span>
                : <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style={{ flexShrink:0, opacity:0.95 }}><path d="M17.2 18.4A8 8 0 1 1 11.4 4.2a6.6 6.6 0 1 0 5.8 14.2z"/></svg>}
              <span style={{ position:'relative', zIndex:1 }}>{occasion.banner[lang] || occasion.banner.ar}</span>
              {isEid && <span style={{ fontSize:15, filter:'drop-shadow(0 0 4px rgba(255,220,140,0.8))' }}>✦</span>}
            </div>
            );
          })()}
          <div style={{ display:'flex', justifyContent:'center', alignItems:'center', gap:16, marginBottom:14 }}>
            <div style={{ width:5, height:5, transform:'rotate(45deg)', background:'#F4D89B', boxShadow:'0 0 5px rgba(255,225,150,0.85), 0 1px 2px rgba(0,0,0,0.6)', animation:'starSparkle 2.4s ease-in-out infinite', animationDelay:'0s' }}/>
            <div style={{ width:7, height:7, transform:'rotate(45deg)', background:'#FFE9B8', boxShadow:'0 0 7px rgba(255,225,150,0.95), 0 1px 2px rgba(0,0,0,0.6)', animation:'starSparkle 2.4s ease-in-out infinite', animationDelay:'0.5s' }}/>
            <div style={{ width:5, height:5, transform:'rotate(45deg)', background:'#F4D89B', boxShadow:'0 0 5px rgba(255,225,150,0.85), 0 1px 2px rgba(0,0,0,0.6)', animation:'starSparkle 2.4s ease-in-out infinite', animationDelay:'1s' }}/>
          </div>
          <div style={{
            fontFamily:'"ArefRuqaa","Amiri",serif', fontSize:38, fontWeight:700,
            background:'linear-gradient(180deg, #FFF1C8 0%, #F4D89B 25%, #E8B97A 55%, #C7935B 85%, #7E5025 100%)',
            WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', backgroundClip:'text',
            lineHeight:1, letterSpacing:'0.02em',
            filter:'drop-shadow(0 0 7px rgba(232,185,122,0.3))',
          }}>{L.eyebrow}</div>
          <div style={{ fontFamily:'Amiri, serif', fontSize:14, color:T.textMuted, marginTop:8, opacity:0.85 }}>
            {dateStr}
          </div>
        </div>

        {/* Dou'a card (vertically centered in the free space) */}
        <div style={{ flex:1, display:'flex', alignItems:'center', minHeight:0 }}>
        <div
          style={{
            width:'100%', display:'flex', flexDirection:'column', justifyContent:'center', gap:14,
            padding:'24px 18px', borderRadius:22,
            background:'linear-gradient(180deg, rgba(20,14,8,0.42), rgba(20,14,8,0.30))',
            backdropFilter:'blur(10px) saturate(1.15)', WebkitBackdropFilter:'blur(10px) saturate(1.15)',
            border:'0.5px solid rgba(232,200,140,0.28)',
            boxShadow:'0 12px 36px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,225,160,0.10)',
          }}
        >
          {/* Greeting (morning only) — cuivre caramel / or brillant */}
          {greeting && (
            <div style={{
              position:'relative', textAlign:'center', direction:'rtl', marginBottom:6,
              padding:'4px 14px 12px', whiteSpace:'nowrap', overflow:'visible',
              fontFamily:'"Noto Nastaliq Urdu","QPCV4Tajweed","Amiri",serif', fontSize:38, fontWeight:700, lineHeight:2.1,
              color:'transparent',
              backgroundImage:'linear-gradient(110deg, #8B5A2A 0%, #C7935B 16%, #E8B97A 30%, #FFF6DA 44%, #FCE9B0 50%, #E0A23F 60%, #C7935B 74%, #FFF1C8 86%, #B07F2E 100%)',
              backgroundSize:'260% 100%',
              WebkitBackgroundClip:'text', backgroundClip:'text', WebkitTextFillColor:'transparent',
              filter:'drop-shadow(0 0 10px rgba(235,150,66,0.45)) drop-shadow(0 2px 4px rgba(0,0,0,0.5))',
              animation:'sabahShine 5s ease-in-out infinite',
            }}>{greeting[lang] || greeting.ar}</div>
          )}
          <style>{`
            @keyframes sabahShine {
              0%   { background-position: 130% 0; }
              50%  { background-position: -30% 0; }
              100% { background-position: 130% 0; }
            }
          `}</style>

          {/* Arabic */}
          <div style={{
            fontFamily:'"QPC","Amiri Quran","Amiri",serif', fontSize:25, lineHeight:2.15,
            color:'#F6E8CC', direction:'rtl', textAlign:'justify', textAlignLast:'center', fontWeight:400,
            textShadow:'0 2px 16px rgba(0,0,0,0.55), 0 0 22px #B07F2E',
            letterSpacing:'0.005em',
          }}>{duaa.ar}</div>

          {/* Divider */}
          <div style={{ display:'flex', justifyContent:'center', alignItems:'center', gap:10, opacity:0.5 }}>
            <div style={{ width:40, height:0.5, background:'rgba(232,185,122,0.6)' }}/>
            <div style={{ width:4, height:4, borderRadius:'50%', background:'#E8B97A' }}/>
            <div style={{ width:40, height:0.5, background:'rgba(232,185,122,0.6)' }}/>
          </div>

          {/* Translation */}
          {lang !== 'ar' && (
            <div style={{
              fontFamily:'"Cormorant Garamond", serif', fontSize:15, fontStyle:'italic',
              color:T.textMuted, lineHeight:1.6, textAlign:'center',
            }}>{duaa[lang] || duaa.fr}</div>
          )}

          {/* Reference */}
          <div style={{
            fontFamily:'Amiri, serif', fontSize:13, color:T.gold, opacity:0.75,
            textAlign:'center', letterSpacing:'0.03em',
          }}>{duaa.ref}</div>
        </div>
        </div>

        {/* Share — minimal text + icon, no frame */}
        <button onClick={handleShare} style={{
          position:'relative', marginTop:22, flexShrink:0, alignSelf:'center',
          background:'transparent', border:'none', cursor:'pointer',
          display:'flex', alignItems:'center', gap:9, padding:'10px 14px',
          fontFamily:'Amiri, serif', fontSize:16, fontWeight:700,
          color:T.goldLight, letterSpacing:'0.04em',
        }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style={{ flexShrink:0 }}>
            <circle cx="13.5" cy="3.8" r="2.2" stroke="currentColor" strokeWidth="1.2"/>
            <circle cx="4.3" cy="9" r="2.2" stroke="currentColor" strokeWidth="1.2"/>
            <circle cx="13.5" cy="14.2" r="2.2" stroke="currentColor" strokeWidth="1.2"/>
            <path d="M6.3 7.9l5.2-3M6.3 10.1l5.2 3" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
          </svg>
          <span>{L.share}</span>
        </button>
      </div>

      {shareToast && (
        <div style={{
          position:'absolute', bottom:34, left:'50%', transform:'translateX(-50%)', zIndex:40,
          padding:'11px 20px', borderRadius:22, whiteSpace:'nowrap',
          background:'rgba(16,12,8,0.96)', backdropFilter:'blur(12px)', WebkitBackdropFilter:'blur(12px)',
          border:'0.5px solid rgba(232,200,140,0.4)', boxShadow:'0 12px 30px rgba(0,0,0,0.5), 0 0 18px rgba(201,124,46,0.3)',
          fontFamily: isAr ? 'Cairo,sans-serif' : 'Inter,sans-serif', fontSize:13, fontWeight:600, color:T.goldLight,
          display:'inline-flex', alignItems:'center', gap:8,
        }} onClick={(e) => e.stopPropagation()}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke={T.goldLight} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
          {shareToast}
        </div>
      )}
    </div>
  );
}

window.DuaaScreen = DuaaScreen;
</script><script>
/* أسماء الله الحسنى — 99 noms, translittération + sens (ar/fr/en/nl) */
window.ASMA_NAMES = [
{n:1,ar:"الرَّحْمَن",tr:"Ar-Rahman",mar:"الرحمن الذي وسعت رحمته كل شيء",fr:"Le Tout Miséricordieux",en:"The Most Compassionate",nl:"De Meest Barmhartige",duaaFr:"Ya Rahman, fais-moi miséricorde et enveloppe ma famille de Ta grâce.",duaaAr:"يا رحمن، ارحمني برحمتك الواسعة في الدنيا والآخرة."},
{n:2,ar:"الرَّحِيم",tr:"Ar-Rahim",mar:"الرحيم بعباده المؤمنين",fr:"Le Très Miséricordieux",en:"The Most Merciful",nl:"De Genadevolle",duaaFr:"Ya Rahim, accorde-moi Ta miséricorde ici-bas et dans l'au-delà.",duaaAr:"يا رحيم، ارحم ضعفي واغفر ذنبي وارزقني رحمتك."},
{n:3,ar:"الْمَلِك",tr:"Al-Malik",mar:"المالك لكل شيء المتصرف فيه",fr:"Le Souverain",en:"The King, The Sovereign",nl:"De Koning",duaaFr:"Ya Malik, purifie mon cœur et aide-moi à soumettre ma vie à Ton ordre.",duaaAr:"يا ملك، أصلح لي شأني كله، وتولَّ أمري بما تحب وترضى."},
{n:4,ar:"الْقُدُّوس",tr:"Al-Quddus",mar:"المنزّه عن كل نقص",fr:"Le Pur, le Saint",en:"The Most Holy",nl:"De Heilige",duaaFr:"Ya Qouddous, purifie mon âme de mes péchés et de mes mauvais penchants.",duaaAr:"يا قدوس، طهّر قلبي من الذنوب والهموم وكل ما لا يرضيك."},
{n:5,ar:"السَّلَام",tr:"As-Salam",mar:"السالم من كل عيب، مصدر السلام",fr:"La Paix, le Salut",en:"The Source of Peace",nl:"De Bron van Vrede",duaaFr:"Ya Salam, accorde la paix à mon esprit, à mon foyer et préserve-moi de tout mal.",duaaAr:"يا سلام، أنزل السكينة والسلام على قلبي وحياتي."},
{n:6,ar:"الْمُؤْمِن",tr:"Al-Mu'min",mar:"المصدّق لرسله، مانح الأمان",fr:"Le Rassurant, le Fidèle",en:"The Granter of Security",nl:"De Schenker van Veiligheid",duaaFr:"Ya Mo'min, accorde-moi la foi véritable et rassure mon cœur face à mes peurs.",duaaAr:"يا مؤمن، أمِّن قلبي من الخوف، وارزقني الأمن والإيمان."},
{n:7,ar:"الْمُهَيْمِن",tr:"Al-Muhaymin",mar:"الرقيب الحافظ على خلقه",fr:"Le Prépondérant, le Gardien",en:"The Guardian, The Overseer",nl:"De Beschermer",duaaFr:"Ya Mouhaymin, veille sur moi et protège-moi de ce qui m'est caché.",duaaAr:"يا مهيمن، احفظني بعنايتك من كل سوء وشر."},
{n:8,ar:"الْعَزِيز",tr:"Al-'Aziz",mar:"العزيز الذي لا يُغلَب",fr:"Le Tout-Puissant",en:"The Almighty",nl:"De Almachtige",duaaFr:"Ya 'Aziz, accorde-moi la force et la dignité face aux épreuves.",duaaAr:"يا عزيز، أعزني بطاعتك ولا تذلني بمعصيتك."},
{n:9,ar:"الْجَبَّار",tr:"Al-Jabbar",mar:"الجبار الذي تنفذ مشيئته",fr:"Le Contraignant, le Réparateur",en:"The Compeller",nl:"De Onweerstaanbare",duaaFr:"Ya Jabbar, répare ce qui est brisé dans ma vie et soigne mes blessures.",duaaAr:"يا جبار، اجبر كسري، واشفِ قلبي، وأصلح حالي."},
{n:10,ar:"الْمُتَكَبِّر",tr:"Al-Mutakabbir",mar:"المتكبر المتعالي عن صفات الخلق",fr:"Le Suprême, le Majestueux",en:"The Supreme, The Majestic",nl:"De Verhevene",duaaFr:"Ya Moutakabbir, éloigne de moi l'orgueil et préserve-moi de l'injustice.",duaaAr:"يا متكبر، طهّر قلبي من الكبر واجعلني متواضعًا لك."},
{n:11,ar:"الْخَالِق",tr:"Al-Khaliq",mar:"الخالق الموجِد لكل شيء من عدم",fr:"Le Créateur",en:"The Creator",nl:"De Schepper",duaaFr:"Ya Khaliq, façonne en moi un comportement noble et accorde-moi le bien.",duaaAr:"يا خالق، أصلح خلقي وخُلقي، وبارك لي في حياتي."},
{n:12,ar:"الْبَارِئ",tr:"Al-Bari'",mar:"البارئ المبدع للخلق على غير مثال",fr:"Le Producteur, le Novateur",en:"The Originator, The Maker",nl:"De Voortbrenger",duaaFr:"Ya Bari', harmonise ma vie et facilite-moi chaque entreprise.",duaaAr:"يا بارئ، أبرئ قلبي من كل مرض، وصدري من كل هم."},
{n:13,ar:"الْمُصَوِّر",tr:"Al-Musawwir",mar:"المصوّر الذي أعطى كل شيء صورته",fr:"Le Formateur",en:"The Fashioner of Forms",nl:"De Vormgever",duaaFr:"Ya Moussawwir, embellit mon caractère comme Tu as embelli ma création.",duaaAr:"يا مصور، حسّن خُلقي كما حسّنت خَلقي."},
{n:14,ar:"الْغَفَّار",tr:"Al-Ghaffar",mar:"الغفار الكثير المغفرة",fr:"Le Grand Pardonneur",en:"The All-Forgiving",nl:"De Vergevensgezinde",duaaFr:"Ya Ghaffar, pardonne mes péchés passés, présents et futurs.",duaaAr:"يا غفار، اغفر لي ذنوبي كلها سرّها وعلانيتها."},
{n:15,ar:"الْقَهَّار",tr:"Al-Qahhar",mar:"القهار الغالب لكل شيء",fr:"Le Dominateur suprême",en:"The Subduer",nl:"De Overwinnaar",duaaFr:"Ya Qahhar, soumets mes passions et protège-moi de l'oppression.",duaaAr:"يا قهار، اقهر عني شر نفسي وشر كل من أراد بي سوءًا."},
{n:16,ar:"الْوَهَّاب",tr:"Al-Wahhab",mar:"الوهاب الكثير العطاء بلا مقابل",fr:"Le Donateur suprême",en:"The Bestower",nl:"De Schenker",duaaFr:"Ya Wahhab, accorde-moi Tes bienfaits sans compter.",duaaAr:"يا وهّاب، هب لي من فضلك رزقًا طيبًا وفرحًا لا ينقطع."},
{n:17,ar:"الرَّزَّاق",tr:"Ar-Razzaq",mar:"الرزاق الذي يرزق جميع خلقه",fr:"Le Pourvoyeur",en:"The Provider",nl:"De Voorziener",duaaFr:"Ya Razzaq, bénis ma subsistance et accorde-moi un gain licite.",duaaAr:"يا رزاق، ارزقني رزقًا حلالًا واسعًا مباركًا فيه."},
{n:18,ar:"الْفَتَّاح",tr:"Al-Fattah",mar:"الفتاح الذي يفتح أبواب الرحمة والرزق",fr:"Celui qui ouvre (les portes)",en:"The Opener, The Judge",nl:"De Opener",duaaFr:"Ya Fattah, ouvre-moi les portes de la réussite et de Ta miséricorde.",duaaAr:"يا فتاح، افتح لي أبواب الخير والرزق والفرج."},
{n:19,ar:"الْعَلِيم",tr:"Al-'Alim",mar:"العليم بكل شيء ظاهرًا وباطنًا",fr:"L'Omniscient",en:"The All-Knowing",nl:"De Alwetende",duaaFr:"Ya 'Alim, augmente ma science et accorde-moi la sagesse.",duaaAr:"يا عليم، علّمني ما ينفعني وانفعني بما علمتني."},
{n:20,ar:"الْقَابِض",tr:"Al-Qabid",mar:"القابض الذي يقبض الرزق والأرواح بحكمته",fr:"Celui qui restreint",en:"The Withholder",nl:"De Terughoudende",duaaFr:"Ya Qabid, préserve-moi d'éparpiller mon énergie dans le faux.",duaaAr:"يا قابض، اقبض عني كل شر وضر، وثبّت قلبي على طاعتك."},
{n:21,ar:"الْبَاسِط",tr:"Al-Basit",mar:"الباسط الذي يبسط الرزق لمن يشاء",fr:"Celui qui étend (les biens)",en:"The Extender",nl:"De Uitbreider",duaaFr:"Ya Basit, élargis ma subsistance et épanouis ma poitrine.",duaaAr:"يا باسط، ابسط عليّ من رحمتك ورزقك وفضلك."},
{n:22,ar:"الْخَافِض",tr:"Al-Khafid",mar:"الخافض للمتكبرين والظالمين",fr:"Celui qui abaisse",en:"The Abaser",nl:"De Vernederaar",duaaFr:"Ya Khafidh, abaisse l'orgueil dans mon cœur et détruis le mal.",duaaAr:"يا خافض، اخفض عني كل بلاء، واحفظني من أسباب الهلاك."},
{n:23,ar:"الرَّافِع",tr:"Ar-Rafi'",mar:"الرافع لأوليائه بالطاعة",fr:"Celui qui élève",en:"The Exalter",nl:"De Verheffer",duaaFr:"Ya Rafi', élève ma station dans cette vie et au Paradis.",duaaAr:"يا رافع، ارفع قدري بالإيمان والعمل الصالح."},
{n:24,ar:"الْمُعِز",tr:"Al-Mu'izz",mar:"المعز الذي يمنح العزة لمن يشاء",fr:"Celui qui honore",en:"The Giver of Honor",nl:"De Eerverlener",duaaFr:"Ya Mo'izz, accorde-moi l'honneur par l'obéissance à Tes ordres.",duaaAr:"يا معز، أعزني بطاعتك وكرامتك، ولا تجعل عزتي في غيرك."},
{n:25,ar:"الْمُذِل",tr:"Al-Mudhill",mar:"المذل الذي يذل من يشاء بعدله",fr:"Celui qui humilie",en:"The Giver of Dishonor",nl:"De Onteraar",duaaFr:"Ya Moudhill, préserve-moi d'être humilié par mes propres fautes.",duaaAr:"يا مذل، أذلّ عني الباطل والشر، ولا تجعلني من أهل المعصية."},
{n:26,ar:"السَّمِيع",tr:"As-Sami'",mar:"السميع الذي يسمع كل شيء",fr:"Celui qui entend tout",en:"The All-Hearing",nl:"De Alhorende",duaaFr:"Ya Sami', écoute mes invocations et réponds à mes prières.",duaaAr:"يا سميع، اسمع دعائي واستجب لي، فإنك تسمع كل شيء."},
{n:27,ar:"الْبَصِير",tr:"Al-Basir",mar:"البصير الذي يرى كل شيء",fr:"Celui qui voit tout",en:"The All-Seeing",nl:"De Alziende",duaaFr:"Ya Basir, guide mes yeux vers le bien et protège-moi de l'aveuglement.",duaaAr:"يا بصير، أبصرني عيوبي وأصلح قلبي وأعمالي."},
{n:28,ar:"الْحَكَم",tr:"Al-Hakam",mar:"الحكم العدل الذي يفصل بين خلقه",fr:"Le Juge suprême",en:"The Judge",nl:"De Rechter",duaaFr:"Ya Hakam, juge entre nous avec justice et guide-moi vers la vérité.",duaaAr:"يا حكم، احكم لي بالخير، وارضّني بقضائك وقدرك."},
{n:29,ar:"الْعَدْل",tr:"Al-'Adl",mar:"العدل الذي لا يجور",fr:"Le Juste",en:"The Utterly Just",nl:"De Rechtvaardige",duaaFr:"Ya 'Adl, aide-moi à être juste envers moi-même et envers autrui.",duaaAr:"يا عدل، اجعلني عادلًا في قولي وفعلي، ولا تجعلني أظلم أحدًا."},
{n:30,ar:"اللَّطِيف",tr:"Al-Latif",mar:"اللطيف بعباده الرفيق بهم",fr:"Le Subtil, le Bienveillant",en:"The Subtle, The Gentle",nl:"De Zachtmoedige",duaaFr:"Ya Latif, sois bienveillant envers moi dans les moments difficiles.",duaaAr:"يا لطيف، الطف بي فيما جرت به المقادير، واختر لي الخير حيث كان."},
{n:31,ar:"الْخَبِير",tr:"Al-Khabir",mar:"الخبير العالم بحقائق الأمور",fr:"Le Parfaitement Informé",en:"The All-Aware",nl:"De Alwetende (van het verborgene)",duaaFr:"Ya Khabir, purifie mes intentions secrètes.",duaaAr:"يا خبير، أنت أعلم بحالي، فدبّر لي فإني لا أحسن التدبير."},
{n:32,ar:"الْحَلِيم",tr:"Al-Halim",mar:"الحليم الذي لا يعجل بالعقوبة",fr:"Le Longanime, le Clément",en:"The Forbearing",nl:"De Verdraagzame",duaaFr:"Ya Halim, ne te presse pas de me punir et accorde-moi la patience.",duaaAr:"يا حليم، احلم عن تقصيري، وارزقني حلمًا وصبرًا جميلًا."},
{n:33,ar:"الْعَظِيم",tr:"Al-'Azim",mar:"العظيم الذي لا شيء أعظم منه",fr:"L'Immense, le Magnifique",en:"The Magnificent",nl:"De Geweldige",duaaFr:"Ya 'Azim, mets dans mon cœur le respect profond de Ta grandeur.",duaaAr:"يا عظيم، عظّم الإيمان في قلبي، ولا تجعل الدنيا أكبر همي."},
{n:34,ar:"الْغَفُور",tr:"Al-Ghafur",mar:"الغفور الساتر لذنوب عباده",fr:"Le Très Pardonnant",en:"The Much-Forgiving",nl:"De Vergevende",duaaFr:"Ya Ghafour, efface mes fautes et couvre mes défauts.",duaaAr:"يا غفور، اغفر لي وارحمني وتجاوز عن سيئاتي."},
{n:35,ar:"الشَّكُور",tr:"Ash-Shakur",mar:"الشكور الذي يجازي على القليل بالكثير",fr:"Le Très Reconnaissant",en:"The Most Appreciative",nl:"De Waarderende",duaaFr:"Ya Shakour, accepte mes petites actions et décuple leurs récompenses.",duaaAr:"يا شكور، أعنّي على شكرك وذكرك وحسن عبادتك."},
{n:36,ar:"الْعَلِي",tr:"Al-'Ali",mar:"العلي الذي علا على كل شيء",fr:"Le Très Haut",en:"The Most High",nl:"De Allerhoogste",duaaFr:"Ya 'Aliyy, élève mon esprit au-dessus des vanités terrestres.",duaaAr:"يا علي، ارفع همتي ودرجتي، واجعلني من عبادك الصالحين."},
{n:37,ar:"الْكَبِير",tr:"Al-Kabir",mar:"الكبير الذي كل شيء دونه",fr:"Le Très Grand",en:"The Most Great",nl:"De Grootste",duaaFr:"Ya Kabir, rappelle-moi Ta grandeur face à tous mes soucis.",duaaAr:"يا كبير، كبّر في قلبي محبتك وتعظيمك، وصغّر في عيني الدنيا."},
{n:38,ar:"الْحَفِيظ",tr:"Al-Hafiz",mar:"الحفيظ الحافظ لكل شيء",fr:"Le Gardien vigilant",en:"The Preserver",nl:"De Behoeder",duaaFr:"Ya Hafiz, protège-moi, mes proches et ma foi.",duaaAr:"يا حفيظ، احفظني وأهلي ومن أحب من كل سوء."},
{n:39,ar:"الْمُقِيت",tr:"Al-Muqit",mar:"المقيت الذي يقيت الخلق ويقدر أقواتهم",fr:"Le Nourricier",en:"The Sustainer",nl:"De Onderhouder",duaaFr:"Ya Mouqit, alimente mon corps et mon âme de Ta lumière.",duaaAr:"يا مقيت، اكفني ما أهمني، وارزقني القوة والصبر."},
{n:40,ar:"الْحَسِيب",tr:"Al-Hasib",mar:"الحسيب الكافي لعباده المحاسب لهم",fr:"Celui qui suffit, qui règle les comptes",en:"The Reckoner",nl:"De Rekenaar",duaaFr:"Ya Hasib, facilite mon jugement au Jour Dernier.",duaaAr:"يا حسيب، كن حسبي في كل أمر، واكفني ما أهمني."},
{n:41,ar:"الْجَلِيل",tr:"Al-Jalil",mar:"الجليل ذو الجلال والعظمة",fr:"Le Majestueux",en:"The Majestic",nl:"De Majesteitelijke",duaaFr:"Ya Jalil, remplis mon âme d'émerveillement face à Ta majesté.",duaaAr:"يا جليل، ارزقني إجلالك وتعظيمك والخشوع بين يديك."},
{n:42,ar:"الْكَرِيم",tr:"Al-Karim",mar:"الكريم الكثير الخير والعطاء",fr:"Le Généreux, le Noble",en:"The Most Generous",nl:"De Edelmoedige",duaaFr:"Ya Karim, traite-moi selon Ta générosité et non selon mes mérites.",duaaAr:"يا كريم، أكرمني بفضلك، واغمرني بجودك ورحمتك."},
{n:43,ar:"الرَّقِيب",tr:"Ar-Raqib",mar:"الرقيب المراقب لكل شيء",fr:"Le Vigilant",en:"The Watchful",nl:"De Waakzame",duaaFr:"Ya Raqib, rappelle-moi que Tu me vois à chaque instant.",duaaAr:"يا رقيب، اجعلني أراقبك في السر والعلن."},
{n:44,ar:"الْمُجِيب",tr:"Al-Mujib",mar:"المجيب الذي يجيب دعاء عباده",fr:"Celui qui exauce",en:"The Responsive",nl:"De Verhoorder",duaaFr:"Ya Moujib, exauce mes du'as et soulage mon cœur.",duaaAr:"يا مجيب، أجب دعائي وحقق لي ما فيه الخير."},
{n:45,ar:"الْوَاسِع",tr:"Al-Wasi'",mar:"الواسع الذي وسع كل شيء علمًا ورحمة",fr:"L'Immensément Vaste",en:"The All-Encompassing",nl:"De Alomvattende",duaaFr:"Ya Wasi', élargis mon horizon et bénis mes ressources.",duaaAr:"يا واسع، وسّع عليّ في رزقي وصدري ورحمتي."},
{n:46,ar:"الْحَكِيم",tr:"Al-Hakim",mar:"الحكيم في خلقه وأمره",fr:"Le Sage",en:"The All-Wise",nl:"De Alwijze",duaaFr:"Ya Hakim, accorde-moi la sagesse de comprendre Tes décrets.",duaaAr:"يا حكيم، اختر لي ولا تخيرني، ودبّر لي فإنك أعلم بما يصلحني."},
{n:47,ar:"الْوَدُود",tr:"Al-Wadud",mar:"الودود المحب لأوليائه",fr:"Le Tout Aimant",en:"The Most Loving",nl:"De Liefhebbende",duaaFr:"Ya Wadoud, mets Ton amour dans mon cœur et fais que les pieux m'aiment.",duaaAr:"يا ودود، ارزقني حبك وحب من يحبك، واجعلني محبوبًا عندك."},
{n:48,ar:"الْمَجِيد",tr:"Al-Majid",mar:"المجيد العظيم في ذاته وصفاته",fr:"Le Tout Glorieux",en:"The Most Glorious",nl:"De Glorierijke",duaaFr:"Ya Majid, glorifié sois-Tu, accorde-moi une fin honorable.",duaaAr:"يا مجيد، اجعل لي نصيبًا من كرمك ومجدك وفضلك."},
{n:49,ar:"الْبَاعِث",tr:"Al-Ba'ith",mar:"الباعث الذي يبعث الخلق يوم القيامة",fr:"Celui qui ressuscite",en:"The Resurrector",nl:"De Opwekker",duaaFr:"Ya Ba'ith, ressuscite mon cœur par la foi et la lumière.",duaaAr:"يا باعث، ابعث في قلبي الهمة والإيمان، وأحيِ قلبي بطاعتك."},
{n:50,ar:"الشَّهِيد",tr:"Ash-Shahid",mar:"الشهيد الحاضر الذي لا يغيب عنه شيء",fr:"Le Témoin",en:"The Witness",nl:"De Getuige",duaaFr:"Ya Shahid, fais que mes paroles et mes actes témoignent en ma faveur.",duaaAr:"يا شهيد، اشهد لي بالإيمان والتوحيد والعمل الصالح."},
{n:51,ar:"الْحَق",tr:"Al-Haqq",mar:"الحق الثابت الذي لا يتغير",fr:"La Vérité, le Vrai",en:"The Absolute Truth",nl:"De Waarheid",duaaFr:"Ya Haqq, fixe-moi sur le chemin de la vérité.",duaaAr:"يا حق، ثبّتني على الحق ولا تجعلني من أهل الباطل."},
{n:52,ar:"الْوَكِيل",tr:"Al-Wakil",mar:"الوكيل الكفيل بأرزاق العباد",fr:"Le Garant, le Protecteur",en:"The Trustee, The Disposer",nl:"De Voogd",duaaFr:"Ya Wakil, je place toute ma confiance en Toi pour mes affaires.",duaaAr:"يا وكيل، توكلت عليك، فاكفني ما أهمني ودبّر لي أمري."},
{n:53,ar:"الْقَوِي",tr:"Al-Qawiyy",mar:"القوي الكامل القدرة",fr:"Le Très Fort",en:"The All-Strong",nl:"De Sterke",duaaFr:"Ya Qawiyy, accorde-moi la force physique et spirituelle.",duaaAr:"يا قوي، قوّني على طاعتك وعلى مواجهة كل ما يبعدني عنك."},
{n:54,ar:"الْمَتِين",tr:"Al-Matin",mar:"المتين الشديد القوة الذي لا يلحقه تعب",fr:"L'Inébranlable, le Ferme",en:"The Firm, The Steadfast",nl:"De Standvastige",duaaFr:"Ya Matin, raffermis ma foi face aux tentations.",duaaAr:"يا متين، ثبّت قلبي على دينك ولا تزلّه بعد إذ هديتني."},
{n:55,ar:"الْوَلِي",tr:"Al-Waliyy",mar:"الولي الناصر لعباده المؤمنين",fr:"Le Protecteur, l'Allié",en:"The Protecting Friend",nl:"De Beschermheer",duaaFr:"Ya Waliyy, sois mon allié et mon guide dans la vie.",duaaAr:"يا ولي، تولّني برعايتك، وكن معي في كل خطوة."},
{n:56,ar:"الْحَمِيد",tr:"Al-Hamid",mar:"الحميد المحمود في كل حال",fr:"Le Digne de louange",en:"The Praiseworthy",nl:"De Geprezene",duaaFr:"Ya Hamid, fais que ma langue Te loue en toute circonstance.",duaaAr:"يا حميد، اجعلني من الحامدين لك في السراء والضراء."},
{n:57,ar:"الْمُحْصِي",tr:"Al-Muhsi",mar:"المحصي الذي أحصى كل شيء عددًا",fr:"Celui qui dénombre tout",en:"The All-Enumerating",nl:"De Alberekenende",duaaFr:"Ya Mouhsi, aide-moi à rentabiliser mes jours dans Ton obéissance.",duaaAr:"يا محصي، لا تجعل عمري يضيع فيما لا ينفعني."},
{n:58,ar:"الْمُبْدِئ",tr:"Al-Mubdi'",mar:"المبدئ الذي بدأ الخلق",fr:"Celui qui commence (la création)",en:"The Originator",nl:"De Beginner",duaaFr:"Ya Moubdi', accorde-moi un renouveau bénéfique dans ma vie.",duaaAr:"يا مبدئ، ابدأ لي بداية خير، وافتح لي أبوابًا جديدة من فضلك."},
{n:59,ar:"الْمُعِيد",tr:"Al-Mu'id",mar:"المعيد الذي يعيد الخلق بعد الموت",fr:"Celui qui redonne vie",en:"The Restorer",nl:"De Hersteller",duaaFr:"Ya Mo'id, restaure la paix et la foi dans mon foyer.",duaaAr:"يا معيد، أعد إليّ كل خير فقدته، وأصلح لي ما فسد من أمري."},
{n:60,ar:"الْمُحْيِي",tr:"Al-Muhyi",mar:"المحيي الذي يهب الحياة",fr:"Celui qui donne la vie",en:"The Giver of Life",nl:"De Levengever",duaaFr:"Ya Mouhyi, donne vie à mon cœur par le Coran.",duaaAr:"يا محيي، أحْيِ قلبي بالإيمان والقرآن والطمأنينة."},
{n:61,ar:"الْمُمِيت",tr:"Al-Mumit",mar:"المميت الذي يقدّر الموت على خلقه",fr:"Celui qui donne la mort",en:"The Bringer of Death",nl:"De Doodbrenger",duaaFr:"Ya Moumit, fais-moi mourir en état de soumission et de foi.",duaaAr:"يا مميت، ارزقني حسن الخاتمة، واجعل آخر كلامي شهادة أن لا إله إلا الله."},
{n:62,ar:"الْحَي",tr:"Al-Hayy",mar:"الحي الدائم الذي لا يموت",fr:"Le Vivant",en:"The Ever-Living",nl:"De Levende",duaaFr:"Ya Hayy, fais vivre mon âme sous Ta bienveillance.",duaaAr:"يا حي، أصلح حياتي كلها، ولا تكلني إلى نفسي طرفة عين."},
{n:63,ar:"الْقَيُّوم",tr:"Al-Qayyum",mar:"القيوم القائم بنفسه المقيم لغيره",fr:"Le Subsistant par Soi",en:"The Self-Subsisting",nl:"De Zelfstandige",duaaFr:"Ya Qayyoum, soutiens-moi et règle tous mes problèmes.",duaaAr:"يا قيوم، أقِم حياتي على طاعتك، وكن لي في كل أمري."},
{n:64,ar:"الْوَاجِد",tr:"Al-Wajid",mar:"الواجد الذي لا يعوزه شيء",fr:"Celui qui trouve, l'Opulent",en:"The Perceiver, The Finder",nl:"De Vinder",duaaFr:"Ya Wajid, fais que je ne manque jamais de l'essentiel.",duaaAr:"يا واجد، أغنني بك عمن سواك، واجعل غناي في قلبي."},
{n:65,ar:"الْمَاجِد",tr:"Al-Majid",mar:"الماجد الواسع الكرم والمجد",fr:"Le Noble, le Glorieux",en:"The Noble, The Glorious",nl:"De Nobele",duaaFr:"Ya Majid, annoblis mon comportement et mes intentions.",duaaAr:"يا ماجد، أكرمني بكرمك، وبلّغني ما أتمنى إن كان خيرًا لي."},
{n:66,ar:"الْوَاحِد",tr:"Al-Wahid",mar:"الواحد الأحد المتفرد",fr:"L'Unique",en:"The One",nl:"De Enige",duaaFr:"Ya Wahid, préserve mon cœur du shirk et de l'association.",duaaAr:"يا واحد، وحّد قلبي عليك ولا تجعل فيه تعلقًا يبعدني عنك."},
{n:67,ar:"الْأَحَد",tr:"Al-Ahad",mar:"الأحد الفرد الذي لا نظير له",fr:"L'Un absolu",en:"The Indivisible One",nl:"De Ene",duaaFr:"Ya Ahad, fais que Ton unicité soit la plus grande certitude de mon cœur.",duaaAr:"يا أحد، اجعل توحيدك أعظم نعمة في قلبي، وثبّتني عليه."},
{n:68,ar:"الصَّمَد",tr:"As-Samad",mar:"الصمد الذي يُقصد في الحوائج",fr:"Le Soutien universel",en:"The Eternal Refuge",nl:"De Onafhankelijke",duaaFr:"Ya Samad, je me tourne vers Toi pour tous mes besoins.",duaaAr:"يا صمد، إليك أرفع حاجتي، فاقضِ حاجتي ولا تردني خائبًا."},
{n:69,ar:"الْقَادِر",tr:"Al-Qadir",mar:"القادر على كل شيء",fr:"Le Détenteur du pouvoir",en:"The Capable",nl:"De Machtige",duaaFr:"Ya Qadir, Tu es capable de tout, facilite-moi l'impossible.",duaaAr:"يا قادر، إنك على كل شيء قدير، فحقق لي الخير الذي أعجز عنه."},
{n:70,ar:"الْمُقْتَدِر",tr:"Al-Muqtadir",mar:"المقتدر الكامل القدرة",fr:"Le Tout-Puissant déterminant",en:"The Omnipotent",nl:"De Alvermogende",duaaFr:"Ya Mouqtadir, donne-moi la maîtrise de mon ego.",duaaAr:"يا مقتدر، بقدرتك فرّج همي ويسّر أمري."},
{n:71,ar:"الْمُقَدِّم",tr:"Al-Muqaddim",mar:"المقدّم الذي يقدّم ما يشاء",fr:"Celui qui met en avant",en:"The Expediter",nl:"De Bevorderaar",duaaFr:"Ya Mouqaddim, fais-moi avancer dans le bien.",duaaAr:"يا مقدم، قدّم لي الخير حيث كان، وقدّم لي ما يقربني إليك."},
{n:72,ar:"الْمُؤَخِّر",tr:"Al-Mu'akhkhir",mar:"المؤخّر الذي يؤخّر ما يشاء",fr:"Celui qui diffère",en:"The Delayer",nl:"De Uitsteller",duaaFr:"Ya Mou'akhkhir, éloigne-moi du mal et des mauvaises fréquentations.",duaaAr:"يا مؤخر، أخّر عني كل شر، واصرف عني ما لا خير فيه."},
{n:73,ar:"الْأَوَّل",tr:"Al-Awwal",mar:"الأول الذي ليس قبله شيء",fr:"Le Premier",en:"The First",nl:"De Eerste",duaaFr:"Ya Awwal, fais que Tu sois la priorité dans ma vie.",duaaAr:"يا أول، اجعل أول أمري طاعة، وأول قلبي محبتك."},
{n:74,ar:"الْآخِر",tr:"Al-Akhir",mar:"الآخر الذي ليس بعده شيء",fr:"Le Dernier",en:"The Last",nl:"De Laatste",duaaFr:"Ya Akhir, fais que ma dernière parole soit l'attestation de foi.",duaaAr:"يا آخر، اجعل خاتمة أمري خيرًا، واختم لي بالصالحات."},
{n:75,ar:"الظَّاهِر",tr:"Az-Zahir",mar:"الظاهر الذي دلّت عليه آياته",fr:"L'Apparent, le Manifeste",en:"The Manifest",nl:"De Zichtbare",duaaFr:"Ya Zahir, montre-moi les signes de Ta grandeur.",duaaAr:"يا ظاهر، أظهر لي الحق واهدني إليه."},
{n:76,ar:"الْبَاطِن",tr:"Al-Batin",mar:"الباطن الذي احتجب عن الأبصار",fr:"Le Caché, l'Intime",en:"The Hidden",nl:"De Verborgene",duaaFr:"Ya Batin, purifie mes pensées intimes.",duaaAr:"يا باطن، أصلح سريرتي وقلبي، وطهّر ما خفي عن الناس."},
{n:77,ar:"الْوَالِي",tr:"Al-Wali",mar:"الوالي المتولي لأمور خلقه",fr:"Le Maître, le Gouverneur",en:"The Governor",nl:"De Bestuurder",duaaFr:"Ya Wali, prends en charge ma vie et dirige mes pas.",duaaAr:"يا والي، تولّ أمري وأمري من أحب، واختر لنا الخير."},
{n:78,ar:"الْمُتَعَالِي",tr:"Al-Muta'ali",mar:"المتعالي عن كل نقص",fr:"Le Sublime, le Transcendant",en:"The Most Exalted",nl:"De Verhevene",duaaFr:"Ya Mouta'ali, élève-moi au-dessus des péchés.",duaaAr:"يا متعالي، نزّه قلبي عن كل ما لا يليق، وارفعني بطاعتك."},
{n:79,ar:"الْبَر",tr:"Al-Barr",mar:"البر المحسن إلى عباده",fr:"Le Bienfaisant",en:"The Source of Goodness",nl:"De Weldoener",duaaFr:"Ya Barr, accorde-moi Ta bonté et rends-moi bon envers mes parents.",duaaAr:"يا بر، أحسن إليّ كما تحسن إلى عبادك، وارزقني برك ورضاك."},
{n:80,ar:"التَّوَّاب",tr:"At-Tawwab",mar:"التواب الذي يقبل توبة عباده",fr:"Celui qui accueille le repentir",en:"The Accepter of Repentance",nl:"De Berouwaanvaardende",duaaFr:"Ya Tawwab, accepte mon repentir sincère.",duaaAr:"يا تواب، تب عليّ توبة نصوحًا لا أعود بعدها إلى الذنب."},
{n:81,ar:"الْمُنْتَقِم",tr:"Al-Muntaqim",mar:"المنتقم من الظالمين بعدله",fr:"Le Vengeur (des injustes)",en:"The Avenger",nl:"De Wreker",duaaFr:"Ya Mountaqim, protège-moi des oppresseurs.",duaaAr:"يا منتقم، اكفني ظلم الظالمين، وانصرني بالحق دون ظلم أو عدوان."},
{n:82,ar:"الْعَفُو",tr:"Al-'Afuww",mar:"العفو الذي يمحو الذنوب",fr:"Celui qui efface les péchés",en:"The Pardoner",nl:"De Kwijtschelder",duaaFr:"Ya 'Afouww, Tu aimes le pardon, alors pardonne-moi.",duaaAr:"يا عفو، اعفُ عني وامحُ ذنوبي كأنها لم تكن."},
{n:83,ar:"الرَّؤُوف",tr:"Ar-Ra'uf",mar:"الرؤوف الرحيم بعباده",fr:"Le Très Bienveillant",en:"The Most Kind",nl:"De Meelevende",duaaFr:"Ya Ra'ouf, traite-moi avec douceur et compassion.",duaaAr:"يا رؤوف، ارفق بي وارحمني، وألهمني الرفق بعبادك."},
{n:84,ar:"مَالِكُ الْمُلْك",tr:"Malik-ul-Mulk",mar:"مالك الملك المتصرف في ملكه كيف يشاء",fr:"Le Maître absolu de la royauté",en:"Master of the Kingdom",nl:"Meester van het Koninkrijk",duaaFr:"Ya Malik al-Moulk, bénis ce que Tu m'as accordé.",duaaAr:"يا مالك الملك، آتني من فضلك ما فيه خير لي، ولا تجعل الدنيا تملك قلبي."},
{n:85,ar:"ذُو الْجَلَالِ وَالْإِكْرَام",tr:"Dhul-Jalali wal-Ikram",mar:"ذو الجلال والإكرام صاحب العظمة والفضل",fr:"Le Détenteur de la Majesté et de la Générosité",en:"Lord of Majesty and Bounty",nl:"Heer van Majesteit en Vrijgevigheid",duaaFr:"Ya Dhou al-Jalali wa al-Ikram, accorde-moi Tes dons précieux.",duaaAr:"يا ذا الجلال والإكرام، أكرمني برضاك والجنة، وأجرني من النار."},
{n:86,ar:"الْمُقْسِط",tr:"Al-Muqsit",mar:"المقسط العادل في حكمه",fr:"L'Équitable",en:"The Equitable",nl:"De Billijke",duaaFr:"Ya Mouqsit, aide-moi à toujours agir avec justice.",duaaAr:"يا مقسط، ارزقني العدل والإنصاف، واجعلني سببًا للخير بين الناس."},
{n:87,ar:"الْجَامِع",tr:"Al-Jami'",mar:"الجامع للخلق ليوم الحساب",fr:"Celui qui rassemble",en:"The Gatherer",nl:"De Verzamelaar",duaaFr:"Ya Jami', rassemble-moi avec les pieux au Paradis.",duaaAr:"يا جامع، اجمع لي خير الدنيا والآخرة، واجمع قلبي على طاعتك."},
{n:88,ar:"الْغَنِي",tr:"Al-Ghaniyy",mar:"الغني عن كل ما سواه",fr:"Le Riche, l'Autosuffisant",en:"The Self-Sufficient",nl:"De Zelfvoorzienende",duaaFr:"Ya Ghaniyy, passe-moi de dépendre des hommes grâce à Ta richesse.",duaaAr:"يا غني، أغنني بحلالك عن حرامك، وبفضلك عمن سواك."},
{n:89,ar:"الْمُغْنِي",tr:"Al-Mughni",mar:"المغني الذي يُغني من يشاء",fr:"Celui qui enrichit",en:"The Enricher",nl:"De Verrijker",duaaFr:"Ya Moughni, enrichis mon cœur de contentement et de foi.",duaaAr:"يا مغني، أغنني من فضلك، وأغنِ قلبي بالإيمان والرضا."},
{n:90,ar:"الْمَانِع",tr:"Al-Mani'",mar:"المانع الذي يمنع ما يشاء بحكمته",fr:"Celui qui préserve, qui empêche",en:"The Preventer",nl:"De Verhinderaar",duaaFr:"Ya Mani', préserve-moi des épreuves et du malheur.",duaaAr:"يا مانع، امنع عني الشر والبلاء، واصرف عني كل ما يؤذيني."},
{n:91,ar:"الضَّار",tr:"Ad-Darr",mar:"الضار الذي يقدّر الضرّ بحكمته",fr:"Celui qui peut nuire (par sagesse)",en:"The Distresser",nl:"De Schadeberokkenaar",duaaFr:"Ya Darr, détourne de moi tout mal préjudiciable.",duaaAr:"يا ضار، إن مسني ضر فلا كاشف له إلا أنت، فاكشف عني الضر."},
{n:92,ar:"النَّافِع",tr:"An-Nafi'",mar:"النافع الذي يقدّر النفع لعباده",fr:"Celui qui accorde le bienfait",en:"The Benefactor",nl:"De Begunstiger",duaaFr:"Ya Nafi', fais que tout ce que j'apprends me soit utile.",duaaAr:"يا نافع، انفعني بما علّمتني، وارزقني ما ينفعني في ديني ودنياي."},
{n:93,ar:"النُّور",tr:"An-Nur",mar:"النور الذي نوّر السماوات والأرض",fr:"La Lumière",en:"The Light",nl:"Het Licht",duaaFr:"Ya Nour, illumine mon cœur, mes yeux et mon chemin.",duaaAr:"يا نور السماوات والأرض، نوّر قلبي بنور الإيمان والقرآن."},

  // ─── Onboarding flow — each step is a mini-tasbih: tap button = +1, target reached → next step ──
  function FirstRun({ lang, setLang, onDone, onSettings, onMenu, onBrightness }) {
    const [step, setStep] = useState(0);
    const [count, setCount] = useState(0);
    const [eyesClosed, setEyesClosed] = useState(() => !!loadState().eyesClosedMode);
    const I = window.I18N[lang];
    const isAr = lang === 'ar';

    const toggleEyesClosed = () => {
      setEyesClosed(v => {
        const next = !v;
        const s = loadState(); s.eyesClosedMode = next; saveState(s);
        if (navigator.vibrate) try { navigator.vibrate(next ? [10, 40, 10] : 10); } catch {}
        if (next && window.AlaeSpeak) window.AlaeSpeak('وَضْعُ العَيْنَيْنِ المُغْمَضَتَيْنِ مُفَعَّل');
        return next;
      });
    };

    // Targets per onboarding step (correspond to dhikrs shown on screen)
    const targets = [33, 33, 100]; // subhanAllah=33, La ilaha=33, astaghfirullah=100

    const handleTap = () => {
      const target = targets[step];
      const next = count + 1;
      const eyesClosed = !!loadState().eyesClosedMode;
      try { if (window.AlaeHaptic) window.AlaeHaptic('heavy'); } catch {}
      try { if (window.alaeClick) window.alaeClick(); } catch {}
      if (navigator.vibrate) try { navigator.vibrate(35); } catch {}
      if (next >= target) {
        // Cycle complete — vibrate stronger and advance
        if (navigator.vibrate) try { navigator.vibrate([20, 60, 100]); } catch {}
        if (eyesClosed && window.AlaeSpeak) window.AlaeSpeak('تَمَّ الوُصولُ لِلهَدَف. ' + next);
        if (step < 2) {
          setTimeout(() => {
            setStep(step + 1);
            setCount(0);
          }, 400);
          setCount(next);
        } else {
          // Last step — finish onboarding
          setTimeout(() => onDone(), 500);
          setCount(next);
        }
      } else {
        if (eyesClosed && window.AlaeSpeak) window.AlaeSpeak(String(next));
        setCount(next);
      }
    };

    // Navigation par glissement (swipe) — comme les autres pages
    const goNextStep = () => { if (step < 2) { setStep(step + 1); setCount(0); } else { onDone(); } };
    const goPrevStep = () => { if (step > 0) { setStep(step - 1); setCount(0); } };
    const sw = React.useRef({ x:0, y:0, down:false, swiped:false });
    const onPointerDown = (e) => { sw.current = { x:e.clientX||0, y:e.clientY||0, down:true, swiped:false }; };
    const onPointerMove = (e) => {
      if (!sw.current.down || sw.current.swiped) return;
      const dx = (e.clientX||0) - sw.current.x;
      const dy = (e.clientY||0) - sw.current.y;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        sw.current.swiped = true;
        if (dx < 0) goNextStep(); else goPrevStep();
      }
    };
    const onPointerUp = () => { sw.current.down = false; };
    const onTouchStart = (e) => { const t=e.touches[0]; sw.current = { x:t.clientX, y:t.clientY, down:true, swiped:false }; };
    const onTouchMove = (e) => {
      if (!sw.current.down || sw.current.swiped) return;
      const t = e.touches[0];
      const dx = t.clientX - sw.current.x;
      const dy = t.clientY - sw.current.y;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        sw.current.swiped = true;
        if (dx < 0) goNextStep(); else goPrevStep();
      }
    };
    const onTouchEnd = () => { sw.current.down = false; };

    return (
      <div style={{ position:'absolute', inset:0, touchAction:'pan-y' }}
        onPointerDown={onPointerDown} onPointerMove={onPointerMove}
        onPointerUp={onPointerUp} onPointerLeave={onPointerUp}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd} onTouchCancel={onTouchEnd}>
        <window.Onboarding
          step={step}
          lang={lang}
          count={count}
          target={targets[step]}
          onContinue={handleTap}
          onMenu={onMenu}
          onBrightness={onBrightness}
          onSkip={onDone}
        />
        <button
          onClick={(e) => { e.stopPropagation(); toggleEyesClosed(); }}
          aria-label={eyesClosed ? 'eyeClosed' : 'eyeOpen'}
          style={{
            position:'absolute', top:'calc(max(env(safe-area-inset-top, 0px), 44px) + 66px)', left:18, zIndex:100,
            width:44, height:44, borderRadius:22, padding:0, cursor:'pointer',
            background:'transparent', border:'1px solid rgba(232,185,122,0.55)',
            color:'rgba(232,185,122,0.95)',
            display:'flex', alignItems:'center', justifyContent:'center',
          }}>
          {eyesClosed ? (
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
              <path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
              <path d="M2 13 14 2" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
              <circle cx="8" cy="8" r="2" stroke="currentColor" strokeWidth="1.1"/>
            </svg>
          ) : (
            <svg width="17" height="17" viewBox="0 0 16 16" fill="none">
              <path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/>
              <circle cx="8" cy="8" r="2" fill="currentColor" fillOpacity="0.5" stroke="currentColor" strokeWidth="1.1"/>
            </svg>
          )}
        </button>
      </div>
    );
  }

  // ─── Main compteur view — picks variant by dhikrIdx ────────────────
  function CompteurView({ lang, onMenu, onCycleBrightness }) {
    const isAr = lang === 'ar';
    const [dhikrIdx, setDhikrIdx] = useState(() => loadState().dhikrIdx || 0);
    const [eyesClosed, setEyesClosed] = useState(() => !!loadState().eyesClosedMode);

    // Verrouillage écran actif pendant le compteur (évite que l'écran s'éteigne en comptant)
    React.useEffect(() => {
      let wakeLock = null;
      let cancelled = false;
      const requestLock = async () => {
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
          }
        } catch (e) {}
      };
      requestLock();
      const onVisibility = () => {
        if (!cancelled && document.visibilityState === 'visible' && !wakeLock) requestLock();
      };
      document.addEventListener('visibilitychange', onVisibility);
      return () => {
        cancelled = true;
        document.removeEventListener('visibilitychange', onVisibility);
        if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
      };
    }, []);

    // Tous les dhikr utilisent la même mise en page V1 (la plus claire, bien centrée)
    const variant = 0;
    const Layout = window.CompteurV1;

    const handleDhikrChange = (idx) => {
      setDhikrIdx(idx);
      const s = loadState();
      s.dhikrIdx = idx;
      saveState(s);
      try { const dd = window.DHIKRS[idx]; if (dd && window.syncWidgetSibha) window.syncWidgetSibha(dd.id); } catch (_) {}
    };

    const toggleEyesClosed = () => {
      setEyesClosed(v => {
        const next = !v;
        const s = loadState(); s.eyesClosedMode = next; saveState(s);
        if (navigator.vibrate) try { navigator.vibrate(next ? [10, 40, 10] : 10); } catch {}
        if (next && window.AlaeSpeak) window.AlaeSpeak('وَضْعُ العَيْنَيْنِ المُغْمَضَتَيْنِ مُفَعَّل');
        return next;
      });
    };

    return (
      <>
        <Layout
          key={`v${variant}`}
          lang={lang}
          controlledDhikrIdx={dhikrIdx}
          onDhikrChange={handleDhikrChange}
          eyesClosed={eyesClosed}
        />
        <CornerButton side={isAr ? 'right' : 'left'} icon="menu" onClick={onMenu} isAr={isAr} top={30} />
        <CornerButton side={isAr ? 'left' : 'right'} icon="brightness" onClick={onCycleBrightness} isAr={isAr} top={30} />
        <CornerButton side={isAr ? 'left' : 'right'} icon={eyesClosed ? 'eyeClosed' : 'eyeOpen'} onClick={toggleEyesClosed} isAr={isAr} top={85} />
      </>
    );
  }

  // ─── Top-level app ─────────────────────────────────────────────────
  function MisbahaApp() {
    const [state, setState] = useState(() => loadState());
    const [route, setRoute] = useState('compteur');
    const [drawerOpen, setDrawerOpen] = useState(false);
    const [showSplash, setShowSplash] = useState(false);
    const [showDuaa, setShowDuaa] = useState(() => typeof window === 'undefined' || !window.__alaeLeger);
    const [bootDone, setBootDone] = useState(() => (typeof window !== 'undefined' && !!window.__bootIntroDone));
    const [forceOnboarding, setForceOnboarding] = useState(false);
    const [showNiyya, setShowNiyya] = useState(() => typeof window === 'undefined' || !window.__alaeLeger);
    const [brightness, setBrightness] = useState(() => loadState().brightness ?? 1);
    const [darkMode, setDarkMode] = useState(() => loadState().darkMode || 'off');
    const [theme, setTheme] = useState(() => { const t = loadState().theme; return (!t || t === 'royal' || t === 'rose') ? 'gold' : t; });
    const [showCustomModal, setShowCustomModal] = useState(false);
    const [editingDhikr, setEditingDhikr] = useState(null);
    const [showDhikrDetail, setShowDhikrDetail] = useState(null);
    const [nightToast, setNightToast] = useState(false);

    // Listen for darkMode/theme setting changes from Settings page
    useEffect(() => {
      const sync = () => {
        const s = loadState();
        const m = s.darkMode || 'off';
        const t = (!s.theme || s.theme === 'rose') ? 'gold' : s.theme;
        if (m !== darkMode) setDarkMode(m);
        if (t !== theme) setTheme(t);
      };
      const id = setInterval(sync, 800);
      window.addEventListener('storage', sync);
      return () => { clearInterval(id); window.removeEventListener('storage', sync); };
    }, [darkMode, theme]);

    // Au lancement (et à chaque retour au premier plan) : reprogramme l'adhan
    // depuis les horaires en cache, sans attendre que l'utilisateur ouvre l'écran Horaires.
    useEffect(() => {
      const envoyer = () => {
        try {
          const b = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.alae;
          if (!b) return;
          const c = JSON.parse(localStorage.getItem('alae.prayer.timings') || 'null');
          const jours = window.alaeJoursEnCache();
          if (!c && !jours) return;
          const s = loadState();
          b.postMessage({
            type: 'updateNotifications',
            enabled: s.notifEnabled === true,
            minutesBefore: (s.notifBefore ?? 0),
            reciter: s.notifReciter || 'kouchi',
            timings: (c && c.timings) || {},
            days: jours || [],
            date: (c && c.date) || '',
            city: (c && c.city) || '',
          });
        } catch (e) {}
      };
      envoyer();
      // Renouvelle la fenêtre de 14 jours, puis reprogramme dessus.
      try { window.alaeRafraichirCalendrier().then(function(j){ if (j && j.length) envoyer(); }); } catch (e) {}
      const onVisible = () => { if (!document.hidden) envoyer(); };
      document.addEventListener('visibilitychange', onVisible);
      return () => document.removeEventListener('visibilitychange', onVisible);
    }, []);

    // Compute effective dark state (auto = night 18h-6h)
    const isNightMode = darkMode === 'on' ||
      (darkMode === 'auto' && (() => { const h = new Date().getHours(); return h >= 18 || h < 6; })());

    // ── Toast quand le mode nuit se déclenche (boot la nuit OU bascule jour→nuit) ──
    const prevNightRef = React.useRef(undefined);
    useEffect(() => {
      const prev = prevNightRef.current;
      // affiche au tout premier rendu si on est déjà la nuit, ou à chaque bascule false→true
      if (isNightMode && prev !== true) {
        setNightToast(true);
        const id = setTimeout(() => setNightToast(false), 3800);
        prevNightRef.current = isNightMode;
        return () => clearTimeout(id);
      }
      prevNightRef.current = isNightMode;
    }, [isNightMode]);

    // Apply theme + night mode + brightness — combinés (la luminosité marche TOUJOURS)
    useEffect(() => {
      const root = document.documentElement;
      // Teinte de base selon le thème
      let hue = '', sat = 1.32, con = 1.13, veilRGB = '11,13,16', brBoost = 1, veilBoost = 0, veilOff = false;
      if (theme === 'bordeaux') { hue = ' hue-rotate(-18deg)'; sat = 0.95; con = 1.03; veilRGB = '34,22,12'; }
      else if (theme === 'nuit') { hue = ''; sat = 1.0; con = 1.06; veilRGB = '9,11,14'; }
      else if (theme === 'bahrayn') { hue = ''; sat = 1.08; con = 1.04; veilRGB = '5,22,26'; brBoost = 0.92; veilBoost = 0; }
      else if (theme === 'amouage') { hue = ''; sat = 1.06; con = 1.05; veilRGB = '4,18,24'; brBoost = 1; veilBoost = 0; veilOff = true; }
      else if (theme === 'rose') { hue = ' hue-rotate(-58deg)'; sat = 1.1; con = 1.03; veilRGB = '42,16,24'; }
      else if (theme === 'copper') { hue = ' hue-rotate(-9deg)'; sat = 1.34; con = 1.12; veilRGB = '30,16,9'; }
      // Multiplicateur de luminosité (0=tamisé · 1=normal · 2=lumineux)
      const brMult = [0.55, 0.74, 1.06][brightness] != null ? [0.55, 0.74, 1.06][brightness] : 0.74;
      const veilA  = [0.46, 0.40, 0.20][brightness] != null ? [0.46, 0.40, 0.20][brightness] : 0.40;
      let mult = brMult * brBoost, a = Math.min(0.9, veilA + veilBoost), s2 = sat;
      if (isNightMode) { mult = brMult * brBoost * 0.6; a = Math.min(0.86, veilA + veilBoost + 0.34); if (!hue) s2 = 0.85; }
      root.style.setProperty('--silk-filter', `brightness(${mult.toFixed(2)}) saturate(${s2}) contrast(${con})${hue}`);
      root.style.setProperty('--silk-veil', veilOff ? 'rgba(0,0,0,0)' : `rgba(${veilRGB},${a.toFixed(2)})`);
      // Fond d'écran associé au thème
      const img = (window.ALAE_FONDS && window.ALAE_FONDS[theme]) || 'assets/silk-bg-inline.jpg';
      window.ALAE_SILK = img;
      root.style.setProperty('--silk-img', `url("${img}")`);
      // Thèmes photographiques (Al-Bahrayn, Amouage) : voile serré sur les bords,
      // l'eau reste nette au centre. Tout thème qui définit son voile le reçoit ici.
      if (window.ALAE_VOILES && window.ALAE_VOILES[theme]) {
        root.style.setProperty('--silk-vignette', window.ALAE_VOILES[theme]);
        root.style.setProperty('--silk-vignette-soft', window.ALAE_VOILES_DOUX[theme]);
      } else {
        root.style.removeProperty('--silk-vignette');
        root.style.removeProperty('--silk-vignette-soft');
      }
    }, [brightness, isNightMode, theme]);

    // Expose to compteur Header tap
    React.useEffect(() => {
      window.__openDhikrDetail = (idx) => setShowDhikrDetail(idx);
      return () => { delete window.__openDhikrDetail; };
    }, []);

    // Hydrate window.DHIKRS with saved user-created dhikrs on first boot
    useEffect(() => {
      try {
        const s = loadState();
        if (Array.isArray(s.userDhikrs)) {
          const existingIds = new Set(window.DHIKRS.map(d => d.id));
          for (const d of s.userDhikrs) {
            if (!existingIds.has(d.id)) window.DHIKRS.push(d);
          }
        }
      } catch {}
    }, []);

    // Langue verrouillée sur une clé réellement présente dans I18N (sinon fallback 'ar') — évite tout crash
    const lang = (window.I18N && window.I18N[state.lang]) ? state.lang : 'ar';
    const isAr = lang === 'ar';

    // (luminosité gérée dans l'effet combiné ci-dessus)

    const cycleBrightness = () => {
      const next = (brightness + 1) % 3;
      setBrightness(next);
      const s = loadState(); s.brightness = next; saveState(s);
    };

    // Bismillah splash — stays until user taps anywhere
    useEffect(() => {
      // No auto-dismiss anymore — user taps to continue
    }, []);

    const setLang = (l) => {
      // n'accepte que les langues disponibles dans I18N
      const safe = (window.I18N && window.I18N[l]) ? l : 'ar';
      const next = { ...state, lang: safe, langSet: true };
      setState(next); saveState(next);
    };
    const finishOnboarding = () => {
      const next = { ...state, onboarded: true };
      setState(next); saveState(next);
      setForceOnboarding(false);
    };

    const go = (r) => {
      if (r === 'onboarding') {
        setForceOnboarding(true);
        setDrawerOpen(false);
        return;
      }
      if (r === 'custom') {
        setShowCustomModal(true);
        setDrawerOpen(false);
        return;
      }
      setRoute(r);
      setDrawerOpen(false);
    };

    // ── Hook de capture App Store (actif uniquement avec ?shot dans l'URL) ──
    React.useEffect(() => {
      if (typeof window === 'undefined' || !/[?&]shot/.test(window.location.search)) return;
      // Sauter toutes les intros pour aller droit aux écrans
      setShowSplash(false); setShowDuaa(false); setShowNiyya(false); setBootDone(true);
      window.__shot = {
        go: (r) => { setShowDuaa(false); setShowNiyya(false); go(r); },
        duaa: () => { setShowDuaa(false); setShowNiyya(false); setRoute('duaa'); },
        niyya: () => { setShowDuaa(false); setShowNiyya(true); },
      };
      return () => { try { delete window.__shot; } catch (e) {} };
    }, []);

    // ── In-app Bismillah splash — auto-dismiss after 2.5s (tap also works) ──
    React.useEffect(() => {
      if (!showSplash) return;
      const t = setTimeout(() => { setShowSplash(false); setShowDuaa(true); }, 2500);
      return () => clearTimeout(t);
    }, [showSplash]);

    // ── Attendre la fin de l'intro Bismillah (boot-intro) avant de chronométrer le Dou'a ──
    React.useEffect(() => {
      if (bootDone) return;
      const onDone = () => setBootDone(true);
      window.addEventListener('boot-intro-done', onDone);
      const fallback = setTimeout(() => setBootDone(true), 7200); // filet de sécurité
      return () => { window.removeEventListener('boot-intro-done', onDone); clearTimeout(fallback); };
    }, [bootDone]);

    // ── Daily Dou'a splash — apparaît APRÈS l'intro, reste ~5s puis laisse place à la niyya ──
    React.useEffect(() => {
      if (!showDuaa || !bootDone) return;
      const t = setTimeout(() => setShowDuaa(false), 7000);
      return () => clearTimeout(t);
    }, [showDuaa, bootDone]);

    if (showSplash) {
      const dismiss = () => { setShowSplash(false); setShowDuaa(true); };
      return (
        <div
          style={{ ...frameStyle(), cursor:'pointer' }}
          onClick={dismiss}
          onPointerDown={dismiss}
          onTouchStart={dismiss}
        >
          <window.Splash phase={0} lang={lang} />
          {/* Full-screen tap catcher — receives all events, ignores child pointer-events */}
          <div
            onClick={dismiss}
            onPointerDown={dismiss}
            onTouchStart={dismiss}
            style={{
              position:'absolute', inset:0, zIndex:9999,
              cursor:'pointer', WebkitTapHighlightColor:'transparent',
              background:'transparent',
            }}
          />
          {/* Hint at bottom — "tap to continue" */}
          <div style={{
            position:'absolute', bottom: 16, left:0, right:0, textAlign:'center',
            fontFamily:'Inter, sans-serif', fontSize:11, letterSpacing:'0.4em',
            color:'rgba(232,200,140,0.85)', textTransform:'uppercase', pointerEvents:'none',
            animation:'tapHint 2.2s ease-in-out infinite',
            zIndex: 10000, fontWeight:500,
          }}>
            {isAr ? '· اضغط للمتابعة ·' : '· Tap to continue ·'}
          </div>
          <style>{`@keyframes tapHint { 0%, 100% { opacity: 0.5 } 50% { opacity: 1 } }`}</style>
        </div>
      );
    }

    // ── Daily Dou'a splash (random, tap to continue, auto-dismiss after 6s) ──
    if (showDuaa) {
      return (
        <div style={frameStyle()}>
          <window.DuaaScreen lang={lang} randomDuaa={false} onTap={() => setShowDuaa(false)} />
        </div>
      );
    }

    // —— Niyya (intention) — s'affiche AVANT le compteur, à chaque ouverture ; menu identique aux autres pages ; fin → direct au 3adad ——
    if (showNiyya || forceOnboarding || !state.onboarded) {
      const leaveNiyya = () => {
        if (!state.onboarded) finishOnboarding();
        // À l'ouverture, le compteur démarre toujours sur سبحان الله (index 0)
        try { const s = loadState(); s.dhikrIdx = 0; saveState(s); } catch (_) {}
        setForceOnboarding(false);
        setShowNiyya(false);
      };
      return (
        <div style={frameStyle()}>
          <FirstRun
            lang={lang}
            setLang={setLang}
            onDone={() => { leaveNiyya(); setRoute('compteur'); }}
            onMenu={() => setDrawerOpen(true)}
            onBrightness={cycleBrightness}
          />
          <NavDrawer
            open={drawerOpen}
            lang={lang}
            isAr={isAr}
            onClose={() => setDrawerOpen(false)}
            onGo={(r) => {
              if (r === 'onboarding') { setDrawerOpen(false); return; }
              leaveNiyya();
              go(r);
            }}
          />
        </div>
      );
    }

    return (
      <div style={frameStyle()}>
        {/* Main routes */}
        {route === 'compteur' && (
          <CompteurView
            lang={lang}
            onMenu={() => setDrawerOpen(true)}
            onCycleBrightness={cycleBrightness}
          />
        )}
        {route === 'library' && (
          <ScreenWithBack onBack={() => go('compteur')} isAr={isAr} backTop={64}>
            <window.LibraryScreen lang={lang}
              onAddDhikr={() => { setEditingDhikr(null); setShowCustomModal(true); }}
              onEdit={(d) => { setEditingDhikr(d); setShowCustomModal(true); }} />
          </ScreenWithBack>
        )}
        {route === 'history' && (
          <ScreenWithBack onBack={() => go('compteur')} isAr={isAr} backTop={74}>
            <window.HistoryScreen lang={lang} />
          </ScreenWithBack>
        )}
        {route === 'community' && (
          <window.CommunityScreen lang={lang} onBack={() => go('compteur')} onSettings={() => go('settings')} />
        )}
        {route === 'prayer' && (
          <ScreenWithBack onBack={() => go('compteur')} isAr={isAr} bare={true}>
            <window.PrayerScreen lang={lang} />
          </ScreenWithBack>
        )}
        {route === 'qibla' && (
          <ScreenWithBack onBack={() => go('compteur')} isAr={isAr} backTop={45}>
            <window.QiblaScreen lang={lang} />
          </ScreenWithBack>
        )}
        {route === 'adhkar' && (
          <ScreenWithBack onBack={() => go('compteur')} isAr={isAr} backTop={70}>
            <window.AdhkarScreen lang={lang} />
          </ScreenWithBack>
        )}
        {route === 'duaa' && (
          <ScreenWithBack onBack={() => go('compteur')} isAr={isAr} backTop={62}>
            <window.DuaaScreen lang={lang} />
          </ScreenWithBack>
        )}
        {route === 'morningcard' && (
          <window.MorningCardScreen lang={lang} onBack={() => go('compteur')} />
        )}
        {route === 'asma' && (
          <ScreenWithBack onBack={() => { go('compteur'); setDrawerOpen(true); }} isAr={isAr} backTop={60} backScale={0.78}>
            <window.AsmaScreen lang={lang} onBack={() => { go('compteur'); setDrawerOpen(true); }} />
          </ScreenWithBack>
        )}
        {route === 'custom' && (
          <window.CustomDhikrModal lang={lang} onClose={() => go('compteur')} />
        )}
        {route === 'settings' && (
          <ScreenWithBack onBack={() => go('compteur')} isAr={isAr} backTop={56}>
            <SettingsWithLangPicker lang={lang} setLang={setLang} />
          </ScreenWithBack>
        )}

        {/* Drawer (above everything) */}
        <NavDrawer
          open={drawerOpen}
          lang={lang}
          isAr={isAr}
          onClose={() => setDrawerOpen(false)}
          onGo={go}
        />

        {/* Custom dhikr modal overlay (triggered from drawer "ذكر جديد" or Library "+") */}
        {showCustomModal && (
          <window.CustomDhikrModal
            lang={lang}
            editDhikr={editingDhikr}
            onClose={() => { setShowCustomModal(false); setEditingDhikr(null); }}
          />
        )}

        {/* Dhikr Detail overlay (triggered by tapping the dhikr name in compteur) */}
        {showDhikrDetail !== null && (
          <div style={{ position:'absolute', inset:0, zIndex:350 }}>
            <window.DhikrDetailScreen lang={lang} dhikrIdx={showDhikrDetail}
              onStart={(idx) => {
                setShowDhikrDetail(null);
                const s = loadState(); s.dhikrIdx = idx; saveState(s);
                setRoute('compteur');
              }}
            />
            <button
              onClick={() => setShowDhikrDetail(null)}
              style={{
                position:'absolute', top: 50, [isAr ? 'right' : 'left']: 18,
                width: 42, height: 42, borderRadius: 21,
                background:'rgba(11,13,16,0.7)', backdropFilter:'blur(10px)',
                border:`0.5px solid ${T.hairline}`, color:T.gold,
                cursor:'pointer', zIndex: 360,
                display:'flex', alignItems:'center', justifyContent:'center', padding:0,
              }}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d={isAr ? "M5 3l5 4-5 4" : "M9 3L4 7l5 4"} stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>
        )}

        {/* ── Toast mode nuit (croissant + message) ── */}
        {nightToast && (
          <div style={{
            position:'absolute', top:64, left:'50%', transform:'translateX(-50%)',
            display:'flex', alignItems:'center', gap:10, zIndex:400,
            padding:'11px 18px 11px 14px', borderRadius:999,
            background:'rgba(10,14,22,0.82)', backdropFilter:'blur(16px)', WebkitBackdropFilter:'blur(16px)',
            border:'0.5px solid rgba(150,180,235,0.35)',
            boxShadow:'0 12px 38px rgba(0,0,0,0.55), inset 0 1px 0 rgba(180,205,255,0.12)',
            animation:'nightToastIn 0.45s cubic-bezier(0.16,1,0.3,1)', direction:'rtl',
            maxWidth:'88%',
          }}>
            <div style={{
              width:30, height:30, borderRadius:'50%', flexShrink:0,
              display:'flex', alignItems:'center', justifyContent:'center',
              background:'radial-gradient(circle at 35% 30%, rgba(150,180,235,0.28), rgba(40,55,95,0.2))',
              border:'0.5px solid rgba(160,190,240,0.4)',
            }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M19 14.5A7 7 0 0 1 9.5 5a7 7 0 1 0 9.5 9.5Z" stroke="#AEC6F2" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                <path d="M17 5.2l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5Z" fill="#CBE0FF"/>
              </svg>
            </div>
            <div style={{ lineHeight:1.3 }}>
              <div style={{ fontFamily:'Amiri, serif', fontSize:16, fontWeight:700, color:'#E8F0FF', letterSpacing:'0.01em' }}>
                تم تفعيل الوضع الليلي
              </div>
              <div style={{ fontFamily:'Inter, sans-serif', fontSize:10.5, color:'rgba(190,205,235,0.7)', letterSpacing:'0.02em', direction:'ltr', textAlign:'right' }}>
                Mode nuit activé · 18h–6h
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }
  function SettingsWithLangPicker({ lang, setLang }) {
    return (
      <div style={{ position:'absolute', inset:0 }}>
        <window.SettingsScreen lang={lang} setLang={setLang} />
      </div>
    );
  }

  // ─── Viewport fit: scale 402×874 design to phone viewport ──────────
  function useScale() {
    const [info, setInfo] = useState({ scale: 1, framed: false });
    useEffect(() => {
      function fit() {
        const W = window.innerWidth, H = window.innerHeight;
        // Grand écran (ordinateur) → cadre iPhone centré (« contain »)
        // Petit écran (vrai téléphone / Xcode) → plein écran (« cover »)
        const framed = W >= 480 && H >= 480 && (W > 520 || H > 920);
        if (framed) {
          const s = Math.min((H - 56) / 874, (W - 56) / 402, 1.05);
          setInfo({ scale: s, framed: true });
        } else {
          const s = Math.max(W / 402, H / 874);
          setInfo({ scale: s, framed: false });
        }
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      return () => {
        window.removeEventListener('resize', fit);
        window.removeEventListener('orientationchange', fit);
      };
    }, []);
    return info;
  }

  function frameStyle() {
    // returns the inner canvas style (relative positioning context for screens)
    return {
      position:'absolute', top:0, left:0,
      width: 402, height: 874,
      overflow:'hidden',
      background:'#000',
    };
  }

  function Root() {
    const { scale, framed } = useScale();
    const [ready, setReady] = useState(false);
    useEffect(() => {
      // Wait for fonts and ASSETS to be ready
      const tick = () => {
        if (window.THEME && window.I18N && window.CompteurV1 && window.CompteurV2 && window.CompteurV3
            && window.LibraryScreen && window.Splash && window.Onboarding) {
          setReady(true);
        } else {
          setTimeout(tick, 50);
        }
      };
      tick();
    }, []);
    if (!ready) {
      return (
        <div style={{
          position:'fixed', inset:0, background:'#0B0D10',
          display:'flex', alignItems:'center', justifyContent:'center',
          color:'#C7A55B', fontFamily:'serif', fontSize:14, letterSpacing:'0.3em',
        }}>· · ·</div>
      );
    }
    const W = 402, H = 874;
    // ── Mode capture App Store : rendu propre 402×874 (ajusté à la fenêtre), sans bezel ──
    if (typeof window !== 'undefined' && /[?&]shot/.test(window.location.search)) {
      const sc = Math.min(window.innerWidth / 402, window.innerHeight / 874);
      return (
        <div style={{ position:'fixed', inset:0, background:'#000', overflow:'hidden' }}>
          <div style={{ position:'absolute', top:0, left:0, width:402, height:874,
                        transform:`scale(${sc})`, transformOrigin:'top left' }}>
            <MisbahaApp />
          </div>
        </div>
      );
    }
    const canvas = (
      <div style={{
        position:'relative',
        width: W * scale,
        height: H * scale,
        overflow:'hidden',
        borderRadius: framed ? 40 : 0,
        background:'#000',
      }}>
        {framed && (
          <div style={{
            position:'absolute', top:0, left:'50%', transform:'translateX(-50%)',
            width:118, height:27, background:'#000', borderRadius:'0 0 17px 17px',
            zIndex:99999, pointerEvents:'none',
          }} />
        )}
        <div style={{
          position:'absolute', top:0, left:0,
          width: W, height: H,
          transform: `scale(${scale})`,
          transformOrigin: 'top left',
        }}>
          <MisbahaApp />
        </div>
      </div>
    );
    if (framed) {
      return (
        <div style={{
          position:'fixed', inset:0,
          background:'radial-gradient(120% 90% at 50% 0%, #101a31 0%, #070d1c 60%)',
          overflow:'hidden',
          display:'flex', alignItems:'center', justifyContent:'center',
        }}>
          <div style={{
            position:'relative', padding:13, borderRadius:52,
            background:'linear-gradient(160deg,#23252b,#0c0d10)',
            boxShadow:'0 50px 110px -30px rgba(0,0,0,.95), inset 0 0 0 2px rgba(255,255,255,.05)',
          }}>
            {canvas}
          </div>
        </div>
      );
    }
    return (
      <div style={{
        position:'fixed', inset:0, background:'transparent',
        overflow:'hidden',
        display:'flex', alignItems:'center', justifyContent:'center',
      }}>
        {canvas}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  // Retirer l'écran de démarrage statique une fois React peint (fondu transparent vers le vrai splash)
  requestAnimationFrame(() => { requestAnimationFrame(() => { setTimeout(() => {
    const bs = document.getElementById('boot-splash');
    if (bs) { bs.style.opacity = '0'; setTimeout(() => bs.remove(), 650); }
  }, 350); }); });
})();
</script></body></html>
