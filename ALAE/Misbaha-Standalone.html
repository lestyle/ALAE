           ['react-dom.development.js','https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js']];
  function fini(){window.__reactPret=true;try{window.dispatchEvent(new Event('react-pret'));}catch(e){}}
  function charger(i){
    if(i>=LIB.length) return fini();
    var repli=false;
    function pousser(src){
      var s=document.createElement('script');s.src=src;
      s.onload=function(){charger(i+1);};
      s.onerror=function(){ if(!repli){repli=true;console.warn('[ALAE] '+LIB[i][0]+' absent du bundle — repli CDN');pousser(LIB[i][1]);} else {console.error('[ALAE] React introuvable (local + CDN)');} };
      document.head.appendChild(s);
    }
    pousser(LIB[i][0]);
  }
  charger(0);
})();
</script>
<script id="alae-jsx-boot">
/* ALAE — traduction du JSX mise en cache.
   1er lancement : charge babel.min.js, traduit, garde le résultat.
   Lancements suivants : réutilise le résultat, babel.min.js n'est plus chargé. */
(function(){
  function hash(s){var a=5381;for(var i=0;i<s.length;i++)a=((a*33)^s.charCodeAt(i))>>>0;return a.toString(36);}
  function run(code){var s=document.createElement('script');s.textContent=code;document.body.appendChild(s);}
  function boot(){
    var tags=[].slice.call(document.querySelectorAll('script[type="text/alae-jsx"]'));
    if(!tags.length){console.error('[ALAE] aucun script JSX trouvé');return;}
    var srcs=tags.map(function(n){return n.textContent;});
    var key=hash(srcs.join('\u0000'))+'.'+srcs.length;
    var store=null;try{store=window.localStorage;}catch(e){}
    var cached=null;
    if(store&&store.getItem('alae.jsc.key')===key){
      cached=[];
      for(var i=0;i<srcs.length;i++){var c=store.getItem('alae.jsc.'+i);if(c==null){cached=null;break;}cached.push(c);}
    }
    if(cached){console.log('[ALAE] code déjà traduit — démarrage rapide');for(var j=0;j<cached.length;j++)run(cached[j]);return;}
    console.log('[ALAE] 1re traduction du code…');
    var s=document.createElement('script');
    s.src='babel.min.js';
    s.onerror=function(){ // babel absent du bundle : repli CDN (nécessite le réseau)
      console.warn('[ALAE] babel.min.js absent du bundle — repli CDN');
      var c=document.createElement('script');
      c.src='https://unpkg.com/@babel/standalone@7.29.0/babel.min.js';
      c.onload=s.onload;
      c.onerror=function(){console.error('[ALAE] Babel introuvable (local + CDN)');};
      document.head.appendChild(c);
    };
    s.onload=function(){
      var out=[];
      try{
        for(var i=0;i<srcs.length;i++)out.push(Babel.transform(srcs[i],{presets:['react'],sourceType:'script'}).code);
      }catch(e){console.error('[ALAE] traduction impossible',e);return;}
      try{if(store){for(var k=0;k<out.length;k++)store.setItem('alae.jsc.'+k,out[k]);store.setItem('alae.jsc.key',key);}}catch(e){console.warn('[ALAE] cache non enregistré',e);}
      for(var m=0;m<out.length;m++)run(out[m]);
    };
    document.head.appendChild(s);
  }
  // On attend la fin de l'intro avant de lancer le code de l'app : sinon le travail
  // de traduction bloque le fil d'exécution et l'intro est sautée.
  function apresIntro(fn){
    if(window.__alaeLeger) return fn();
    if(window.__bootIntroDone || !document.getElementById('boot-intro')) return fn();
    var lance=false;
    function go(){ if(lance) return; lance=true; fn(); }
    window.addEventListener('boot-intro-done', go);
    setTimeout(go, 8000); // filet de sécurité
  }
  function quandReact(fn){ if(window.__reactPret) return fn(); window.addEventListener('react-pret', fn); }
  function demarrer(){ apresIntro(function(){ quandReact(boot); }); }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',demarrer);else demarrer();
})();
</script>

/* Calendrier des horaires : 14 jours d'avance, mis en cache pour marcher hors-ligne.
   C'est ce qui permet à chaque adhan de sonner à SON heure, jour par jour. */
window.alaeChargerCalendrier = function(lat, lon){
  var CLE='alae.prayer.calendar';
  function lire(){ try{ return JSON.parse(localStorage.getItem(CLE)||'null'); }catch(e){ return null; } }
  var c=lire();
  var frais = c && c.jours && c.jours.length>=7 && Math.abs((c.lat||0)-lat)<0.25 && Math.abs((c.lon||0)-lon)<0.25
              && c.jours.some(function(j){ return j.date===window.alaeDateDuJour(); });
  if(frais) return Promise.resolve(c.jours);
  var d=new Date(), y=d.getFullYear(), m=d.getMonth()+1;
  var ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
  var lien=function(yy,mm){ return 'https://api.aladhan.com/v1/calendar/'+yy+'/'+mm+'?latitude='+lat+'&longitude='+lon+'&method=3'; };
  return Promise.all([
    fetch(lien(y,m)).then(function(r){return r.json();}).catch(function(){return null;}),
    fetch(lien(ny,nm)).then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(res){
    var tous=[];
    res.forEach(function(j){ if(j && j.code===200 && Array.isArray(j.data)) j.data.forEach(function(x){
      try{ tous.push({date:x.date.gregorian.date, timings:x.timings}); }catch(e){}
    }); });
    var t=new Date(); t.setHours(0,0,0,0);
    var jours=tous.filter(function(x){
      var p=String(x.date).split('-'); if(p.length!==3) return false;
      return new Date(+p[2], +p[1]-1, +p[0]) >= t;
    }).slice(0,14);
    if(!jours.length) return (c && c.jours) || null;
    try{ localStorage.setItem(CLE, JSON.stringify({ts:Date.now(), lat:lat, lon:lon, jours:jours})); }catch(e){}
    return jours;
  }).catch(function(){ return (c && c.jours) || null; });
};
window.alaeDateDuJour = function(){
  var d=new Date(), p=function(n){return n<10?'0'+n:''+n;};
  return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear();
};
window.alaeJoursEnCache = function(){
  try{
    var c=JSON.parse(localStorage.getItem('alae.prayer.calendar')||'null');
    if(!c||!c.jours) return null;
    var t=new Date(); t.setHours(0,0,0,0);
    var j=c.jours.filter(function(x){ var p=String(x.date).split('-'); return new Date(+p[2],+p[1]-1,+p[0])>=t; });
    return j.length ? j : null;
  }catch(e){ return null; }
};

window.alaeRafraichirCalendrier = function(){
  var pos={lat:50.8503, lon:4.3517};
  try{ var p=JSON.parse(localStorage.getItem('alae.prayer.pos')||'null'); if(p&&p.lat&&p.lon) pos=p; }catch(e){}
  try{ return window.alaeChargerCalendrier(pos.lat, pos.lon); }catch(e){ return Promise.resolve(null); }
};

/* ALAE — pont haptique natif. En WebView iOS, navigator.vibrate n'existe pas / ne fait rien.
   On le (re)définit pour qu'il déclenche le retour haptique natif via le pont Swift. */
(function(){

  var native=(typeof navigator.vibrate==='function')?navigator.vibrate.bind(navigator):null;
  function vib(p){ try{ var a=Array.isArray(p)?p:[p]; var st=a.length>1?'rigid':((a[0]||0)>=12?'medium':'soft'); bridge(st); }catch(e){} if(native){ try{ return native(p); }catch(e){} } return true; }
  try{ navigator.vibrate=vib; }catch(e){ try{ Object.defineProperty(navigator,'vibrate',{value:vib,configurable:true,writable:true}); }catch(e2){} }

/* ALAE — clic discret du grain. WebAudio en categorie ambiante : muet quand le
   telephone est en mode silencieux, exactement comme le systeme. */
(function(){
  var ctx=null;
  function on(){ try{ var s=JSON.parse(localStorage.getItem('misbaha.v1')||'{}'); return s.sound===true; }catch(e){ return false; } }
  window.alaeClick=function(){
    if(!on()) return;

      g.gain.exponentialRampToValueAtTime(0.075,t+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.055);

})();

// ─── DhikrStore — couche de données persistante (ajout / suppression / édition / favori) ───
// Fusionne au démarrage : dhikrs de base (modifiables/masquables) + dhikrs perso.
// Tout est mémorisé dans localStorage 'misbaha.v1' et survit au rechargement.
window.DhikrStore = (function () {
  const KEY = 'misbaha.v1';
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (_) { return {}; } }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (_) {} }
  const subs = new Set();
  function emit() { subs.forEach(fn => { try { fn(); } catch (_) {} }); }
  function compute() {
    const s = load();
    const deleted = new Set(s.deletedIds || []);
    const edits = s.edits || {};
    const favOv = s.favOverrides || {};
    const apply = (d) => ({
      ...d,
      ...(edits[d.id] || {}),
      fav: (favOv && Object.prototype.hasOwnProperty.call(favOv, d.id)) ? !!favOv[d.id] : d.fav,
    });
    const base = window.DHIKR_BASE.filter(d => !deleted.has(d.id)).map(apply);
    const user = (s.userDhikrs || []).filter(d => !deleted.has(d.id)).map(d => apply({ ...d, custom: true }));
    return [...base, ...user];
  }
  function refresh() { window.DHIKRS = compute(); emit(); }
  refresh();
  return {
    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },
    list() { return window.DHIKRS; },
    refresh,
    add(d) {
      const s = load();
      s.userDhikrs = s.userDhikrs || [];
      const item = { id: 'custom-' + Date.now(), fav: true, custom: true, ...d };
      s.userDhikrs.push(item);
      save(s); refresh();
      return item;
    },
    update(id, patch) {
      const s = load();
      const u = (s.userDhikrs || []).find(x => x.id === id);
      if (u) { Object.assign(u, patch); }
      else { s.edits = s.edits || {}; s.edits[id] = { ...(s.edits[id] || {}), ...patch }; }
      save(s); refresh();
    },
    remove(id) {
      // garde toujours au moins 1 dhikr pour ne pas casser le compteur
      if ((window.DHIKRS || []).length <= 1) return false;
      const s = load();
      s.deletedIds = s.deletedIds || [];
      if (!s.deletedIds.includes(id)) s.deletedIds.push(id);
      // si c'est un dhikr perso jamais re-créable, on le purge aussi de userDhikrs
      save(s); refresh();
      return true;
    },
    restore(id) {
      const s = load();
      s.deletedIds = (s.deletedIds || []).filter(x => x !== id);
      save(s); refresh();
    },
    toggleFav(id) {
      const s = load();
      s.favOverrides = s.favOverrides || {};
      const cur = (window.DHIKRS.find(d => d.id === id) || {}).fav;
      s.favOverrides[id] = !cur;
      save(s); refresh();
    },
  };
})();

window.useTasbih = function useTasbih(target = 33, initial = 0, opts = {}) {
  const [count, setCount] = React.useState(initial);
  const [pulse, setPulse] = React.useState(0);
  const pressRef = React.useRef(0);
  const swipeRef = React.useRef({ x:0, y:0, swiped:false });
  const { onSwipeLeft, onSwipeRight } = opts;

  const tap = React.useCallback(() => {
    setCount(c => {
      const next = c + 1;
      if (next === target) {
        // Fin de cycle (ex: arrivée à 33) : 3 vibrations franches en continu
        if (navigator.vibrate) try { navigator.vibrate([40, 90, 40, 90, 40]); } catch {}
        if (opts.eyesClosed && window.AlaeSpeak) window.AlaeSpeak('تَمَّ الوُصولُ لِلهَدَف. ' + next);
      } else {
        if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
        if (opts.eyesClosed && window.AlaeSpeak) window.AlaeSpeak(String(next));
      }
      return next;
    });
    setPulse(p => p + 1);
    if (window.recordDhikrTap && opts.dhikrId) window.recordDhikrTap(opts.dhikrId);
  }, [opts.dhikrId, opts.eyesClosed, target]);
  const reset = React.useCallback(() => setCount(0), []);

  const onPointerDown = (e) => {
    swipeRef.current = { x: e.clientX || 0, y: e.clientY || 0, swiped:false, down:true };
    pressRef.current = setTimeout(() => { reset(); pressRef.current = 'longpress'; }, 600);
  };
  const onPointerMove = (e) => {
    if (!swipeRef.current.down || swipeRef.current.swiped) return;
    const dx = (e.clientX || 0) - swipeRef.current.x;
    const dy = (e.clientY || 0) - swipeRef.current.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      swipeRef.current.swiped = true;
      clearTimeout(pressRef.current);
      pressRef.current = 'swiped';
      if (dx < 0 && onSwipeLeft) onSwipeLeft();
      else if (dx > 0 && onSwipeRight) onSwipeRight();
    }
  };
  const onPointerUp = () => {
    const wasDown = swipeRef.current.down;
    swipeRef.current.down = false;
    if (!wasDown) return;
    if (pressRef.current === 'longpress' || pressRef.current === 'swiped') {
      pressRef.current = 0;
      return;
    }
    clearTimeout(pressRef.current);
    pressRef.current = 0;
    tap();
  };
  const onPointerLeave = () => { swipeRef.current.down = false; clearTimeout(pressRef.current); pressRef.current = 0; };

  return { count, setCount, pulse, tap, reset, target, handlers: { onPointerDown, onPointerMove, onPointerUp, onPointerLeave } };
};

    u.pitch = 1.0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
};

function alaeMoonToday(lang){

  }catch(e){}

  const MONTHS_AR=['محرم','صفر','ربيع الأول','ربيع الثاني','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

  const toArabicNum=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  let dateStr='';
  if(lang==='ar') dateStr = hd+' '+MONTHS_AR[hMonthIdx]+' '+hYear;
  else dateStr = hd+' '+MONTHS_LAT[hMonthIdx]+' '+hYear;
  const p=((hd-1)%29.53)/29.53;
  const cosv=Math.cos(2*Math.PI*p);
  const R=46,CX=50,CY=50,rx=Math.abs(cosv)*R;
  const waxing=p<0.5, so=waxing?1:0, si=(cosv>0)?(1-so):so;
  const path='M '+CX+','+(CY-R)+' A '+R+','+R+' 0 0 '+so+' '+CX+','+(CY+R)+' A '+rx.toFixed(2)+','+R+' 0 0 '+si+' '+CX+','+(CY-R)+' Z';
  // région SOMBRE (vrai complément géométrique) : on inverse SEULEMENT l'arc extérieur
  // (le terminateur garde le même sens) — sinon la part noire est dessinée trop grande / en miroir
  const pathDark='M '+CX+','+(CY-R)+' A '+R+','+R+' 0 0 '+(1-so)+' '+CX+','+(CY+R)+' A '+rx.toFixed(2)+','+R+' 0 0 '+si+' '+CX+','+(CY-R)+' Z';
  const fullness=(1-cosv)/2;
  const t=Math.max(0,(fullness-0.45)/0.55);
  const GOLD=[[139,90,42],[232,185,122],[255,246,218],[224,162,63],[255,241,200],[176,127,46]];
  const PEARL=[[120,130,150],[210,218,232],[255,255,252],[200,210,225],[245,248,255],[150,160,178]];
  const L=(a,b)=>Math.round(a+(b-a)*t);
  const hx=c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
  const stops=GOLD.map((g,i)=>hx([L(g[0],PEARL[i][0]),L(g[1],PEARL[i][1]),L(g[2],PEARL[i][2])]));
  const glow=hx([L(232,200),L(160,215),L(70,240)]);
  // trajectoire en arc dans le ciel : gauche(début) → sommet(pleine lune) → droite(fin)
  const ox=(p-0.5)*128;                 // -64px → +64px sur le mois
  const oy=Math.pow(2*(p-0.5),2)*42;    // 0 au sommet (pleine lune), +42 aux extrémités (plus bas)

  const starOpacity = +(0.35 + 0.65*fullness).toFixed(3);
  const phaseIdx = ((Math.round(p*8)%8)+8)%8;
  return {path,pathDark,stops,glow,hd,ox,oy,dateStr,starOpacity,fullness,phaseIdx};
}

function alaeIsDay(){
  // aperçu manuel : ?nuit force la lune, ?jour force le soleil (n'affecte pas l'usage normal)
  try{ const q=window.location.search||''; if(/[?&]nuit\b/.test(q)) return false; if(/[?&]jour\b/.test(q)) return true; }catch(e){}
  const now=new Date();
  const mins=now.getHours()*60+now.getMinutes();
  try{
    const c=JSON.parse(localStorage.getItem('alae.prayer.timings')||'null');
    if(c&&c.timings){
      const toMin=s=>{const m=String(s).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;};
      const sr=toMin(c.timings.Sunrise), ms=toMin(c.timings.Maghrib);
      // on ne fait confiance aux horaires que s'ils sont plausibles :
      // lever entre 03h–10h, coucher entre 15h–23h, journée d'au moins 6h.

      const plausible = sr!=null && ms!=null && sr>=180 && sr<=600 && ms>=900 && ms<=1380 && (ms-sr)>=360;

    }
  }catch(e){}

  const h=now.getHours(); return h>=7 && h<21;
}

function Footer({ dhikrIdx, setDhikrIdx, onReset, lang = 'fr' }) {
  const T = window.THEME;
  const STORE_KEY = 'misbaha.v1';

    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return true;
      const s = JSON.parse(raw);
      return s.haptics !== false;
    } catch { return true; }
  });
  const toggleHaptics = (e) => {
    e.stopPropagation();
    const next = !hapticsOn;
    setHapticsOn(next);
    try {
      const raw = localStorage.getItem(STORE_KEY);
      const s = raw ? JSON.parse(raw) : {};
      s.haptics = next;
      localStorage.setItem(STORE_KEY, JSON.stringify(s));
    } catch {}
    if (next && navigator.vibrate) try { navigator.vibrate([12, 30, 12]); } catch {}
  };
  return (
    <>
      {/* dhikr cycler dots */}
      <div style={{
        position:'absolute', bottom:185, left:0, right:0,

// ─── V1 — Ring + chapelet en arc inférieur ──────────────────────────
function CompteurV1({ lang = 'fr', initialDhikr = 0, controlledDhikrIdx, onDhikrChange, eyesClosed = false }) {
  const T = window.THEME;
  const [internalIdx, setInternalIdx] = React.useState(initialDhikr);
  const dhikrIdx = controlledDhikrIdx !== undefined ? controlledDhikrIdx : internalIdx;
  const setDhikrIdx = onDhikrChange || setInternalIdx;
  const dhikr = window.DHIKRS[dhikrIdx] || window.DHIKRS[0];
  const _favs = window.DHIKRS.filter(d => d.fav);
  const _curFavIdx = _favs.findIndex(d => d.id === dhikr.id);
  const _goPrev = React.useCallback(() => {
    if (_favs.length < 2) return;
    const ni = (_curFavIdx - 1 + _favs.length) % _favs.length;
    setDhikrIdx(window.DHIKRS.indexOf(_favs[ni]));
    if (navigator.vibrate) try { navigator.vibrate(8); } catch(_) {}
  }, [_curFavIdx]);
  const _goNext = React.useCallback(() => {
    if (_favs.length < 2) return;
    const ni = (_curFavIdx + 1) % _favs.length;
    setDhikrIdx(window.DHIKRS.indexOf(_favs[ni]));
    if (navigator.vibrate) try { navigator.vibrate(8); } catch(_) {}
  }, [_curFavIdx]);
  const t = window.useTasbih(dhikr.target, 0, { onSwipeLeft: _goNext, onSwipeRight: _goPrev, dhikrId: dhikr.id, eyesClosed });
  React.useEffect(() => { t.reset(); }, [dhikrIdx]);

  const N = dhikr.target;
  const R = 92, C = 2 * Math.PI * R;
  const _acc = window.getThemeAccent ? window.getThemeAccent() : { solid: T.gold, bright: T.goldLight, dim: 'rgba(199,165,91,0.4)' };
  const progress = Math.min(t.count / N, 1);

  return (
    <CompteurChrome>
      <Header dhikr={dhikr} lang={lang} onTap={() => window.__openDhikrDetail && window.__openDhikrDetail(dhikrIdx)} />
      <DhikrNavArrows dhikrIdx={dhikrIdx} setDhikrIdx={setDhikrIdx} dhikr={dhikr} />

      <div {...t.handlers} style={{ position:'absolute', inset:0, zIndex:2, cursor:'pointer', userSelect:'none', WebkitTapHighlightColor:'transparent' }} />

      {/* Voile sombre doux derrière l'anneau — fait ressortir le chiffre sur la soie */}
      <div style={{
        position:'absolute', top:468, left:'50%', transform:'translate(-50%,-50%)',
        width:340, height:340, borderRadius:'50%', zIndex:1, pointerEvents:'none',
        background:'radial-gradient(circle, rgba(8,6,4,0.55) 0%, rgba(8,6,4,0.30) 46%, rgba(8,6,4,0) 72%)',
        filter:'blur(7px)',
        animation:'softNeonGlow 5.5s ease-in-out infinite',
      }} />

      {/* central ring */}
      <svg viewBox="0 0 320 320" style={{ position:'absolute', top:308, left:'50%', width:320, height:320, marginLeft:-160, pointerEvents:'none', zIndex:3 }}>
        <defs>
          <filter id="v1glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="6.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        {/* outer ornamental ring + track — pulse together like soft neon */}
        <g filter="url(#v1glow)" style={{ animation: 'neonRingBreathe 4.5s ease-in-out infinite' }}>
          <circle cx="160" cy="160" r={R + 22} fill="none" stroke={T.goldLight} strokeOpacity="0.9" strokeWidth="0.6" />
          <circle cx="160" cy="160" r={R} fill="none" stroke={T.goldLight} strokeOpacity="0.9" strokeWidth="0.7" />
        </g>
        {/* tick marks (every 5) */}
        {Array.from({ length: N }, (_, i) => {
          if (i % 5 !== 0 && i !== N - 1) return null;
          const a = -Math.PI / 2 + (i / N) * 2 * Math.PI;
          const big = (i === 0 || i === Math.floor(N / 2) || i === N - 1);
          return (
            <line key={i}
              x1={160 + Math.cos(a) * (R + 14)} y1={160 + Math.sin(a) * (R + 14)}
              x2={160 + Math.cos(a) * (R + (big ? 20 : 17))} y2={160 + Math.sin(a) * (R + (big ? 20 : 17))}
              stroke={T.gold} strokeOpacity={big ? 0.7 : 0.35} strokeWidth="0.5" strokeLinecap="round"
            />
          );
        })}
        {/* progress */}
        <circle cx="160" cy="160" r={R} fill="none"
          stroke="url(#v1grad)" strokeWidth="3" strokeLinecap="round"
          strokeDasharray={C} strokeDashoffset={C * (1 - progress)}
          transform="rotate(-90 160 160)"
          filter="url(#v1glow)"
          style={{ transition: 'stroke-dashoffset 0.4s cubic-bezier(.2,.7,.3,1)' }}
        />
        <defs>
          <linearGradient id="v1grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stopColor={T.goldLight}/>
            <stop offset="1" stopColor={T.goldDark}/>
          </linearGradient>
        </defs>
      </svg>

      {/* numeral */}
      <div style={{
        position:'absolute', top:308, left:'50%', width:320, height:320, marginLeft:-160,
        display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column',
        pointerEvents:'none', zIndex:4,

        <div key={t.pulse} style={{

          background:`linear-gradient(180deg, #F7D9B0 0%, #D08A4F 45%, #6E3E1C 100%)`,

      <Footer dhikrIdx={dhikrIdx} setDhikrIdx={setDhikrIdx} onReset={t.reset} lang={lang} />
    </CompteurChrome>
  );
}

// ─── Chapelet primitive ─────────────────────────────────────────────
// SVG covers the entire phone frame (402×874) so bead positions are written
// directly in frame coordinates — simpler math, and the silk pattern aligns
// pixel-for-pixel with the silk bg behind regardless of where each bead sits.
function Chapelet({ count, target, y, style }) {
  const T = window.THEME;
  const N = target;
  // Anneau à 33 boules fixes (comme SubhanAllah) : chaque tap avance d'une boule,
  // le tour boucle tous les 33 taps quel que soit l'objectif (N).
  const LOOP_N = (style === 'fullRing' || style === 'full') ? 33
    : (style === 'perimeter') ? Math.min(N, 33)
    : N;

  // Frame: 402×874. Silk image (900×1613) is sized with `cover`, so it scales
  // to max(402/900, 874/1613) = 0.5419 → rendered 487.7×874, centered → starts
  // at frame x = -42.85. So frame (fx, fy) shows silk-image pixel (fx+42.85, fy).
  const FRAME_W = 402, FRAME_H = 874;
  const SILK_W = 487.74, SILK_H = 874;
  const SILK_OFFSET_X = -42.87; // x_attr so pattern_x = svg_x - x_attr = svg_x + 42.87

  const positions = React.useMemo(() => {
    if (style === 'arc') {
      // bottom arc — kept for legacy. y is the arc baseline.
      const cx = 201, rx = 130, ry = 60;
      return Array.from({ length: N }, (_, i) => {
        const a = Math.PI + (i / (N - 1)) * Math.PI;
        return { x: cx + Math.cos(a) * rx, y: y + Math.sin(a) * ry };
      });
    }
    if (style === 'full') {
      // V2 — full circle wrapping the central numeral (centered on numeral at y=540)
      const cx = 201, cy = 540, R = 158;
      return Array.from({ length: N }, (_, i) => {
        const a = -Math.PI / 2 + (i / N) * 2 * Math.PI;
        return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R };
      });
    }
    if (style === 'fullRing') {
      // V1 — ring wrapping the central counter ring at (201, 468) — centered on screen
      const cx = 201, cy = 468, R = 158;
      return Array.from({ length: LOOP_N }, (_, i) => {
        const a = -Math.PI / 2 + (i / LOOP_N) * 2 * Math.PI;
        return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R };
      });
    }
    if (style === 'perimeter') {
      // V3 — perfect circle of beads, centered on the count number
      const cx = 201, cy = 430, R = 172;
      return Array.from({ length: N }, (_, i) => {
        const a = -Math.PI / 2 + (i / N) * 2 * Math.PI;
        return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R };
      });
    }
    if (style === 'vertical') {
      // legacy V3 — column on right
      const cx = 340, cyStart = 220, h = 460;
      return Array.from({ length: N }, (_, i) => {
        const a = (i / (N - 1)) * Math.PI * 4;
        return { x: cx + Math.cos(a) * 8, y: cyStart + (i / (N - 1)) * h };
      });
    }
    return [];
  }, [N, style, y]);

  const beadR = (i, done, active) => {
    // Slightly smaller beads on the dense perimeter/oval loops; bigger on small loops
    if (style === 'perimeter') return active ? 6 : done ? 5 : 4;
    return active ? 7 : done ? 5.5 : 4.5;
  };

  const silkSrc = window.ASSETS?.['assets/silk-bg.png'] || 'assets/silk-bg-inline.jpg';
  const patternId = `silkBead-${style}`;
  const goldRimId = `goldRim-${style}`;
  const isPerimeter = style === 'perimeter';
  const hasTassel = false; // imam + chain + cap + tassel disabled — clean closed loops

  // Two ornamental marker beads at 1/4 and 3/4 — like real tasbih separators
  const markerIdxs = (style === 'perimeter' || style === 'full' || style === 'fullRing')
    ? new Set([Math.floor(LOOP_N / 4), Math.floor((3 * LOOP_N) / 4)])
    : new Set();
  const imamIdx = -1;
  const imam = null;

  return (
    <svg
      viewBox={`0 0 ${FRAME_W} ${FRAME_H}`}
      style={{ position:'absolute', top:0, left:'50%', width:FRAME_W, height:FRAME_H, marginLeft:-(FRAME_W/2), pointerEvents:'none', zIndex:1 }}
    >
      <defs>
        {/* Window-onto-silk pattern — aligned pixel-for-pixel with the silk bg */}
        <pattern id={patternId} patternUnits="userSpaceOnUse"
          x={SILK_OFFSET_X} y={0}
          width={SILK_W} height={SILK_H}>
          <image href={silkSrc} x="0" y="0" width={SILK_W} height={SILK_H}
            preserveAspectRatio="none" />
        </pattern>
        {/* Gold rim radial — ring of light around the silk window */}
        <radialGradient id={goldRimId} cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.55" stopColor={T.gold} stopOpacity="0" />
          <stop offset="0.78" stopColor={T.goldLight} stopOpacity="0.9" />
          <stop offset="1" stopColor={T.goldDark} stopOpacity="1" />
        </radialGradient>
        {/* Soft travelling light for the living-rosary sweep */}
        <radialGradient id={`sweep-${style}`} cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stopColor="#FFF3D0" stopOpacity="0.85" />
          <stop offset="0.45" stopColor={T.goldLight} stopOpacity="0.35" />
          <stop offset="1" stopColor={T.gold} stopOpacity="0" />
        </radialGradient>
        {/* Gold gradient used for tassel cap & chain */}
        <linearGradient id={`goldMetal-${style}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#FFEFC8"/>
          <stop offset="0.4" stopColor="#E8B97A"/>
          <stop offset="0.75" stopColor="#C7935B"/>
          <stop offset="1" stopColor="#6E3F0A"/>
        </linearGradient>
      </defs>

      {/* The thread connecting beads — closed loop for full/fullRing/perimeter */}
      <path d={`M ${positions.map(p => `${p.x},${p.y}`).join(' L ')}${(style==='full'||style==='fullRing'||style==='perimeter') ? ' Z' : ''}`}
        stroke="rgba(199,165,91,0.22)" strokeWidth="0.5" fill="none" />

      {/* Living-rosary: the light follows each tap — moves to the current bead */}
      {style === 'fullRing' && count > 0 && (() => {
        const f = ((count - 1) % LOOP_N) + 1;
        const p = positions[Math.max(0, f - 1)];
        if (!p) return null;
        return (
          <g style={{ transform:`translate(${p.x}px, ${p.y}px)`, transition:'none' }}>
            <circle cx="0" cy="0" r="26" fill={`url(#sweep-${style})`} />
            <circle cx="0" cy="0" r="13" fill={`url(#sweep-${style})`} opacity="0.8" />
          </g>
        );
      })()}

      {positions.map((b, i) => {
        const filled = (style === 'fullRing') ? (((count - 1) % LOOP_N) + 1) : Math.min(LOOP_N, Math.round((((((count - 1) % N) + 1)) / N) * LOOP_N));
        const done = i < filled;
        const active = i === filled - 1 && count > 0;
        const r = beadR(i, done, active);
        const rimOpacity = active ? 1 : done ? 0.85 : 0.42;
        const rimWidth = active ? 1.3 : 0.7;
        // Hide the bead at the imam slot — drawn separately as the ornate lead bead
        if (i === imamIdx) return null;

        // Ornamental marker bead — slightly bigger, decorative gold cap rings (like a real tasbih separator)
        if (markerIdxs.has(i)) {
          const mr = r + 2;
          return (
            <g key={i}>
              {(done || active) && (
                <circle cx={b.x} cy={b.y} r={mr + 3}
                  fill={`url(#${goldRimId})`} opacity={active ? 0.6 : 0.4} />
              )}
              {/* main silk bead */}
              <circle cx={b.x} cy={b.y} r={mr} fill={`url(#${patternId})`} />
              {/* prominent gold ring */}
              <circle cx={b.x} cy={b.y} r={mr} fill="none"
                stroke={T.goldLight} strokeOpacity="0.95" strokeWidth="1" />
              {/* gold engraving caps (top + bottom) */}
              <line x1={b.x - mr + 1} y1={b.y - mr * 0.55}
                    x2={b.x + mr - 1} y2={b.y - mr * 0.55}
                    stroke={T.gold} strokeOpacity="0.7" strokeWidth="0.4" />
              <line x1={b.x - mr + 1} y1={b.y + mr * 0.55}
                    x2={b.x + mr - 1} y2={b.y + mr * 0.55}
                    stroke={T.gold} strokeOpacity="0.7" strokeWidth="0.4" />
              {/* central tiny diamond */}
              <path d={`M ${b.x} ${b.y - 1.6} L ${b.x + 1.6} ${b.y} L ${b.x} ${b.y + 1.6} L ${b.x - 1.6} ${b.y} Z`}
                fill="none" stroke={T.goldLight} strokeOpacity="0.6" strokeWidth="0.35" />
              {/* highlight */}
              <ellipse cx={b.x - mr * 0.32} cy={b.y - mr * 0.42}
                rx={mr * 0.35} ry={mr * 0.22} fill="#fff6c8" opacity={0.55} />
            </g>
          );
        }

        return (
          <g key={i}>
            {active && (
              <circle cx={b.x} cy={b.y} r={r + 6} fill="none"
                stroke={T.gold} strokeOpacity="0.5" strokeWidth="0.5">
                <animate attributeName="r" from={r} to={r + 16} dur="0.8s" repeatCount="1" />
                <animate attributeName="stroke-opacity" from="0.7" to="0" dur="0.8s" repeatCount="1" />
              </circle>
            )}
            {(done || active) && (
              <circle cx={b.x} cy={b.y} r={r + 2.5}
                fill={`url(#${goldRimId})`}
                opacity={active ? 0.55 : 0.32}
                style={{ transition: 'opacity 0.2s' }} />
            )}
            <circle cx={b.x} cy={b.y} r={r}
              fill={`url(#${patternId})`}
              style={{ transition: 'r 0.2s' }} />
            <circle cx={b.x} cy={b.y} r={r}
              fill="none"
              stroke={active ? T.goldLight : T.gold}
              strokeOpacity={rimOpacity}
              strokeWidth={rimWidth}
              style={{ transition: 'all 0.2s' }} />
            {(done || active) && (
              <ellipse cx={b.x - r * 0.32} cy={b.y - r * 0.42}
                rx={r * 0.35} ry={r * 0.22}
                fill="#fff6c8"
                opacity={active ? 0.7 : 0.4} />
            )}
          </g>
        );
      })}

      {/* ─── Imam (lead bead) + chain + tassel — closed loops with tassel ─── */}
      {hasTassel && imam && (() => {
        const ix = imam.x, iy = imam.y;
        const goldM = `url(#goldMetal-${style})`;
        const FIBER_COUNT = 26;
        const fibers = [];
        for (let k = 0; k < FIBER_COUNT; k++) {
          const t = (k / (FIBER_COUNT - 1)) - 0.5; // -0.5 → 0.5
          const startX = ix + t * 7;
          const startY = iy + 48;
          const endX   = ix + t * 13;
          const endY   = iy + 48 + 38 + Math.sin(k * 1.7) * 3;
          fibers.push(
            <line key={`f${k}`} x1={startX} y1={startY} x2={endX} y2={endY}
              stroke={k % 2 === 0 ? '#9C7B45' : '#C7A55B'}
              strokeWidth="0.7" strokeOpacity={0.85} strokeLinecap="round"/>
          );
        }
        return (
          <g>
            {/* Oblong silk-window imam bead — bigger & rotated vertically */}
            <ellipse cx={ix} cy={iy} rx={7.5} ry={11}
              fill={`url(#${patternId})`} />
            {/* outer gold ring */}
            <ellipse cx={ix} cy={iy} rx={7.5} ry={11}
              fill="none" stroke={T.goldLight} strokeOpacity="0.95" strokeWidth="0.9"/>
            {/* engraving rings (gold caps top & bottom) */}
            <ellipse cx={ix} cy={iy - 7.5} rx={6} ry={1.8}
              fill="none" stroke={T.gold} strokeOpacity="0.8" strokeWidth="0.4"/>
            <ellipse cx={ix} cy={iy + 7.5} rx={6} ry={1.8}
              fill="none" stroke={T.gold} strokeOpacity="0.8" strokeWidth="0.4"/>
            {/* tiny central diamond */}
            <path d={`M ${ix} ${iy - 3} L ${ix + 2.5} ${iy} L ${ix} ${iy + 3} L ${ix - 2.5} ${iy} Z`}
              fill="none" stroke={T.goldLight} strokeOpacity="0.7" strokeWidth="0.4" />
            {/* highlight */}
            <ellipse cx={ix - 2} cy={iy - 4}
              rx={2.5} ry={3} fill="#fff6c8" opacity="0.45" />

            {/* Chain — 3 tiny gold ovals between imam and tassel cap */}
            {[16, 22, 28].map((dy, k) => (
              <ellipse key={`c${k}`} cx={ix} cy={iy + dy}
                rx={1.6} ry={2.2} fill="none"
                stroke={T.goldLight} strokeOpacity="0.85" strokeWidth="0.6"/>
            ))}

            {/* Tassel cap — small gold crown/cone */}
            <path
              d={`M ${ix - 6} ${iy + 36}
                  L ${ix + 6} ${iy + 36}
                  L ${ix + 4.5} ${iy + 46}
                  L ${ix - 4.5} ${iy + 46} Z`}
              fill={goldM} stroke={T.goldDark} strokeWidth="0.4" strokeLinejoin="round"/>
            {/* cap inner detail */}
            <line x1={ix - 5.5} y1={iy + 39} x2={ix + 5.5} y2={iy + 39}
              stroke={T.goldDark} strokeOpacity="0.6" strokeWidth="0.3"/>
            <line x1={ix - 5.2} y1={iy + 42} x2={ix + 5.2} y2={iy + 42}
              stroke={T.goldDark} strokeOpacity="0.6" strokeWidth="0.3"/>
            {/* cap highlight */}
            <line x1={ix - 4} y1={iy + 37.5} x2={ix - 4} y2={iy + 45}
              stroke="#fff6c8" strokeOpacity="0.65" strokeWidth="0.6"/>

            {/* Tassel fibers */}
            {fibers}

            {/* Tassel tips — slight dark concentration at the bottom */}
            <ellipse cx={ix} cy={iy + 88}
              rx={9} ry={2} fill="#1f1408" opacity="0.4" />
          </g>
        );
      })()}
    </svg>
  );
}

Object.assign(window, { CompteurV1, CompteurV2, CompteurV3, Chapelet });

      {S.breakdown.length > 0 && (
        <div style={{ position:'absolute', top:540, left:24, right:24, zIndex:2 }}>
          <SectionLabel text={L.breakdown} lang={lang} />
          {S.breakdown.map((b) => (
            <div key={b.id} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 0', borderBottom:`0.5px solid ${T.hairline}` }}>

                <div style={{ height:'100%', width:`${b.pct}%`, background:T.gold, borderRadius:2 }}/>
              </div>
              <div style={{ fontFamily:'"Cormorant Garamond",serif', fontSize:14, fontStyle:'italic', color:T.gold, minWidth:46, textAlign:'right' }}>{b.count.toLocaleString()}</div>

          ))}
          <div style={{ fontFamily: isAr ? 'Cairo, sans-serif' : 'Inter', fontSize: isAr ? 13 : 10, letterSpacing: isAr ? 0 : '0.2em', color:T.textMuted, textTransform: isAr ? 'none' : 'uppercase', marginTop:14, textAlign: isAr?'right':'left' }}>{S.totalAll.toLocaleString()} · {L.total}</div>
        </div>
      )}
      </React.Fragment>
      )}
    </div>
  );
}

function SettingsScreen({ lang = 'fr', setLang }) {
  const T = window.THEME;
  const I = window.I18N[lang];
  const isAr = lang === 'ar';
  const STORE_KEY = 'misbaha.v1';

  const loadSettings = () => {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return {};
      return JSON.parse(raw) || {};
    } catch { return {}; }
  };
  const [settings, setSettings] = React.useState(() => {
    const s = loadSettings();
    return {
      haptics: s.haptics !== false,
      sound: s.sound === true,
      autoDark: s.autoDark !== false,
      darkMode: s.darkMode || 'off',  // 'auto' | 'on' | 'off' — OFF par défaut (pas d'assombrissement auto)
      theme: ((s.theme === 'royal' || s.theme === 'rose') ? 'gold' : (s.theme || 'gold')),  // 'gold' | 'bordeaux' | 'rose' | 'copper'
      notifEnabled: s.notifEnabled === true,
      notifBefore: (s.notifBefore ?? 0),       // 0 = adhan pile à l'heure (défaut)
      notifReciter: s.notifReciter || 'kouchi',
    };
  });

  const [langOpen, setLangOpen] = React.useState(false);
  const LANGS = [
    { id:'ar', label:'العربية', flag:'🇲🇦' },
    { id:'fr', label:'Français', flag:'🇫🇷' },
    { id:'en', label:'English', flag:'🇬🇧' },
    { id:'nl', label:'Nederlands', flag:'🇳🇱' },
  ].filter(l => window.I18N && window.I18N[l.id]);
  const curLang = LANGS.find(l => l.id === lang) || LANGS[0];

  const RECITERS = [
    { id:'hadioui', ar:'نور الدين حديوي',      flag:'🇲🇦' },
    { id:'kouchi',   ar:'العيون الكوشي',          flag:'🇲🇦' },
    { id:'younes',   ar:'يونس الغربي',            flag:'🇲🇦' },
    { id:'kzabri',   ar:'عمر القزابري',           flag:'🇲🇦' },
    { id:'karaca',   ar:'قاني قره جه',            flag:'🇹🇷' },
    { id:'mecca',    ar:'مكة المكرّمة',         flag:'🇸🇦' },
    { id:'silent',   ar:'بدون صوت',             flag:'🔕' },
  ];
  const saveSetting = (key, val) => {
    const next = { ...settings, [key]: val };
    setSettings(next);
    try {
      const s = loadSettings();
      localStorage.setItem(STORE_KEY, JSON.stringify({ ...s, ...next }));
    } catch {}
    if (val && navigator.vibrate) try { navigator.vibrate(10); } catch {}
    // If notification settings changed, notify Swift bridge to re-schedule
    if (['notifEnabled','notifBefore','notifReciter','darkMode','theme'].includes(key)) {
      try {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.alae) {
          // Re-inject the last cached prayer timings so toggling the switch in Settings
          // actually re-schedules (Swift ignores the message when timings are empty).
          const sendNotif = (timings, city, dateStr) => {
            try {
              window.webkit.messageHandlers.alae.postMessage({
                type: 'updateNotifications',
                enabled: next.notifEnabled,
                minutesBefore: next.notifBefore,
                reciter: next.notifReciter,
                timings: timings || {},
                days: window.alaeJoursEnCache() || [],
                date: dateStr || '',
                city: city || '',
              });
            } catch {}
          };
          let cached = {};
          try { cached = JSON.parse(localStorage.getItem('alae.prayer.timings') || '{}'); } catch {}
          const fresh = cached.timings && cached.date === (() => {
            const d = new Date();
            return `${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
          })();
          if (fresh) {
            sendNotif(cached.timings, cached.city, cached.date);
            if (next.notifEnabled) {
              try { window.alaeRafraichirCalendrier().then(function(j){ if (j && j.length) sendNotif(cached.timings, cached.city, cached.date); }); } catch {}
            }
          } else if (next.notifEnabled) {
            // No fresh timings cached yet (user never opened Prayers today): fetch them now.
            let pos = { lat: 50.8503, lon: 4.3517, city: 'Bruxelles' };
            try { const p = JSON.parse(localStorage.getItem('alae.prayer.pos') || 'null'); if (p && p.lat && p.lon) pos = p; } catch {}
            const d = new Date();
            const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0'), yyyy = d.getFullYear();
            const dateStr = `${dd}-${mm}-${yyyy}`;
            fetch(`https://api.aladhan.com/v1/timings/${dateStr}?latitude=${pos.lat}&longitude=${pos.lon}&method=3`)
              .then(r => r.json())
              .then(j => {
                if (j.code === 200) {
                  const city = pos.city || (j.data.meta && j.data.meta.timezone) || '';
                  try { localStorage.setItem('alae.prayer.timings', JSON.stringify({ timings: j.data.timings, city, date: dateStr, ts: Date.now() })); } catch {}
                  sendNotif(j.data.timings, city, dateStr);
                  try { window.alaeRafraichirCalendrier().then(function(k){ if (k && k.length) sendNotif(j.data.timings, city, dateStr); }); } catch {}
                } else { sendNotif({}, '', dateStr); }
              })
              .catch(() => sendNotif(cached.timings || {}, cached.city || '', cached.date || dateStr));
          } else {
            // Turning OFF: send empty so Swift clears all scheduled notifications.
            sendNotif({}, cached.city || '', cached.date || '');
          }
        }
      } catch {}
    }
  };
  const [shareToast, setShareToast] = React.useState('');
  const handleShare = () => {
    const text = isAr ? 'تطبيق آلاء — سبحة رقمية' : 'آلاء — tasbih numérique';
    const url = 'https://www.lestyle.be/alaeApp';
    const okMsg = isAr ? 'تمّت المشاركة' : (lang === 'fr' ? 'Partagé' : 'Shared');
    const copyMsg = isAr ? 'تمّ نسخ الرابط' : (lang === 'fr' ? 'Lien copié' : 'Link copied');
    // 1) Native iOS share sheet via Swift bridge
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.alae) {
        window.webkit.messageHandlers.alae.postMessage({ type: 'share', text, url });
        if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) {}
        return;
      }
    } catch (e) {}
    const copyAndToast = () => {
      try { window.alaeCopy(text + ' — ' + url); } catch (e) {}
      setShareToast(copyMsg);
      setTimeout(() => setShareToast(''), 1800);
    };
    // 2) Web Share API
    if (navigator.share) {
      navigator.share({ title: 'آلاء', text, url })
        .then(() => { setShareToast(okMsg); setTimeout(() => setShareToast(''), 1800); })
        .catch((err) => { if (!err || err.name !== 'AbortError') copyAndToast(); });
      return;
    }
    // 3) Clipboard fallback + toast
    copyAndToast();
  };

  const reciterLabel = RECITERS.find(r => r.id === settings.notifReciter)?.ar || RECITERS[0].ar;
  const cycleReciter = () => {
    const cur = RECITERS.findIndex(r => r.id === settings.notifReciter);
    const nextReciter = RECITERS[(cur + 1) % RECITERS.length].id;
    saveSetting('notifReciter', nextReciter);
    if (navigator.vibrate) try { navigator.vibrate(12); } catch {}
  };
  const cycleBefore = () => {
    const opts = [0, 5, 10, 15, 30];
    const cur = opts.indexOf(settings.notifBefore);
    saveSetting('notifBefore', opts[(cur + 1) % opts.length]);
    if (navigator.vibrate) try { navigator.vibrate(12); } catch {}
  };

  // Écoute des récitateurs — aperçu par récitateur (comme un choix de sonnerie)
  const [reciterOpen, setReciterOpen] = React.useState(false);
  const adhanPreviewRef = React.useRef(null);
  const [previewId, setPreviewId] = React.useState(null);
  const stopAdhanPreview = () => {
    const a = adhanPreviewRef.current;
    if (a && typeof a.pause === 'function') { try { a.pause(); a.currentTime = 0; } catch {} }
    adhanPreviewRef.current = null;
    setPreviewId(null);
  };
  const previewReciter = (id) => {
    if (previewId === id) { stopAdhanPreview(); return; }
    if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
    stopAdhanPreview();
    // Ne joue QUE le fichier de ce récitateur (essaie les formats web-lisibles)
    const sources = [`adhan-${id}.mp3`, `adhan-${id}.m4a`, `adhan-${id}.caf`, `adhan-${id}.aac`];
    const token = {};
    adhanPreviewRef.current = token; // jeton pour ignorer les essais périmés
    let i = 0;
    const tryNext = () => {
      if (adhanPreviewRef.current !== token) return; // un autre appel a pris la main
      if (i >= sources.length) { setPreviewId(null); return; }
      const a = new Audio(sources[i++]);
      let advanced = false;
      const next = () => { if (advanced) return; advanced = true; try { a.pause(); } catch {} tryNext(); };
      a.onended = () => { if (adhanPreviewRef.current === token) setPreviewId(null); };
      a.onerror = next;
      a.play().then(() => {
        if (adhanPreviewRef.current !== token) { try { a.pause(); } catch {} return; }
        adhanPreviewRef.current = a; // succès : ce lecteur devient l'actif
        setPreviewId(id);
      }).catch(next);
    };
    tryNext();
  };
  React.useEffect(() => () => stopAdhanPreview(), []);

  const rows = [
    {
      label: I.notifications,
      toggle: true,

    ...(settings.notifEnabled ? [

        value: settings.notifBefore === 0 ? (isAr ? 'في الوقت' : (lang === 'fr' ? 'à l\'heure' : lang === 'nl' ? 'op tijd' : 'on time')) : `${settings.notifBefore} ${isAr ? 'دقيقة' : 'min'}`,
        icon: 'clock',

    { label: I.haptics, toggle: true, on: settings.haptics, onChange: () => saveSetting('haptics', !settings.haptics) },
    { label: I.sound, toggle: true, on: settings.sound, onChange: () => saveSetting('sound', !settings.sound) },
    {

      value: settings.theme === 'bordeaux' ? (isAr ? '🟫 عنبر' : (lang === 'fr' ? '🟫 Ambre' : lang === 'nl' ? '🟫 Amber' : '🟫 Amber'))
           : settings.theme === 'nuit' ? (isAr ? '🌙 الكِسوة' : (lang === 'fr' ? '🌙 Kiswa' : lang === 'nl' ? '🌙 Kiswa' : '🌙 Kiswa'))
           : settings.theme === 'bahrayn' ? (isAr ? '✨ مِشكَاة' : (lang === 'fr' ? '✨ Mishkat' : lang === 'nl' ? '✨ Mishkat' : '✨ Mishkat'))
           : settings.theme === 'amouage' ? '🌀 Amouage'
           : settings.theme === 'rose' ? (isAr ? '🌸 وردي هندي' : (lang === 'fr' ? '🌸 Rose indien' : lang === 'nl' ? '🌸 Indiaas roze' : '🌸 Indian Rose'))
           : settings.theme === 'copper' ? (isAr ? '🟠 نُحاس فاس' : (lang === 'fr' ? '🟠 Cuivre de Fès' : lang === 'nl' ? '🟠 Fez-koper' : '🟠 Fez Copper'))
           : (isAr ? '🟨 ذهب السلطان' : (lang === 'fr' ? '🟨 Or Sultan' : lang === 'nl' ? '🟨 Sultansgoud' : '🟨 Sultan Gold')),
      icon: 'moon',
      onClick: () => {
        const opts = ['gold','bordeaux','copper','nuit','bahrayn','amouage'];
        const cur = opts.indexOf(settings.theme);
        saveSetting('theme', opts[(cur + 1) % opts.length]);
        if (navigator.vibrate) try { navigator.vibrate(12); } catch {}
      },
    },
    {
      label: isAr ? 'الوضع الليلي تلقائي' : (lang === 'fr' ? 'Mode nuit auto' : lang === 'nl' ? 'Automatische nachtmodus' : 'Auto night mode'),
      toggle: true,
      on: settings.darkMode === 'auto',
      onChange: () => saveSetting('darkMode', settings.darkMode === 'auto' ? 'off' : 'auto'),
    },
    { label: I.language, value: `${curLang.flag} ${curLang.label}`, icon: 'globe',
      onClick: () => { if (LANGS.length > 1) { setLangOpen(true); if(navigator.vibrate) try{navigator.vibrate(8);}catch(_){} } } },
    { label: I.share, value: '', icon: 'share', accent: true, onClick: handleShare },
  ];

  return (
    <div style={{ position:'absolute', inset:0, background:T.bg, overflow:'hidden', direction: isAr ? 'rtl' : 'ltr' }}>
      <window.SilkBg opacity={0.9} />
      {/* étoiles douces — même scintillement que la page النِّيَّة, densité plus légère */}
      <svg aria-hidden="true" viewBox="0 0 402 874" preserveAspectRatio="none" style={{ position:'absolute', inset:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:1, opacity:0.72 }}>
        {[[34,58,1.2,0.8],[96,26,0.8,0.5],[168,72,0.9,0.55],[248,34,1.3,0.85],[318,64,0.9,0.6],[372,22,0.8,0.5],[62,142,0.85,0.5],[210,120,0.75,0.45],[300,158,1,0.6],[366,196,0.8,0.48],[24,236,0.9,0.55],[130,206,0.75,0.42],[276,268,0.95,0.5],[44,330,0.8,0.46],[352,318,0.9,0.52],[186,382,0.8,0.44],[300,430,0.85,0.5],[38,462,0.9,0.48],[364,516,0.8,0.44],[110,548,0.85,0.46],[262,596,0.9,0.5],[30,634,0.8,0.42],[344,682,0.85,0.46],[150,724,0.8,0.44],[298,782,0.9,0.48],[56,806,0.8,0.42]].map(([x,y,r,op],i) => (
          <g key={i} style={{ animation:`alaeStarFloat ${(1.7 + (i % 5) * 0.44).toFixed(1)}s ease-in-out ${((i * 0.29) % 2.2).toFixed(2)}s infinite` }}>

            <circle cx={x} cy={y} r={r} fill="#f5f8ff" opacity={op} />

      </svg>
      {/* Glass content card */}
      <div style={{
        position:'absolute', top:108, left:14, right:14, bottom:24,
        borderRadius:22,
        background:'rgba(15, 11, 8, 0.24)',

                width:'100%', background:'transparent', border:'none',
                borderBottom:`0.5px solid ${T.hairline}`, paddingBottom:10,
                fontFamily:'"Cormorant Garamond",serif', fontStyle:'italic', fontSize:18, color:T.gold,
                outline:'none',
              }}

              {targetChips.map((n) => {
                const on = n === target;
                return (
                  <button key={n}
                    onClick={() => { setTarget(n); if (navigator.vibrate) try { navigator.vibrate(5); } catch (_) {} }}
                    style={{
                      flex:1, height:42, borderRadius:14, padding:0,
                      border: on ? '0.5px solid rgba(255,238,198,0.6)' : `0.5px solid ${T.hairline}`,
                      background: on ? 'linear-gradient(165deg, #FBE6AE 0%, #E8B97A 45%, #C68A3C 100%)' : 'linear-gradient(180deg, rgba(199,165,91,0.07), rgba(199,165,91,0.02))',
                      display:'flex', alignItems:'center', justifyContent:'center',
                      fontFamily:'"DM Serif Display",serif', fontSize:16,
                      color: on ? '#2A1A08' : T.textMuted,
                      boxShadow: on ? '0 4px 14px rgba(201,124,46,0.45), inset 0 1px 0 rgba(255,245,210,0.7)' : 'inset 0 1px 0 rgba(255,225,160,0.05)',
                      cursor:'pointer', transition:'all 0.2s ease',
                    }}>{n}</button>
                );
              })}
            </div>
          </div>

          {/* preset hint */}
          <div style={{ marginTop:6, padding:'12px 14px', borderRadius:12, background:'rgba(199,165,91,0.06)', border:'0.5px solid rgba(199,165,91,0.15)' }}>
            <div style={{ fontFamily:'"Cormorant Garamond",serif', fontStyle:'italic', fontSize:12.5, color:T.textMuted, lineHeight:1.5, textAlign: isAr ? 'right' : 'left' }}>
              {isAr ? '"الصلاة على النبي ﷺ تُكتب لك بها عشر حسنات."'
                : (lang === 'fr' ? '« Quiconque prie sur le Prophète ﷺ une fois, Allah prie sur lui dix fois. »'
                                 : lang === 'nl' ? '« Wie eenmaal zegeningen over de Profeet ﷺ uitspreekt, zegent Allah hem tienvoudig. »'
                                 : '« Whoever sends one blessing upon the Prophet ﷺ, Allah will send ten upon him. »')}
            </div>
          </div>
        </div>

        {/* footer actions */}
        <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'14px 20px 22px', display:'flex', gap:10, borderTop:'0.5px solid rgba(199,165,91,0.12)', background:'linear-gradient(180deg, transparent, rgba(11,13,16,0.4))' }}>

            flex:1, height:46, borderRadius:23, background:'transparent',
            border:`0.5px solid ${T.hairline}`, color:T.textMuted,
            fontFamily:isAr ? 'Cairo, sans-serif' : 'Inter, sans-serif',
            fontSize:11, fontWeight:500, letterSpacing:'0.2em', textTransform:'uppercase', cursor:'pointer',
          }}>{L.cancel}</button>
          <button onClick={handleSave} style={{
            flex:1.4, height:46, borderRadius:23,
            background:`linear-gradient(180deg, ${T.goldLight}, ${T.gold})`,
            border:'none', color:'#1A1410',
            fontFamily:isAr ? 'Cairo, sans-serif' : 'Inter, sans-serif',
            fontSize:11, fontWeight:600, letterSpacing:'0.2em', textTransform:'uppercase', cursor:'pointer',
            boxShadow:'0 6px 18px rgba(199,165,91,0.25)',
          }}>{L.save}</button>
        </div>
      </div>
    </div>
  );
}

// ─── End of Cycle modal ──────────────────────────────────────────────
function EndOfCycleScreen({ lang = 'fr', dhikrIdx = 0, completed = 33 }) {
  const T = window.THEME;
  const isAr = lang === 'ar';
  const d = window.DHIKRS[dhikrIdx] || window.DHIKRS[0];

  const L = {
    fr: { eyebrow:'Cycle achevé', title:'Allāhumma taqabbal', sub:`Tu as accompli ${completed} ${d.tr.toLowerCase()}.`, again:'Recommencer', stop:'Terminer', share:'Partager' },
    en: { eyebrow:'Cycle complete', title:'Allāhumma taqabbal', sub:`You completed ${completed} ${d.tr.toLowerCase()}.`, again:'Again', stop:'Finish', share:'Share' },
    ar: { eyebrow:'تمّت الجولة',    title:'اللَّهُمَّ تَقَبَّل',  sub:`أتممت ${completed} من ${d.ar}.`, again:'مرّة أخرى',  stop:'إنهاء',  share:'مشاركة' },
  }[lang];

  const shareCycle = () => {
    const text = isAr
      ? `أتممت ${completed} من ${d.ar} — آلَاء`
      : `${completed} × ${d.tr} — آلَاء`;
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) {}
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.alae) {
        window.webkit.messageHandlers.alae.postMessage({ type:'share', text, url:'https://www.lestyle.be/alaeApp' });
        return;
      }
    } catch (e) {}
    if (navigator.share) { navigator.share({ title:'آلَاء', text }).catch(() => {}); return; }
    try { window.alaeCopy(text); } catch (e) {}
  };
  return (
    <div style={{ position:'absolute', inset:0, overflow:'hidden', direction: isAr ? 'rtl' : 'ltr' }}>
      <div style={{ position:'absolute', inset:0, background:T.bg }}/>
      <window.SilkBg opacity={1} />
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse 80% 60% at 50% 40%, rgba(232,168,92,0.08), transparent 70%)' }}/>

      {/* soft gold halo behind moon */}
      <div style={{
        position:'absolute', top:180, left:'50%', transform:'translateX(-50%)',
        width:260, height:260, borderRadius:'50%',
        background:'radial-gradient(circle, rgba(232,168,92,0.32) 0%, rgba(196,124,52,0.12) 40%, transparent 75%)',
        filter:'blur(10px)', zIndex:1,
      }}/>

      {/* moon medallion */}
      <div style={{ position:'absolute', top:140, left:0, right:0, display:'flex', justifyContent:'center', zIndex:2 }}>
        <svg width="220" height="220" viewBox="0 0 220 220">
          <defs>
            <linearGradient id="cycRing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stopColor="#E8C58B"/>
              <stop offset="55%" stopColor="#C7A55B"/>
              <stop offset="100%" stopColor="#5C4220"/>
            </linearGradient>
          </defs>
          <circle cx="110" cy="110" r="100" fill="none" stroke="url(#cycRing)" strokeWidth="0.8" strokeOpacity="0.7"/>
          <circle cx="110" cy="110" r="90" fill="none" stroke={T.gold} strokeOpacity="0.25" strokeWidth="0.5"/>
          {/* 33 ticks */}
          {Array.from({ length: 33 }, (_, i) => {
            const a = (i / 33) * Math.PI * 2 - Math.PI / 2;
            const r1 = 84, r2 = 90;
            return <line key={i} x1={110 + Math.cos(a) * r1} y1={110 + Math.sin(a) * r1} x2={110 + Math.cos(a) * r2} y2={110 + Math.sin(a) * r2} stroke={T.gold} strokeWidth="0.6" strokeOpacity="0.8"/>;
          })}
          <text x="110" y="118" textAnchor="middle" fontFamily="Amiri, serif" fontSize="44" fill={T.goldLight} direction="rtl">{completed}</text>
          <text x="110" y="142" textAnchor="middle" fontFamily="'Cormorant Garamond',serif" fontStyle="italic" fontSize="12" fill={T.textMuted} letterSpacing="0.2em">COMPLETE</text>
        </svg>
      </div>

      {/* text */}
      <div style={{ position:'absolute', top:400, left:24, right:24, zIndex:2 }}>
        <div style={{
          padding:'18px 22px', borderRadius:16, textAlign:'center',
          background:'linear-gradient(180deg, rgba(11,13,16,0.40), rgba(11,13,16,0.25))',
          backdropFilter:'blur(6px)', WebkitBackdropFilter:'blur(6px)',
          border:'0.5px solid rgba(199,165,91,0.12)',
        }}>
          <div style={{ fontFamily:'Inter, sans-serif', fontSize:9.5, letterSpacing:'0.35em', color:T.textDim, textTransform:'uppercase' }}>{L.eyebrow}</div>
          <div style={{ marginTop:12, fontFamily:isAr ? 'Amiri, serif' : '"Cormorant Garamond",serif', fontSize:28, fontStyle: isAr ? 'normal' : 'italic', color:T.text, fontWeight:isAr ? 400 : 500, letterSpacing:'0.005em' }}>{L.title}</div>
          <div style={{ marginTop:8, fontFamily:isAr ? 'Cairo, sans-serif' : '"Cormorant Garamond",serif', fontSize:13, fontStyle: isAr ? 'normal' : 'italic', color:T.text, lineHeight:1.5, direction: isAr ? 'rtl' : 'ltr', opacity:0.9 }}>{L.sub}</div>
        </div>
      </div>

      {/* actions */}
      <div style={{ position:'absolute', bottom:60, left:28, right:28, zIndex:2, display:'flex', flexDirection:'column', gap:10 }}>
        <button style={{
          width:'100%', height:54, borderRadius:27,
          background:`linear-gradient(180deg, ${T.goldLight}, ${T.gold})`,
          border:'none', color:'#1A1410',
          fontFamily:isAr ? 'Cairo, sans-serif' : 'Inter, sans-serif',
          fontSize:12, fontWeight:600, letterSpacing:'0.22em', textTransform:'uppercase', cursor:'pointer',
          boxShadow:'0 8px 24px rgba(199,165,91,0.25), inset 0 1px 0 rgba(255,255,255,0.3)',
        }}>{L.again}</button>
        <div style={{ display:'flex', gap:10 }}>
          <button style={{
            flex:1, height:46, borderRadius:23, background:'transparent',
            border:`0.5px solid ${T.hairline}`, color:T.textMuted,
            fontFamily:isAr ? 'Cairo, sans-serif' : 'Inter, sans-serif',
            fontSize:10.5, fontWeight:500, letterSpacing:'0.22em', textTransform:'uppercase', cursor:'pointer',
          }}>{L.stop}</button>
          <button style={{
            flex:1, height:46, borderRadius:23, background:'transparent',
            border:`0.5px solid ${T.hairline}`, color:T.gold,
            fontFamily:isAr ? 'Cairo, sans-serif' : 'Inter, sans-serif',
            fontSize:10.5, fontWeight:500, letterSpacing:'0.22em', textTransform:'uppercase', cursor:'pointer',
            display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8,
          }} onClick={shareCycle}>
            <ENDIcon name="share" color={T.gold} size={13}/>{L.share}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Community Screen — قراءتي (Coran complet, recherche + marque-page) ──
function CommunityScreen({ lang = 'fr', onBack, onSettings }) {
  const T = window.THEME;
  const isAr = lang === 'ar';
  const SURAHS = window.QURAN_SURAHS;
  const STORE = 'misbaha.quran.v4';
  const load = () => {
    try { const d = JSON.parse(localStorage.getItem(STORE)); if (d && d.bm) return d; } catch (e) {}
    const bm = {};
    try {
      const v3 = JSON.parse(localStorage.getItem('misbaha.quran.v3'));
      if (v3) { if (v3.baqara) bm[2] = v3.baqara; if (v3.kahf) bm[18] = v3.kahf; }
    } catch (e) {}
    return { bm, favs: [2, 18], last: null };
  };
  const [data, setData] = React.useState(load);
  const [reader, setReader] = React.useState(null);
  const [query, setQuery] = React.useState('');
  const verseRef = React.useRef(null);
  React.useLayoutEffect(() => {
    const el = verseRef.current; if (!el) return;
    const fit = () => {
      el.style.transform = 'scale(1)';
      const avail = el.parentElement.clientWidth - 4;
      const w = el.scrollWidth;
      const s = w > avail ? avail / w : 1;
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  const save = (nx) => { setData(nx); try { localStorage.setItem(STORE, JSON.stringify(nx)); } catch (e) {} };

    fr:{ title:'Mon Coran', search:'Rechercher une sourate…', resume:'Reprendre', page:'page', pages:'pages', fav:'Favoris', all:'Les 114 sourates', none:'Aucune sourate trouvée' },
    en:{ title:'My Quran', search:'Search a surah…', resume:'Resume', page:'page', pages:'pages', fav:'Favorites', all:'All 114 surahs', none:'No surah found' },
    nl:{ title:'Mijn Koran', search:'Zoek een soera…', resume:'Hervatten', page:'pagina', pages:'pagina\'s', fav:'Favorieten', all:'De 114 soera\'s', none:'Geen soera gevonden' },

  const haptic = () => {
    if (navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }

  const q = query.trim();

  const lastSurah = data.last ? SURAHS.find(s=>s.n===data.last.n) : null;

// ─── Surah Reader — lecteur Mushaf intégré (photos lestyle.be) ────────────────
function SurahReader({ lang = 'ar', surahObj, surah, startPage = 1, onBookmark, onClose }) {
  const T = window.THEME;
  const isAr = lang === 'ar';
  const SUR = surahObj || ({
    baqara: { folder:'Al-Baqara', pages:48, ar:'البَقَرَة' },
    kahf:   { folder:'Al-Kahf',   pages:12, ar:'الكَهْف' },
  }[surah]) || { folder:'Al-Baqara', pages:48, ar:'البَقَرَة' };
  const total = SUR.pages || SUR.count || 1;
  const [page, setPage] = React.useState(startPage);
  const [loaded, setLoaded] = React.useState(false);
  const [dir, setDir] = React.useState(1);
  const [zoom, setZoom] = React.useState(false);
  const [chrome, setChrome] = React.useState(true);
  const [justRead, setJustRead] = React.useState(false);
  const scroller = React.useRef(null);
  const lastTap = React.useRef(0);
  const touch = React.useRef({ x:0, y:0, on:false });
  const imgRef = React.useRef(null);
  const [vary, setVary] = React.useState(0);
  const goodVary = React.useRef(0); // mémorise la variante d'URL qui marche pour cette sourate
  // OFFLINE d'abord : images locales embarquées dans l'app (quran-img/…),
  // puis le serveur Pi (lestyle.be) en SECOURS si une page manque en local.
  const localBase = `quran-img/${SUR.folder}`;
  const remoteBase = `https://www.lestyle.be/quran-img/${SUR.folder}`;
  const f = SUR.file || SUR.folder;
  const single = (SUR.pages || SUR.count || 1) === 1;
  const mk = (base, n) => single ? [
    `${base}/${f}.JPG`,
    `${base}/${f}.jpg`,
    `${base}/${f}.PNG`,
    `${base}/${f}.png`,
    `${base}/${f}-1.JPG`,
    `${base}/${f}-1.jpg`,
    `${base}/${f}-${n}.JPG`,
    `${base}/1.JPG`,
    `${base}/1.jpg`,
    `${base}/001.JPG`,
  ] : [
    `${base}/${f}-${n}.JPG`,
    `${base}/${f}-${n}.jpg`,
    `${base}/${f}-1-${n}.JPG`,
    `${base}/${f}.JPG`,
    `${base}/${n}.JPG`,
    `${base}/${n}.jpg`,
    `${base}/${String(n).padStart(2,'0')}.JPG`,
    `${base}/${String(n).padStart(3,'0')}.JPG`,
  ];
  const cands = (n) => [...mk(localBase, n), ...mk(remoteBase, n)];
  const url = (n) => cands(n)[0];
  const pct = Math.round(page / total * 100);
  const L = {
    fr:{ saved:'Marque-page gardé', sur:'sur' },
    en:{ saved:'Bookmark saved', sur:'of' },
    ar:{ saved:'حُفِظ المِعلام', sur:'من' },
  }[lang];
  const haptic = (style) => {
    try { if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.alae) window.webkit.messageHandlers.alae.postMessage({ type:'haptic', style: style || 'soft' }); } catch(e){}
    if (navigator.vibrate) { try { navigator.vibrate(style==='rigid'?14:8); } catch(e){} }
  };
  React.useEffect(() => {
    setLoaded(false); setZoom(false); setVary(goodVary.current);
    if (onBookmark) onBookmark(page);
    if (scroller.current) { try { scroller.current.scrollTo(0,0); } catch(e){} }
    if (page < total) { const nx = new Image(); nx.src = url(page+1); }
    if (page+1 < total) { const nx2 = new Image(); nx2.src = url(page+2); }
    if (page+2 < total) { const nx3 = new Image(); nx3.src = url(page+3); }
    if (page > 1) { const pv = new Image(); pv.src = url(page-1); }
  }, [page]);
  // Rescue cached images: onLoad can fire before React attaches its handler,
  // leaving `loaded` false (image stuck at opacity:0 = blank page). This runs
  // after every render and marks it loaded if the <img> is already complete.
  React.useEffect(() => {
    const im = imgRef.current;
    if (im && im.complete && im.naturalWidth > 0) setLoaded(true);
  });
  const go = (d) => { setPage((p) => { const np = Math.max(1, Math.min(total, p+d)); if (np!==p) { setDir(d); } return np; }); };
  const onTap = () => {
    const now = Date.now();
    if (now - lastTap.current < 270) { lastTap.current = 0; setZoom((z)=>!z); haptic('soft'); }
    else { lastTap.current = now; const t = now; setTimeout(() => { if (lastTap.current === t) { setChrome((c)=>!c); lastTap.current = 0; } }, 280); }
  };
  const onTouchStart = (e) => { if (zoom) return; const t=e.touches[0]; touch.current={ x:t.clientX, y:t.clientY, on:true }; };

// ─── Sun-phase icons (1px gold line set) ──────────────────────────────
function PrayerPhaseIcon({ phase, size = 18, color = '#E2C783' }) {
  const p = { width:size, height:size, viewBox:'0 0 24 24', fill:'none', stroke:color, strokeWidth:1.3, strokeLinecap:'round', strokeLinejoin:'round' };
  switch (phase) {
    case 'fajr': // dawn — sun rising at horizon
      return (
        <svg {...p}>
          <line x1="3" y1="19" x2="21" y2="19"/>
          <path d="M7 19a5 5 0 0 1 10 0"/>
          <path d="M12 5.5v2M5.2 8.2l1.3 1.3M18.8 8.2l-1.3 1.3"/>
        </svg>
      );
    case 'sunrise': // sun fully up with arrow
      return (
        <svg {...p}>
          <line x1="3" y1="19" x2="21" y2="19"/>
          <circle cx="12" cy="13" r="3.4"/>
          <path d="M12 4.5v2.4M4.7 9.2l1.5 1M19.3 9.2l-1.5 1"/>
          <path d="M9.7 16h4.6"/>
        </svg>
      );
    case 'dhuhr': // high sun
      return (
        <svg {...p}>
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/>
        </svg>
      );
    case 'asr': // afternoon — lower sun, long rays
      return (
        <svg {...p}>
          <circle cx="12" cy="13" r="3.6"/>
          <path d="M12 4v2M4.5 9l1.6 1.1M19.5 9l-1.6 1.1M3.2 16.5H6M18 16.5h2.8"/>
        </svg>
      );
    case 'maghrib': // sunset — sun dipping below horizon
      return (
        <svg {...p}>
          <line x1="3" y1="19" x2="21" y2="19"/>
          <path d="M7 19a5 5 0 0 1 10 0"/>
          <path d="M12 13.5v-2M5.2 14l1.3-1.3M18.8 14l-1.3-1.3M12 16.5l-1.6-1.6M12 16.5l1.6-1.6"/>
        </svg>
      );
    case 'isha': // night — crescent + star
      return (
        <svg {...p}>
          <path d="M19 14.5A7 7 0 0 1 9.5 5a7 7 0 1 0 9.5 9.5Z"/>
          <path d="M17 5.5l.6 1.4 1.4.6-1.4.6L17 9.5l-.6-1.4L15 7.5l1.4-.6Z"/>
        </svg>
      );
    default:
      return <svg {...p}><circle cx="12" cy="12" r="4"/></svg>;
  }
}
