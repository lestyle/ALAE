// ─── Community Screen — قراءتي (Coran complet, recherche + marque-page) ──
function CommunityScreen({ lang = 'fr', onBack, onSettings }) {
  const T = window.THEME;
  const isAr = lang === 'ar';
  const SURAHS = window.QURAN_SURAHS;
  const STORE = 'misbaha.quran.v4';
  const load = () => {
    try { const d = JSON.parse(localStorage.getItem(STORE)); if (d && d.bm) return d; } catch (e) {}
    const bm = {};
    try {
      const v3 = JSON.parse(localStorage.getItem('misbaha.quran.v3'));
      if (v3) { if (v3.baqara) bm[2] = v3.baqara; if (v3.kahf) bm[18] = v3.kahf; }
    } catch (e) {}
    return { bm, favs: [2, 18], last: null };
  };
  const [data, setData] = React.useState(load);
  const [reader, setReader] = React.useState(null);
  const [query, setQuery] = React.useState('');
  const verseRef = React.useRef(null);
  React.useLayoutEffect(() => {
    const el = verseRef.current; if (!el) return;
    const fit = () => {
      el.style.transform = 'scale(1)';
      const avail = el.parentElement.clientWidth - 4;
      const w = el.scrollWidth;
      const s = w > avail ? avail / w : 1;
      el.style.transform = 'scale(' + s + ')';
    };
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  const save = (nx) => { setData(nx); try { localStorage.setItem(STORE, JSON.stringify(nx)); } catch (e) {} };

  const L = {
    fr:{ title:'Mon Coran', search:'Rechercher une sourate…', resume:'Reprendre', page:'page', pages:'pages', fav:'Favoris', all:'Les 114 sourates', none:'Aucune sourate trouvée' },
    en:{ title:'My Quran', search:'Search a surah…', resume:'Resume', page:'page', pages:'pages', fav:'Favorites', all:'All 114 surahs', none:'No surah found' },
    nl:{ title:'Mijn Koran', search:'Zoek een soera…', resume:'Hervatten', page:'pagina', pages:'pagina\'s', fav:'Favorieten', all:'De 114 soera\'s', none:'Geen soera gevonden' },
    ar:{ title:'مُصحفي', search:'ابحث عن سورة…', resume:'تابِع', page:'صفحة', pages:'صفحات', fav:'المُفضّلة', all:'السُّوَر ١١٤', none:'لا توجد سورة' },
  }[lang];

  const haptic = () => {
    if (navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
    try { if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.alae) window.webkit.messageHandlers.alae.postMessage({ type:'haptic', style:'soft' }); } catch (e) {}
  };

  const stripAr = (s) => s.replace(/[\u064B-\u0652\u0670\u0640]/g,'').replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
  const stripLat = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['’\-]/g,'');
  const q = query.trim();
  const qAr = stripAr(q), qLat = stripLat(q);
  const matches = (s) => {
    if (!q) return true;
    if (/^\d+$/.test(q)) return String(s.n).startsWith(q);
    if (stripAr(s.ar).includes(qAr)) return true;
    return stripLat(s.tr).split(/\s+/).some(w => w.startsWith(qLat));
  };
  const filtered = SURAHS.filter(matches);

  const openReader = (s) => { const page = data.bm[s.n] || 1; save({ ...data, last:{ n:s.n, page } }); setReader({ ...s, page }); haptic(); };
  const onBookmark = (n, p) => { setData((prev) => { const nx = { ...prev, bm:{ ...prev.bm, [n]:p }, last:{ n, page:p } }; try { localStorage.setItem(STORE, JSON.stringify(nx)); } catch (e) {} return nx; }); };
  const toggleFav = (e, n) => { e.stopPropagation(); const has = data.favs.includes(n); save({ ...data, favs: has ? data.favs.filter(x=>x!==n) : [...data.favs, n] }); haptic(); };

  const Row = ({ s }) => {
    const bm = data.bm[s.n] || 0;
    const pct = bm > 0 ? Math.min(100, Math.round(bm / s.pages * 100)) : 0;
    const fav = data.favs.includes(s.n);
    return (
      <button onClick={() => openReader(s)} style={{
        width:'100%', cursor:'pointer', padding:'11px 13px', borderRadius:15, border:'none',
        background: bm>0 ? 'rgba(42,31,16,0.66)' : 'rgba(18,14,9,0.6)',
        boxShadow:'inset 0 0 0 0.5px rgba(232,200,140,0.16)',
        display:'flex', alignItems:'center', gap:12, direction:'rtl',
        WebkitTapHighlightColor:'transparent',
      }}>
        <div style={{ position:'relative', width:38, height:38, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
          <svg width="38" height="38" viewBox="0 0 40 40" style={{ position:'absolute', inset:0 }}>
            <path d="M14 3h12l3.5 3.5L33 10v12l-3.5 3.5L26 29H14l-3.5-3.5L7 22V10l3.5-3.5z" fill="none" stroke="rgba(232,185,122,0.38)" strokeWidth="0.9"/>
          </svg>
          <span style={{ fontFamily:'"DM Serif Display",serif', fontSize:13, color:T.goldLight, position:'relative' }}>{s.n}</span>
        </div>
        <div style={{ flex:1, minWidth:0, textAlign:'right' }}>
          <div style={{ fontFamily:'Amiri, serif', fontSize:20, color:T.text, lineHeight:1.2 }}>{s.ar}</div>
          <div style={{ display:'flex', alignItems:'center', gap:7, marginTop:2 }}>
            <span style={{ fontFamily:'Inter,sans-serif', fontSize:10, color:T.textDim, letterSpacing:'0.03em' }}>{s.pages} {s.pages>1?L.pages:L.page}</span>
            {bm>0 && <span style={{ fontFamily:'"DM Serif Display",serif', fontSize:11, color:T.gold }}>· {pct}%</span>}
          </div>
        </div>
        {bm>0 && (
          <div style={{ width:30, height:30, flexShrink:0, position:'relative' }}>
            <svg width="30" height="30" viewBox="0 0 30 30">
              <circle cx="15" cy="15" r="12" fill="none" stroke="rgba(199,165,91,0.16)" strokeWidth="2.5"/>
              <circle cx="15" cy="15" r="12" fill="none" stroke={T.gold} strokeWidth="2.5" strokeLinecap="round" strokeDasharray={2*Math.PI*12} strokeDashoffset={2*Math.PI*12*(1-pct/100)} transform="rotate(-90 15 15)"/>
            </svg>
          </div>
        )}
        <span onClick={(e)=>toggleFav(e,s.n)} style={{ flexShrink:0, padding:6, cursor:'pointer', lineHeight:0 }}>
          <svg width="17" height="17" viewBox="0 0 20 20" fill={fav?'#E8B97A':'none'}><path d="M10 2.5l2.2 4.7 5.1.6-3.8 3.5 1 5.1L10 14.4 5.5 16.9l1-5.1L2.7 8.3l5.1-.6L10 2.5z" stroke={fav?'#E8B97A':'rgba(232,200,140,0.42)'} strokeWidth="1" strokeLinejoin="round"/></svg>
        </span>
      </button>
    );
  };

  const lastSurah = data.last ? SURAHS.find(s=>s.n===data.last.n) : null;

  return (
    <div style={{ position:'absolute', inset:0, background:T.bg, overflow:'hidden', direction: isAr ? 'rtl' : 'ltr' }}>
      <window.SilkBg opacity={1} />
      <div style={{ position:'absolute', top:0, left:0, right:0, height:60, background:'linear-gradient(180deg, rgba(11,13,16,0.85), rgba(11,13,16,0))', zIndex:1 }}/>

      {/* verset d'ouverture — cadre premium */}
      <div style={{ position:'absolute', top:84, left:12, right:12, zIndex:2 }}>
        <div style={{
          position:'relative', borderRadius:18, padding:'15px 12px 12px',
          background:'linear-gradient(165deg, rgba(20,14,8,0.92), rgba(8,6,4,0.9))',
          border:'0.5px solid rgba(232,185,122,0.45)',
          boxShadow:'0 0 22px rgba(201,124,46,0.22), inset 0 1px 0 rgba(255,236,180,0.07)',
          direction:'rtl', textAlign:'center', overflow:'hidden',
        }}>
          <div ref={verseRef} style={{
            fontFamily:'Amiri, serif', fontSize:18, lineHeight:1.85, whiteSpace:'nowrap',
            display:'inline-block', transformOrigin:'center', willChange:'transform',
            background:'linear-gradient(180deg,#FFFFFF 0%,#F4F1EA 100%)',
            WebkitBackgroundClip:'text', backgroundClip:'text', color:'transparent',
            filter:'drop-shadow(0 0 5px rgba(255,245,220,0.35)) drop-shadow(0 1px 1px rgba(0,0,0,0.5))',
          }}>﴿ وَهَٰذَا كِتَابٌ أَنزَلْنَاهُ مُبَارَكٌ فَاتَّبِعُوهُ وَاتَّقُوا لَعَلَّكُمْ تُرْحَمُونَ ﴾</div>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:8, marginTop:11 }}>
            <div style={{ width:18, height:0.6, background:'linear-gradient(90deg, transparent, rgba(232,185,122,0.6))' }}/>
            <div style={{ fontFamily:'Amiri, serif', fontSize:12.5, color:'rgba(236,232,224,0.58)', letterSpacing:'0.02em' }}>سورة الأنعام · الآية ١٥٥</div>
            <div style={{ width:18, height:0.6, background:'linear-gradient(90deg, rgba(232,185,122,0.6), transparent)' }}/>
          </div>
        </div>
      </div>

      {/* Nav rapide — flèche gauche = Réglages · flèche droite = revenir où on était */}
      <div style={{ position:'absolute', top:190, left:0, right:0, zIndex:4, display:'flex', justifyContent:'center', gap:16, direction:'ltr' }}>
        <button onClick={onSettings} aria-label="Réglages" style={{
          width:44, height:44, borderRadius:22, cursor:'pointer', padding:0,
          display:'flex', alignItems:'center', justifyContent:'center',
          background:'rgba(14,10,6,0.62)', border:'1px solid rgba(232,185,122,0.55)',
          color:'rgba(232,185,122,0.95)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)',
          boxShadow:'0 6px 18px rgba(0,0,0,0.45)', WebkitTapHighlightColor:'transparent',
        }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 4l-6 4 6 4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <button onClick={onBack} aria-label="Retour" style={{
          width:44, height:44, borderRadius:22, cursor:'pointer', padding:0,
          display:'flex', alignItems:'center', justifyContent:'center',
          background:'rgba(14,10,6,0.62)', border:'1px solid rgba(232,185,122,0.55)',
          color:'rgba(232,185,122,0.95)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)',
          boxShadow:'0 6px 18px rgba(0,0,0,0.45)', WebkitTapHighlightColor:'transparent',
        }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l6 4-6 4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>

      {/* search */}
      <div style={{ position:'absolute', top:240, left:20, right:20, zIndex:3 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, padding:'0 14px', height:44, borderRadius:13, background:'rgba(20,15,10,0.85)', border:'0.5px solid rgba(232,200,140,0.24)', direction: isAr?'rtl':'ltr' }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ flexShrink:0 }}><circle cx="7" cy="7" r="5" stroke={T.goldLight} strokeWidth="1.2"/><path d="M11 11l3 3" stroke={T.goldLight} strokeWidth="1.2" strokeLinecap="round"/></svg>
          <input value={query} onChange={(e)=>setQuery(e.target.value)} placeholder={L.search} style={{ flex:1, minWidth:0, background:'transparent', border:'none', outline:'none', color:T.text, fontFamily: isAr?'Cairo,sans-serif':'Inter,sans-serif', fontSize:14, textAlign: isAr?'right':'left' }}/>
          {query && <span onClick={()=>setQuery('')} style={{ cursor:'pointer', color:T.textDim, lineHeight:0, flexShrink:0 }}><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg></span>}
        </div>
      </div>

    `${base}/${f}.png`,

    `${base}/${n}.JPG`,
    `${base}/${n}.jpg`,
    `${base}/${String(n).padStart(2,'0')}.JPG`,

  const cands = (n) => [...mk(localBase, n), ...mk(remoteBase, n)];

  }[lang];
  const haptic = (style) => {
    try { if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.alae) window.webkit.messageHandlers.alae.postMessage({ type:'haptic', style: style || 'soft' }); } catch(e){}
    if (navigator.vibrate) { try { navigator.vibrate(style==='rigid'?14:8); } catch(e){} }
  };
  React.useEffect(() => {
    setLoaded(false); setZoom(false); setVary(goodVary.current);
    if (onBookmark) onBookmark(page);

    if (page < total) { const nx = new Image(); nx.src = url(page+1); }

          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
        </button>

        <div style={{ minWidth:46, flexShrink:0, textAlign:'right', fontFamily:'"DM Serif Display", serif', fontSize:16, color:T.gold }}>{page}<span style={{ fontSize:11, color:T.textMuted }}> {L.sur} {total}</span></div>

      <div ref={scroller} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}

        {!loaded && (

            style={{ display:'block', borderRadius:6,

          })
          .catch(() => {
            loadPrayers(latitude, longitude, null);
            try { localStorage.setItem('alae.prayer.pos', JSON.stringify({ lat: latitude, lon: longitude, ts: Date.now() })); } catch {}
          });
      },
      () => {},
      { timeout: 6000, maximumAge: 600000 }
    );
  };

  const useMyLocation = () => {
    if (!navigator.geolocation) {
      setError(isAr ? 'الموقع غير مدعوم' : 'Géoloc non supportée');
      return;
    }
    setLoading(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        // Nom réel de la ville (reverse geocoding mondial, gratuit, sans clé) — toujours en français pour le widget
        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=fr`)
          .then(r => r.json())
          .then(g => {
            const nm = g.city || g.locality || g.principalSubdivision || null;
            loadPrayers(latitude, longitude, nm);
            try { localStorage.setItem('alae.prayer.pos', JSON.stringify({ lat: latitude, lon: longitude, city: nm, ts: Date.now() })); } catch {}
          })
          .catch(() => {
            loadPrayers(latitude, longitude, null);
            try { localStorage.setItem('alae.prayer.pos', JSON.stringify({ lat: latitude, lon: longitude, ts: Date.now() })); } catch {}
          });
      },
      () => { setError(isAr ? 'تعذّر الحصول على الموقع' : 'Impossible d\'obtenir la position'); setLoading(false); },
      { timeout: 8000, maximumAge: 600000 }
    );
  };

  // ─── Labels & i18n ──────────────────────────────────────────────────
  const PRAYERS = ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
  const PRAYER_LABELS = {
    fr: ['Sobh', 'Chourouk', 'Dohr', 'Aasr', 'Magreb', 'Ichaa'],
    en: ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'],
    ar: ['الفجر', 'الشروق', 'الظهر', 'العصر', 'المغرب', 'العشاء'],
    nl: ['Fajr', 'Zonsopgang', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'],
  };
  const PRAYER_AR_INLINE = ['الفجر', 'الشروق', 'الظهر', 'العصر', 'المغرب', 'العشاء'];
  const PHASE = ['fajr', 'sunrise', 'dhuhr', 'asr', 'maghrib', 'isha'];

  const labels = PRAYER_LABELS[lang] || PRAYER_LABELS.ar;
  const I18N = {
    fr: { title: 'Prières', nextLabel: 'PROCHAINE PRIÈRE', in: 'dans', remaining: 'restant', passed: 'écoulé', myPos: 'Ma position', loading: 'Chargement…', change: 'Changer' },
    en: { title: 'Prayers', nextLabel: 'NEXT PRAYER', in: 'in', remaining: 'left', passed: 'elapsed', myPos: 'My location', loading: 'Loading…', change: 'Change' },
    ar: { title: 'الصلاة', nextLabel: 'الصلاة القادمة', in: 'خلال', remaining: 'متبقّ', passed: 'مضى', myPos: 'موقعي', loading: 'جار التحميل…', change: 'تغيير' },
    nl: { title: 'Gebeden', nextLabel: 'VOLGEND GEBED', in: 'over', remaining: 'resterend', passed: 'verstreken', myPos: 'Mijn locatie', loading: 'Laden…', change: 'Wijzigen' },
  }[lang];

  // ─── Time math ──────────────────────────────────────────────────────
  const parseTime = (str, dayOffset = 0) => {
    if (!str) return null;
    const [h, m] = str.split(':').map(Number);
    const d = new Date();
    d.setDate(d.getDate() + dayOffset);
    d.setHours(h, m, 0, 0);
    return d;
  };

  let times = null;
  let dates = null;
  let nextIdx = -1, nextDate = null, prevDate = null;
  if (data && data.timings) {
    times = PRAYERS.map(p => {
      const raw = data.timings[p];
      return raw ? raw.split(' ')[0] : null;
    });
    // Build monotonic Date objects — a time earlier than the previous one has
    // wrapped past midnight (e.g. Isha at 00:13 in Brussels summer). Without this,
    // tonight's Isha reads as "already passed" and the app wrongly jumps to Fajr.
    dates = [];
    let prevMin = -1;
    for (let i = 0; i < times.length; i++) {
      const str = times[i];
      if (!str) { dates.push(null); continue; }
      const [hh, mm] = str.split(':').map(Number);
      const mins = hh * 60 + mm;
      const dayOff = mins < prevMin ? 1 : 0;
      prevMin = mins + (dayOff ? 1440 : 0);
      const d = new Date();
      d.setHours(hh, mm, 0, 0);
      if (dayOff) d.setDate(d.getDate() + 1);
      dates.push(d);
    }
    for (let i = 0; i < dates.length; i++) {
      const t = dates[i];
      if (t && t > now) { nextIdx = i; nextDate = t; break; }
    }
    if (nextIdx === -1) {
      // even tonight's wrapped Isha has passed → next is tomorrow's Fajr
      nextIdx = 0;
      nextDate = parseTime(times[0], 1);
      prevDate = dates[5] || parseTime(times[5]);
    } else if (nextIdx === 0) {
      // before Fajr → window opened at yesterday's Isha
      prevDate = parseTime(times[5], -1);
    } else {
      prevDate = dates[nextIdx - 1];
    }
  }

  // progress through the current window (0 → 1)
  let progress = 0;
  if (nextDate && prevDate) {
    const span = nextDate - prevDate;
    if (span > 0) progress = Math.min(1, Math.max(0, (now - prevDate) / span));
  }

  const fmtDur = (ms) => {
    const diff = Math.max(0, ms);
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    if (h > 0) return `${h}h ${String(m).padStart(2, '0')}`;
    if (m > 0) return `${m}m ${String(s).padStart(2, '0')}s`;
    return `${s}s`;
  };
  const countdown = nextDate ? fmtDur(nextDate - now) : '—';

  // Ring geometry
  const RING = 132, STROKE = 5, R = (RING - STROKE) / 2, C = 2 * Math.PI * R;

  return (
    <div style={{ position:'absolute', inset:0, background:T.bg, direction: isAr ? 'rtl' : 'ltr' }}>
      <window.SilkBg opacity={0.85} />
      <style>{`
        @keyframes ringShine {
          0%, 100% { filter: drop-shadow(0 0 7px rgba(201,124,46,0.62)) drop-shadow(0 0 2px rgba(255,205,130,0.5)); }
          50%      { filter: drop-shadow(0 0 18px rgba(216,138,62,0.98)) drop-shadow(0 0 6px rgba(255,214,150,0.8)); }
        }
        @keyframes ringIgnite {
          0%   { opacity: 0; filter: brightness(0.35) blur(3px); }
          55%  { opacity: 1; }
          100% { opacity: 1; filter: brightness(1) blur(0); }
        }
        @keyframes ringHalo {
          0%, 100% { opacity: 0.5; transform: scale(0.985); }
          50%      { opacity: 1;   transform: scale(1.015); }
        }
        @keyframes prayerIconGlow {
          0%, 100% { box-shadow: 0 0 10px rgba(201,124,46,0.55), inset 0 0 6px rgba(255,205,130,0.22); }
          50%      { box-shadow: 0 0 20px rgba(216,138,62,0.92), inset 0 0 10px rgba(255,210,140,0.4); }
        }
        @keyframes alaeRingSpin {
          from { transform: rotate(0deg); }
          to   { transform: rotate(360deg); }
        }
        @keyframes prayerNameGlow {
          0%, 100% { color:#F4D89B; text-shadow:0 0 6px rgba(232,185,122,0.45), 0 1px 4px rgba(0,0,0,0.6); }
          50%      { color:#FFF6D8; text-shadow:0 0 16px rgba(255,228,154,0.95), 0 0 30px rgba(232,170,70,0.55), 0 1px 4px rgba(0,0,0,0.6); }
        }
        @keyframes heroCopperOrbit {
          from { transform: rotate(0deg); }
          to   { transform: rotate(360deg); }
        }
      `}</style>

      {/* top status fade — fixe */}
      <div style={{ position:'absolute', top:0, left:0, right:0, height:60, background:'linear-gradient(180deg, rgba(11,13,16,0.7), rgba(11,13,16,0))', zIndex:3, pointerEvents:'none' }}/>

      {/* tout reste fixe : pas de défilement, le fond et les horaires ne bougent pas */}
      <div style={{ position:'absolute', inset:0, overflow:'hidden', zIndex:2 }}>
      <div style={{ position:'relative', zIndex:2, padding:'46px 16px 20px', minHeight:'100%' }}>

        {/* ─── Header: location + dates ─────────────────────────────── */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, marginBottom:18, position:'relative' }}>
          <button onClick={() => setShowCities(v => !v)} style={{
            display:'inline-flex', alignItems:'center', gap:7,
            padding:'8px 13px', borderRadius:11, cursor:'pointer',
            background:'rgba(199,165,91,0.07)', border:`0.5px solid ${T.hairline}`,
            color:T.text, fontFamily:'Inter, sans-serif',
          }}>
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" style={{ flexShrink:0 }}>
              <path d="M7 12.5s4.2-3.6 4.2-6.7A4.2 4.2 0 0 0 7 1.6a4.2 4.2 0 0 0-4.2 4.2C2.8 8.9 7 12.5 7 12.5Z" stroke={T.gold} strokeWidth="1"/>
              <circle cx="7" cy="5.8" r="1.5" stroke={T.gold} strokeWidth="1"/>
            </svg>
            <span style={{
              fontFamily:isAr ? 'Cairo, sans-serif' : 'Inter, sans-serif',
              fontSize:isAr ? 17 : 13.5, fontWeight:600, color:T.text, letterSpacing:'0.01em', lineHeight:1,
            }}>{city}</span>
            <svg width="9" height="9" viewBox="0 0 10 10" fill="none" style={{ flexShrink:0, transform: showCities ? 'rotate(180deg)' : 'none', transition:'transform 0.2s' }}>
              <path d="M2 3.5L5 6.5L8 3.5" stroke={T.goldLight} strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>

          {showCities && (
            <div style={{
              position:'absolute', top:46, left:0, zIndex:30, width:248,
              background:'rgba(16,12,8,0.97)', backdropFilter:'blur(14px)', WebkitBackdropFilter:'blur(14px)',
              border:'0.5px solid rgba(232,200,140,0.32)', borderRadius:16,
              boxShadow:'0 22px 50px rgba(0,0,0,0.6), 0 0 22px rgba(201,124,46,0.25)',
              padding:6, maxHeight:340, overflowY:'auto', direction: isAr ? 'rtl' : 'ltr',
            }}>
              {/* recherche mondiale */}
              <div style={{ display:'flex', alignItems:'center', gap:8, padding:'0 10px', height:38, borderRadius:10, background:'rgba(20,15,10,0.9)', border:'0.5px solid rgba(232,200,140,0.22)', marginBottom:6 }}>
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style={{ flexShrink:0 }}><circle cx="7" cy="7" r="5" stroke={T.goldLight} strokeWidth="1.2"/><path d="M11 11l3 3" stroke={T.goldLight} strokeWidth="1.2" strokeLinecap="round"/></svg>
                <input
                  value={citySearch}
                  onChange={(e) => setCitySearch(e.target.value)}
                  placeholder={isAr ? 'ابحث عن مدينة…' : (lang === 'fr' ? 'Chercher une ville…' : lang === 'nl' ? 'Zoek een stad…' : 'Search a city…')}
                  autoFocus
                  style={{ flex:1, minWidth:0, background:'transparent', border:'none', outline:'none', color:T.text, fontFamily:isAr?'Cairo,sans-serif':'Inter,sans-serif', fontSize:13, textAlign: isAr?'right':'left' }}
                />
                {citySearch && <span onClick={() => setCitySearch('')} style={{ cursor:'pointer', color:T.textDim, lineHeight:0, flexShrink:0 }}><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg></span>}
              </div>

              {/* résultats de recherche */}
              {citySearch.trim().length >= 2 ? (
                <>
                  {searching && <div style={{ padding:'12px', textAlign:'center', color:T.textMuted, fontFamily:isAr?'Cairo,sans-serif':'Inter,sans-serif', fontSize:12 }}>{isAr ? 'جار البحث…' : '…'}</div>}
                  {!searching && cityResults.length === 0 && <div style={{ padding:'12px', textAlign:'center', color:T.textMuted, fontFamily:isAr?'Cairo,sans-serif':'Inter,sans-serif', fontSize:12 }}>{isAr ? 'لا توجد مدينة' : (lang === 'fr' ? 'Aucune ville' : 'No city')}</div>}
                  {cityResults.map(r => (
                    <button key={r.id} onClick={() => pickSearchResult(r)} style={{
                      width:'100%', display:'flex', alignItems:'center', gap:9, padding:'9px 11px', cursor:'pointer',
                      background:'transparent', border:'none', borderRadius:10,
                      color:T.text, fontFamily:isAr?'Cairo,sans-serif':'Inter,sans-serif',
                      flexDirection: isAr ? 'row-reverse' : 'row', textAlign: isAr ? 'right' : 'left',
                    }}>
                      <span style={{ fontSize:16, flexShrink:0 }}>{flagEmoji(r.cc)}</span>
                      <span style={{ flex:1, minWidth:0 }}>
                        <span style={{ display:'block', fontSize:isAr?14.5:13, fontWeight:600, color:T.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{r.name}</span>
                        <span style={{ display:'block', fontSize:10.5, color:T.textMuted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{[r.admin, r.country].filter(Boolean).join(' · ')}</span>
                      </span>
                    </button>
                  ))}
                </>
              ) : (
                <>
                  <button onClick={() => { setShowCities(false); useMyLocation(); }} style={{
                    width:'100%', display:'flex', alignItems:'center', gap:9, padding:'11px 12px', cursor:'pointer',
                    background:'rgba(216,138,62,0.12)', border:'0.5px solid rgba(232,185,122,0.3)', borderRadius:11, marginBottom:5,
                    color:T.goldLight, fontFamily:isAr?'Cairo,sans-serif':'Inter,sans-serif', fontSize:isAr?14.5:12.5, fontWeight:600,
                    flexDirection: isAr ? 'row-reverse' : 'row', textAlign: isAr ? 'right' : 'left',
                  }}>
                    <svg width="15" height="15" viewBox="0 0 14 14" fill="none"><path d="M7 1v2M7 11v2M1 7h2M11 7h2" stroke={T.goldLight} strokeWidth="1.1" strokeLinecap="round"/><circle cx="7" cy="7" r="3" stroke={T.goldLight} strokeWidth="1.1"/><circle cx="7" cy="7" r="1" fill={T.goldLight}/></svg>
                    <span style={{ flex:1 }}>{I18N.myPos}</span>
                  </button>
                  {CITIES.map(c => {
                    const nm = c.fr;
                    const active = city === nm;
                    return (
                      <button key={c.key} onClick={() => pickCity(c)} style={{
                        width:'100%', display:'flex', alignItems:'center', gap:9, padding:'10px 12px', cursor:'pointer',
                        background: active ? 'rgba(232,185,122,0.12)' : 'transparent', border:'none', borderRadius:10,
                        color: active ? T.goldLight : T.text, fontFamily:isAr?'Cairo,sans-serif':'Inter,sans-serif',
                        fontSize:isAr?15:13, fontWeight: active?600:400,
                        flexDirection: isAr ? 'row-reverse' : 'row', textAlign: isAr ? 'right' : 'left',
                      }}>
                        <span style={{ flex:1 }}>{nm}</span>
                        {active && <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke={T.goldLight} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                      </button>
                    );
                  })}
                </>
              )}
            </div>
          )}

          <div style={{ textAlign: isAr ? 'left' : 'right', lineHeight:1.3 }}>
            {data && data.date && (
              <>
                <div style={{
                  fontFamily: isAr ? 'Cairo, sans-serif' : 'Amiri, serif', fontSize: isAr ? 16.5 : 15.5, fontWeight:700, color:T.goldLight, direction:'rtl',
                  lineHeight:1.25, whiteSpace:'nowrap',
                }}>
                  {data.date.hijri ? String(`${data.date.hijri.day} ${data.date.hijri.month.ar} ${data.date.hijri.year} هـ`).replace(/[٠-٩۰-۹]/g, c => '0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(c) >= 0 ? '٠١٢٣٤٥٦٧٨٩'.indexOf(c) : '۰۱۲۳۴۵۶۷۸۹'.indexOf(c)]) : ''}
                </div>
                <div style={{ fontFamily:'Inter, sans-serif', fontSize:10.5, color:T.textMuted, letterSpacing:'0.03em', whiteSpace:'nowrap' }}>
                  {data.date.readable || ''}
                </div>
              </>
            )}
          </div>
        </div>

        {loading && !data && (
          <div style={{ textAlign:'center', padding:'80px 0', color:T.textMuted, fontFamily: isAr ? 'Cairo, sans-serif' : 'Inter, sans-serif', fontSize: isAr ? 14 : 13 }}>
            <div style={{ fontSize:22, marginBottom:10, color:T.gold, letterSpacing:'0.3em' }}>· · ·</div>
            {I18N.loading}
          </div>
        )}

        {error && !data && (
          <div style={{ textAlign:'center', padding:'24px', color:'#E07B5F', fontFamily:'Inter, sans-serif', fontSize:13 }}>
            {error}
          </div>
        )}

        {data && times && (
          <>
            {/* ─── Hero: progress ring + next prayer ─────────────────── */}
            <div style={{
              position:'relative', display:'flex', flexDirection:'column', alignItems:'center',
              padding:'26px 18px 24px', borderRadius:22, marginBottom:18, overflow:'hidden',
              background:'linear-gradient(180deg, rgba(22,16,9,0.72), rgba(13,11,8,0.5))',
              border:`0.5px solid rgba(232,200,140,0.28)`,
              boxShadow:'0 16px 44px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,225,160,0.1)',
            }}>
              <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse at 50% -10%, rgba(232,185,122,0.2), transparent 62%)', pointerEvents:'none' }}/>

              {/* Ring */}
              <div style={{ position:'relative', width:RING, height:RING, zIndex:2,
                animation:'ringIgnite 1.7s cubic-bezier(.22,.61,.36,1) both' }}>
                <div style={{ position:'absolute', inset:-10, borderRadius:'50%', background:'radial-gradient(circle, rgba(8,6,4,0.92) 0%, rgba(8,6,4,0.62) 56%, transparent 78%)', pointerEvents:'none' }}/>
                {/* halo cuivré qui ORBITE en continu — jamais de stop (rotation pure) */}
                <div style={{ position:'absolute', inset:-10, borderRadius:'50%',
                  background:'conic-gradient(from 0deg, rgba(205,127,50,0) 0deg, rgba(205,127,50,0) 70deg, rgba(205,127,50,0.55) 150deg, rgba(224,168,92,0.85) 180deg, rgba(205,127,50,0.55) 210deg, rgba(205,127,50,0) 290deg, rgba(205,127,50,0) 360deg)',
                  filter:'blur(9px)',
                  animation:'heroCopperOrbit 3.6s linear infinite', pointerEvents:'none', zIndex:0 }}/>
                {/* anneau doré complet — or bling bling (style lestyle) */}
                <div style={{ position:'absolute', inset:0, borderRadius:'50%', padding:3,
                  background:'conic-gradient(from 0deg,#E8B97A,#C98A2E,#CD7F32,#B87333,#8B5A2B,#CD7F32,#E0A85C,#B87333,#A9651F,#D9A03E,#E8B97A)',
                  boxShadow:'0 0 12px rgba(205,127,50,0.6), 0 0 24px rgba(184,115,51,0.35), inset 0 0 14px rgba(224,168,92,0.45)',
                  animation:'alaeRingSpin 9s linear infinite' }}>
                </div>
                <div style={{ position:'absolute', inset:3, borderRadius:'50%', background:'radial-gradient(circle at 50% 42%, #18120b 0%, #0b0907 72%)', pointerEvents:'none' }}/>
                {/* center content */}
                <div style={{
                  position:'absolute', inset:0, display:'flex', flexDirection:'column',
                  alignItems:'center', justifyContent:'center', gap:6, paddingBottom:6, overflow:'visible',
                }}>
                  <div style={{
                    fontFamily:isAr ? '"Noto Nastaliq Urdu","Amiri",serif' : '"DM Serif Display","Cormorant Garamond",serif',
                    fontSize:isAr ? 30 : 24, fontWeight:isAr ? 700 : 500,
                    background:'none',
                    backgroundImage:'linear-gradient(105deg, #C7935B 0%, #E8B97A 14%, #FCE9B0 26%, #FFF6DA 40%, #FCE9B0 48%, #F4D89B 58%, #E8B97A 72%, #FFF1C8 84%, #D9A25E 100%)',
                    backgroundSize:'260% 100%',
                    WebkitBackgroundClip: isAr ? 'text' : 'unset', WebkitTextFillColor: isAr ? 'transparent' : 'unset', backgroundClip: isAr ? 'text' : 'unset',
                    color: isAr ? undefined : '#fff',
                    filter: isAr ? 'drop-shadow(0 0 8px rgba(235,150,66,0.55)) drop-shadow(0 2px 5px rgba(0,0,0,0.45))' : 'none',
                    animation: isAr ? 'alaeShine 5.5s ease-in-out infinite' : 'none',
                    lineHeight:2, marginTop:isAr ? 2 : 5, letterSpacing:'0.02em', overflow:'visible', whiteSpace:'nowrap',
                  }}>{labels[nextIdx]}</div>
                  <PrayerPhaseIcon phase={PHASE[nextIdx]} size={22} color={T.goldLight}/>
                  {!isAr && (
                    <div style={{ fontFamily:'Amiri, serif', fontSize:13, color:'rgba(232,185,122,0.72)', direction:'rtl', lineHeight:1 }}>
                      {PRAYER_AR_INLINE[nextIdx]}
                    </div>
                  )}
                </div>
              </div>

              {/* time + countdown */}
              <div style={{ position:'relative', zIndex:2, textAlign:'center', marginTop:13 }}>
                <style>{`@keyframes mawaqitTimeShine{0%{background-position:130% 0}50%{background-position:-30% 0}100%{background-position:130% 0}}`}</style>
                <div style={{
                  fontFamily:'"Cormorant Garamond","DM Serif Display",serif', fontSize:65, fontWeight:700, color:'transparent', backgroundImage:'linear-gradient(110deg, #8B5A2A 0%, #C7935B 16%, #E8B97A 30%, #FFF6DA 44%, #FCE9B0 50%, #E0A23F 60%, #C7935B 74%, #FFF1C8 86%, #B07F2E 100%)', backgroundSize:'200% 100%', WebkitBackgroundClip:'text', backgroundClip:'text', animation:'mawaqitTimeShine 5s ease-in-out infinite', lineHeight:1,
                  textShadow:'0 0 22px rgba(232,185,122,0.4)', letterSpacing:'0.01em',
                }}>{times[nextIdx]}</div>
                <div style={{ marginTop:8, fontFamily: isAr ? 'Cairo, sans-serif' : 'Inter, sans-serif', fontSize: isAr ? 14 : 12.5, color:'rgba(255,255,255,0.66)', letterSpacing:'0.02em' }}>
                  {I18N.in} <span style={{ color:T.goldLight, fontWeight:700, fontVariantNumeric:'tabular-nums' }}>{countdown}</span>
                </div>
              </div>
            </div>

            {/* ─── Prayer list ──────────────────────────────────────── */}
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {PRAYERS.map((p, i) => {
                const t = times[i];
                const tDate = parseTime(t);
                const isNext = i === nextIdx;
                const isPast = tDate && tDate < now && !isNext;

                return (
                  <div key={p} style={{
                    display:'flex', alignItems:'center', gap:13,
                    padding:'13px 15px', borderRadius:14,
                    background: isNext
                      ? 'linear-gradient(90deg, rgba(216,138,62,0.34), rgba(34,24,12,0.66))'
                      : 'rgba(12,9,6,0.5)',
                    border: isNext ? '1px solid rgba(232,185,122,0.6)' : '0.5px solid rgba(199,165,91,0.14)',

function PrayerPhaseIcon({ phase, size = 18, color = '#E2C783' }) {

    nl: { title:'Qibla', sub:'Richting naar de Kaaba', enable:'Kompas inschakelen', perm:'Tik om het kompas toe te staan', noLoc:'Locatie vereist', reqPos:'📍 Mijn locatie geven', aligned:'Gericht op Mekka', flat:'Houd je iPhone plat', degree:'°', distance:'Afstand', km:'km', noSensor:'Kompas niet beschikbaar op dit toestel', noSensorHint:'Gebruik de richting hierboven' },
  }[lang] || {};

  // Compute bearing + distance to Kaaba
  const computeQibla = (lat, lon) => {
    const toRad = (d) => d * Math.PI / 180;
    const toDeg = (r) => r * 180 / Math.PI;
    const φ1 = toRad(lat), φ2 = toRad(KAABA.lat);
    const Δλ = toRad(KAABA.lon - lon);
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    const bearing = (toDeg(Math.atan2(y, x)) + 360) % 360;
    // Haversine distance
    const R = 6371; // km
    const dLat = toRad(KAABA.lat - lat);
    const dLon = toRad(KAABA.lon - lon);
    const a = Math.sin(dLat/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(dLon/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  React.useEffect(() => {

      const raw = localStorage.getItem('alae.prayer.pos');

        const saved = JSON.parse(raw);

    } catch {}

    // Ne demande la position que si on n'en a pas une recente en cache :
    // dans une WKWebView file:// iOS reaffiche la fenetre d'autorisation a chaque appel.
    try {
      const raw = localStorage.getItem('alae.prayer.pos');
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.lat && s.lon && s.ts && (Date.now() - s.ts) < 86400000) {
          setPosition({ lat: s.lat, lon: s.lon });
          return;
        }
      }
    } catch {}
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const p = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        setPosition(p);
        try { localStorage.setItem('alae.prayer.pos', JSON.stringify({ ...p, ts: Date.now() })); } catch {}
      },
      () => {},
      { timeout: 6000, maximumAge: 600000 }
    );
  };

  const startCompass = async () => {
    setPermState('requesting');
    try {

      setPermState('granted');
      sensorSeen.current = false;
      const handler = (e) => {

          h = e.webkitCompassHeading;
        } else if (e.alpha !== null) {
          h = 360 - e.alpha;
        }
        if (h !== null) { sensorSeen.current = true; setHeading(h); }
      };
      window.addEventListener('deviceorientation', handler, true);
      window.addEventListener('deviceorientationabsolute', handler, true);
      // If no real heading arrives within 3s, this device has no usable compass
      if (noSensorTimer.current) clearTimeout(noSensorTimer.current);
      noSensorTimer.current = setTimeout(() => {
        if (!sensorSeen.current) setPermState('nosensor');
      }, 3000);
    } catch (e) {
      setPermState('denied');
    }
  };

  const qiblaData = position ? computeQibla(position.lat, position.lon) : null;
  const qiblaBearing = qiblaData ? qiblaData.bearing : null;
  const distance = qiblaData ? qiblaData.distance : null;
  const arrowAngle = (heading !== null && qiblaBearing !== null) ? (qiblaBearing - heading + 360) % 360 : null;
  const isAligned = arrowAngle !== null && (arrowAngle < 5 || arrowAngle > 355);

  // ── Mode capture App Store : forcer l'alignement parfait (cercles dorés) ──
  React.useEffect(() => {

    if (!/[?&]qa=1/.test(window.location.search)) return;
    if (qiblaBearing !== null) { setPermState('granted'); setHeading(qiblaBearing); }
  }, [qiblaBearing]);

  return (
    <div style={{ position:'absolute', inset:0, background:T.bg, overflow:'hidden', direction: isAr ? 'rtl' : 'ltr' }}>
      <window.SilkBg opacity={0.95} />
      {/* Cuivre de Fès — voile cuivré chaud + lueur dorée centrale */}
      <div style={{ position:'absolute', inset:0, background:'radial-gradient(ellipse 86% 70% at 50% 42%, rgba(255,200,130,0.14) 0%, rgba(228,150,70,0.05) 36%, rgba(11,13,16,0.30) 66%, rgba(8,9,11,0.5) 100%)', zIndex:1 }}/>

      <div style={{ position:'relative', zIndex:2, padding:'84px 20px 30px', height:'100%', display:'flex', flexDirection:'column' }}>

        {/* Top title with ornaments */}
        <div style={{ textAlign:'center', marginBottom: 8 }}>
          <div style={{ display:'flex', justifyContent:'center', alignItems:'center', gap:16, marginBottom:10 }}>
            <div style={{ width:5, height:5, transform:'rotate(45deg)', background:'#F4D89B', boxShadow:'0 0 5px rgba(255,225,150,0.85), 0 1px 2px rgba(0,0,0,0.6)', animation:'starSparkle 2.4s ease-in-out infinite', animationDelay:'0s' }}/>
            <div style={{ width:7, height:7, transform:'rotate(45deg)', background:'#FFE9B8', boxShadow:'0 0 7px rgba(255,225,150,0.95), 0 1px 2px rgba(0,0,0,0.6)', animation:'starSparkle 2.4s ease-in-out infinite', animationDelay:'0.5s' }}/>
            <div style={{ width:5, height:5, transform:'rotate(45deg)', background:'#F4D89B', boxShadow:'0 0 5px rgba(255,225,150,0.85), 0 1px 2px rgba(0,0,0,0.6)', animation:'starSparkle 2.4s ease-in-out infinite', animationDelay:'1s' }}/>
          </div>
          <style>{`
            @keyframes qiblaThread { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
            @keyframes starSparkle { 0%,100% { opacity:0.65; box-shadow: 0 0 4px rgba(255,225,150,0.5), 0 1px 2px rgba(0,0,0,0.6); transform: rotate(45deg) scale(0.92); } 50% { opacity:1; box-shadow: 0 0 14px rgba(255,245,200,1), 0 0 26px rgba(255,225,150,0.7), 0 1px 2px rgba(0,0,0,0.6); transform: rotate(45deg) scale(1.12); } }
          `}</style>
          <div style={{
            fontFamily:'"QPCV4Tajweed","QPC","Amiri Quran","Amiri",serif', fontSize:40, fontWeight:400,
            background:'linear-gradient(180deg, #FFF1C8 0%, #F4D89B 25%, #E8B97A 55%, #C7935B 85%, #7E5025 100%)',

// ─── PREMIUM COMPASS — Multi-layered gold rings with shimmer ───
function PremiumCompass({ qibla, arrow, static: isStatic, isAligned, T }) {

  return (

          marginLeft:-size/2, marginTop:-size/2, borderRadius:'50%',
          border:'1.5px solid rgba(255,214,140,0.55)',
          boxShadow:'0 0 16px rgba(255,200,120,0.4)',
          animation:`qiblaRipple 3.4s cubic-bezier(.15,.6,.25,1) ${d}s infinite`,

        }}/>
      ))}

      {/* Outer ornate ring — slowly rotating */}
      <div style={{
        position:'absolute', inset:0, overflow:'visible',
        animation: 'qiblaSpin1 60s linear infinite',
      }}>
        <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{ overflow:'visible' }}>
          <defs>
            <linearGradient id="qOuter" x1="0" y1="0" x2="1" y2="1">

              <stop offset="40%" stopColor="#E8B97A"/>
              <stop offset="100%" stopColor="#7E5025"/>

              <stop offset="40%" stopColor="#F3BE66"/>
              <stop offset="100%" stopColor="#B5631F"/>

          </defs>

          <circle cx={cx} cy={cy} r={size/2 - 10} fill="none" stroke="url(#qOuter)" strokeWidth="0.6" strokeDasharray="2 6" opacity="0.7"/>
          {/* 8 diamond stars on cardinal/intercardinal — copper-gold, gently twinkling */}
          {[0, 45, 90, 135, 180, 225, 270, 315].map((a, i) => {
            const r = size/2 - 10;
            const rad = (a - 90) * Math.PI / 180;

            const y = cy + Math.sin(rad) * r;

                {/* dark backing pad stays lit so the gem reads on bright gold silk */}

                {/* the gem itself blinks off→on, staggered around the ring */}
                <path d="M 0 -5 L 4 0 L 0 5 L -4 0 Z" fill="url(#qStar)" stroke="rgba(45,22,6,0.6)" strokeWidth="0.5"

              </g>

          })}

      </div>

      {/* Middle ring — counter-rotating */}
      <div style={{
        position:'absolute', inset:18,
        animation: 'qiblaSpin2 45s linear infinite',
      }}>
        <svg viewBox={`0 0 ${size-36} ${size-36}`} width={size-36} height={size-36}>
          <defs>
            <linearGradient id="qMid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#FFEFC8"/>
              <stop offset="50%" stopColor="#E8B97A"/>
              <stop offset="100%" stopColor="#7E5025"/>
            </linearGradient>
          </defs>
          {/* Thin gold ring */}
          <circle cx={(size-36)/2} cy={(size-36)/2} r={(size-36)/2 - 2} fill="none" stroke="url(#qMid)" strokeWidth="1" opacity="0.6"/>
          {/* graduations retirées — anneau épuré */}
        </svg>
      </div>

      {/* MAIN compass face */}
      <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} style={{ position:'absolute', inset:0 }}>
        <defs>
          <linearGradient id="qFace" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="rgba(40,30,20,0.85)"/>
            <stop offset="100%" stopColor="rgba(11,13,16,0.95)"/>
          </linearGradient>
          <linearGradient id="qRingBig" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#FFF1C8"/>
            <stop offset="25%" stopColor="#F4D89B"/>
            <stop offset="55%" stopColor="#E8B97A"/>
            <stop offset="85%" stopColor="#C7935B"/>
            <stop offset="100%" stopColor="#7E5025"/>
          </linearGradient>
          <linearGradient id="qRingShine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#FFFAE0"/>
            <stop offset="50%" stopColor="#FFEFC8" stopOpacity="0.6"/>
            <stop offset="100%" stopColor="#FFEFC8" stopOpacity="0"/>
          </linearGradient>
          <radialGradient id="qHub">
            <stop offset="0%" stopColor="#FFFAE0"/>
            <stop offset="40%" stopColor="#F4D89B"/>
            <stop offset="80%" stopColor="#C7935B"/>
            <stop offset="100%" stopColor="#5E3A18"/>
          </radialGradient>
          <linearGradient id="qArrow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#FFFAE0"/>
            <stop offset="40%" stopColor="#F4D89B"/>
            <stop offset="100%" stopColor="#C7935B"/>
          </linearGradient>
          {/* Neon arrow gradient — copper-gold, lit when aligned */}
          <linearGradient id="qArrowNeon" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#FFE9B0"/>
            <stop offset="35%" stopColor="#F0B85C"/>
            <stop offset="70%" stopColor="#D98B3C"/>
            <stop offset="100%" stopColor="#B5631F"/>
          </linearGradient>
          <linearGradient id="qArrowBack" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#8B5A2A"/>
            <stop offset="100%" stopColor="#3a2208"/>
          </linearGradient>
        </defs>

        {/* Face dark background */}
        <circle cx={cx} cy={cy} r="125" fill="url(#qFace)"/>
        {/* Main thick gold ring */}
        <circle cx={cx} cy={cy} r="125" fill="none" stroke="url(#qRingBig)" strokeWidth="3.5"/>
        {/* Inner gold ring */}
        <circle cx={cx} cy={cy} r="115" fill="none" stroke="url(#qRingBig)" strokeWidth="0.8" opacity="0.5"/>
        {/* Top shine on ring */}
        <path d={`M ${cx-100} ${cy-65} A 125 125 0 0 1 ${cx+100} ${cy-65}`} fill="none" stroke="url(#qRingShine)" strokeWidth="3" opacity="0.7"/>

        {/* faint inner ring for depth (lignes radiales retirées) */}
        <circle cx={cx} cy={cy} r="58" fill="none" stroke="url(#qRingBig)" strokeWidth="0.5" opacity="0.12"/>

        {/* Cardinal letters with gold glow */}
        {[
          { l:'N', a:-90, big:true }, { l:'E', a:0 }, { l:'S', a:90 }, { l:'W', a:180 },
        ].map(({ l, a, big }) => {
          const rad = a * Math.PI / 180;
          const tr = 100;
          const x = cx + Math.cos(rad) * tr;
          const y = cy + Math.sin(rad) * tr;
          return (
            <g key={l}>
              <text x={x} y={y + 5} textAnchor="middle" fontFamily="Inter, sans-serif" fontSize={big ? 16 : 13}
                fontWeight="700" fill="url(#qRingBig)" letterSpacing="0.1em"
                style={{ filter: big ? 'drop-shadow(0 0 6px rgba(232,185,122,0.7))' : 'none' }}>{l}</text>
            </g>
          );
        })}

        {/* Qibla marker on outer ring (small kaaba dot indicating qibla bearing on the dial) */}
        <g transform={`rotate(${qibla} ${cx} ${cy})`}>
          <circle cx={cx} cy={cy - 119} r="4" fill="#FFFAE0" stroke="#8B5A2A" strokeWidth="0.5"/>
        </g>

        {/* Arrow group — rotates to point at qibla */}
        <g transform={`rotate(${arrow} ${cx} ${cy})`} style={{ transition: isStatic ? 'none' : 'transform 0.35s cubic-bezier(.2,.7,.3,1)' }}>
          {/* Glow behind arrow — blooms when aligned */}
          <ellipse cx={cx} cy={cy - 50} rx={isAligned ? 20 : 12} ry={isAligned ? 70 : 55}
            fill={isAligned ? 'url(#qArrowNeon)' : 'url(#qArrow)'}
            opacity={isAligned ? 0.5 : 0.30}
            style={{ transition: 'opacity 0.45s ease, rx 0.45s ease', filter: isAligned ? 'blur(7px)' : 'blur(2px)', animation: isAligned ? 'qiblaNeonPulse 1.3s ease-in-out infinite' : 'none' }}/>
          {/* Arrow tail (south) — fine modern */}
          <path d={`M ${cx} ${cy + 100}
                    L ${cx - 3.5} ${cy + 8}
                    L ${cx + 3.5} ${cy + 8} Z`}
            fill="url(#qArrowBack)" stroke={T.goldDark} strokeWidth="0.4" opacity="0.85"/>
          {/* Arrow main body (north) — fine modern needle, neon-lit when aligned */}
          <path d={`M ${cx} ${cy - 112}
                     L ${cx - 6} ${cy - 36}
                     L ${cx - 3} ${cy + 8}
                     L ${cx + 3} ${cy + 8}
                     L ${cx + 6} ${cy - 36} Z`}
            fill={isAligned ? 'url(#qArrowNeon)' : 'url(#qArrow)'}
            stroke={isAligned ? '#FFE9B0' : '#5E3A18'} strokeWidth={isAligned ? 0.8 : 0.5}
            style={{
              filter: isAligned
                ? 'drop-shadow(0 0 3px #FFE3A0) drop-shadow(0 0 9px #E59A45) drop-shadow(0 0 20px rgba(201,124,46,0.95)) drop-shadow(0 0 40px rgba(168,92,28,0.7))'
                : 'drop-shadow(0 0 6px rgba(232,185,122,0.4))',
              transition: 'filter 0.45s ease, fill 0.45s ease',
              animation: isAligned ? 'qiblaNeonPulse 1.3s ease-in-out infinite' : 'none',
            }}/>
          {/* Highlight strip on arrow */}
          <line x1={cx - 1} y1={cy - 105} x2={cx - 1} y2={cy + 8}
            stroke={isAligned ? '#FFEFC8' : '#FFFAE0'} strokeWidth={isAligned ? 1 : 0.6} opacity={isAligned ? 0.9 : 0.7}/>
          {/* Kaaba symbol at tip — black cube with gold trim (kiswah pattern) */}
          <g transform={`translate(${cx} ${cy - 124})`}
            style={{ filter: isAligned ? 'drop-shadow(0 0 6px #E59A45) drop-shadow(0 0 14px rgba(201,124,46,0.85))' : 'none', transition: 'filter 0.45s ease' }}>
            <rect x="-11" y="-10" width="22" height="20" fill="#0A0808" stroke={isAligned ? 'url(#qArrowNeon)' : 'url(#qArrow)'} strokeWidth={isAligned ? 1.8 : 1.4} rx="1.5"/>
            {/* Kiswah gold band */}
            <rect x="-11" y="-3" width="22" height="3" fill={isAligned ? 'url(#qArrowNeon)' : 'url(#qArrow)'} opacity="0.9"/>
            {/* Door outline */}
            <rect x="-3" y="0" width="6" height="9" fill="none" stroke={isAligned ? 'url(#qArrowNeon)' : 'url(#qArrow)'} strokeWidth="0.6" opacity="0.85"/>
          </g>
        </g>

        {/* Center hub with kaaba miniature */}
        <circle cx={cx} cy={cy} r="13" fill="url(#qHub)" stroke="#5E3A18" strokeWidth="0.8"/>
        <circle cx={cx} cy={cy} r="9" fill="rgba(11,13,16,0.7)" stroke="url(#qRingBig)" strokeWidth="0.6"/>
        <text x={cx} y={cy + 3} textAnchor="middle" fontFamily="Amiri, serif" fontSize="10" fill="url(#qRingBig)" fontWeight="700">۞</text>
      </svg>
    </div>
  );
}

// ─── BOUSSOLE 3D — gyroscope doré incliné, aiguille vers la Qibla ───
function Compass3D({ qibla, isAligned }) {
  const needleRef = React.useRef(null);
  const qmarkRef = React.useRef(null);
  const shadowRef = React.useRef(null);
  const cardRef = React.useRef(null);
  const gyroRef = React.useRef(null);
  const topmarkRef = React.useRef(null);
  const qRef = React.useRef(qibla);
  React.useEffect(() => { qRef.current = qibla; }, [qibla]);

  React.useEffect(() => {
    const qaMode = typeof window !== 'undefined' && /[?&]qa=1/.test(window.location.search);
    let raf = 0;
    let rawHeading = null, smHeading = null, needleAngle = 0;
    let targetBeta = 0, targetGamma = 0, curBeta = 0, curGamma = 0;
    let hasAbsolute = false, wasAligned = false;

    const shortestDelta = (from, to) => ((to - from + 540) % 360) - 180;
    const haptic = (style) => {
      try { const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.alae; if (h) h.postMessage({ type:'haptic', style: style || 'heavy' }); } catch (e) {}
      try { if (typeof navigator.vibrate === 'function') navigator.vibrate(style === 'heavy' ? [28,36,28] : 40); } catch (e) {}
    };
    const readHeading = (e, absolute) => {
      let h = null;
      if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;      // iOS : cap vrai-nord
      else if (e.alpha != null) h = 360 - e.alpha;                          // Android
      if (h == null) return;
      if (absolute) hasAbsolute = true;
      else if (hasAbsolute && e.webkitCompassHeading == null) return;
      rawHeading = (h % 360 + 360) % 360;
      targetBeta = e.beta || 0;
      targetGamma = e.gamma || 0;
    };
    const onAbs = (e) => readHeading(e, true);
    const onRel = (e) => readHeading(e, false);
    window.addEventListener('deviceorientationabsolute', onAbs, true);
    window.addEventListener('deviceorientation', onRel, true);

    const tick = () => {
      let rh = rawHeading;
      if (qaMode) { rh = qRef.current; targetBeta = 45; targetGamma = 0; } // capture App Store : aligné
      if (rh != null) {
        if (smHeading == null) smHeading = rh;
        smHeading = (smHeading + shortestDelta(smHeading, rh) * 0.28 + 360) % 360; // lissage passe-bas
        const relTarget = (qRef.current - smHeading + 360) % 360;
        needleAngle += shortestDelta(((needleAngle % 360) + 360) % 360, relTarget); // chemin court
        const nd = needleRef.current, qm = qmarkRef.current, cd = cardRef.current, gy2 = gyroRef.current, sh = shadowRef.current, tm = topmarkRef.current;
        if (nd) { nd.style.transition = 'none'; nd.style.animation = 'none'; nd.style.transform = 'translateZ(14px) rotate(' + needleAngle + 'deg)'; }
        if (qm) { const rad = needleAngle * Math.PI / 180, R = 120; qm.style.transition = 'none'; qm.style.transform = 'translate(' + (Math.sin(rad) * R) + 'px,' + ((-Math.cos(rad)) * R) + 'px) translateZ(8px)'; }
        if (cd) { cd.style.transition = 'none'; cd.style.transform = 'rotate(' + (-smHeading) + 'deg)'; } // le plateau flotte vers le nord

        curBeta += (targetBeta - curBeta) * 0.12;
        curGamma += (targetGamma - curGamma) * 0.12;
        const bx = Math.max(-34, Math.min(34, (curBeta - 45) * 0.7));
        const gy = Math.max(-38, Math.min(38, curGamma * 0.9));
        if (gy2) { gy2.style.transition = 'none'; gy2.style.animation = 'none'; gy2.style.transform = 'rotateX(' + (48 + bx) + 'deg) rotateY(' + gy + 'deg) rotateZ(' + (gy * 0.3) + 'deg)'; }
        if (sh) { sh.style.transition = 'none'; sh.style.animation = 'none'; sh.style.transform = 'translateX(' + (gy * 1.6) + 'px) rotate(' + (gy * 0.6) + 'deg) scaleX(' + (0.94 - Math.abs(gy) * 0.006).toFixed(3) + ')'; sh.style.opacity = (0.9 - Math.abs(bx) * 0.004).toFixed(3); }

        const off = Math.abs(shortestDelta(smHeading, qRef.current));
        const aligned = off < 5;
        if (nd) nd.classList.toggle('aligned', aligned);
        if (qm) qm.classList.toggle('aligned', aligned);
        if (tm) tm.classList.toggle('aligned', aligned);
        if (aligned && !wasAligned) haptic('heavy');
        if (aligned) { const now = Date.now(); if (now - (tick.lastPulse||0) > 1600) { haptic('light'); tick.lastPulse = now; } }
        wasAligned = aligned;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('deviceorientationabsolute', onAbs, true);
      window.removeEventListener('deviceorientation', onRel, true);
    };
  }, []);

  const ticks = []; for (let i = 0; i < 72; i++) ticks.push(i);
  const beads = []; for (let i = 0; i < 12; i++) beads.push(i);

  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
      <style>{`
        .q3d{ position:relative; width:300px; height:300px; perspective:900px; perspective-origin:50% 42%; }

        .q3d .ring.r1{ background:conic-gradient(from 0deg,#7E5025,#E8B97A,#FFF6DA,#C7935B,#E8B97A,#7E5025); -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px)); mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px)); filter:drop-shadow(0 0 6px rgba(232,185,122,.4)); }
        .q3d .ring.r2{ transform:rotateY(62deg); background:conic-gradient(from 90deg,#6a431f,#E8B97A,#FFF1C8,#C7935B,#6a431f); -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px)); mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px)); opacity:.75; filter:drop-shadow(0 0 4px rgba(232,185,122,.3)); }
        .q3d .ring.r3{ transform:rotateY(-62deg); background:conic-gradient(from 45deg,#6a431f,#E8B97A,#FFF1C8,#C7935B,#6a431f); -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px)); mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 2px)); opacity:.75; filter:drop-shadow(0 0 4px rgba(232,185,122,.3)); }

// Sépare l'isti'adha et la basmala (et le "قُل" des sourates) en lignes centrées,
// puis justifie le corps du verset — comme la mise en page d'un Mushaf.
function splitQuranLead(text) {
  const stripH = s => s
    .replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
    .replace(/\s+/g, ' ').trim();
  const ISTI = 'أعوذ بالله من الشيطان الرجيم';
  const BASM = 'بسم الله الرحمن الرحيم';
  let parts = text.split('،').map(s => s.trim()).filter(Boolean);
  const leads = [];
  while (parts.length > 1) {
    const n = stripH(parts[0]);
    if (n === ISTI || n === BASM) leads.push(parts.shift());
    else break;
  }
  return { leads, body: parts.join(' ، ') };
}

function AdhkarScreen({ lang = 'ar' }) {
  const T = window.THEME;
  const isAr = lang === 'ar';

  // Choose default tab based on time of day
  const hour = new Date().getHours();
  const defaultTab = (hour >= 5 && hour < 17) ? 'morning' : 'evening';
  const [tab, setTab] = React.useState(defaultTab);
  const [counters, setCounters] = React.useState({}); // { 'morning-0': 3, ... }

  const list = window.ADHKAR[tab];

  const titles = {
    morning: { ar: 'أَذكَار الصَّبَاح', fr: 'Adhkar du matin', en: 'Morning adhkar', nl: 'Ochtend-adhkar' },
    evening: { ar: 'أَذكَار المَسَاء', fr: 'Adhkar du soir', en: 'Evening adhkar', nl: 'Avond-adhkar' },
  };

  const tap = (idx) => {
    const key = `${tab}-${idx}`;
    const cur = counters[key] || 0;
    const target = list[idx].t;
    if (cur >= target) return;
    if (navigator.vibrate) try { navigator.vibrate(6); } catch {}
    const next = cur + 1;
    setCounters({ ...counters, [key]: next });
    if (next === target && navigator.vibrate) {
      try { navigator.vibrate([20, 60, 100]); } catch {}
    }
  };

  const reset = (idx) => {
    const key = `${tab}-${idx}`;
    setCounters({ ...counters, [key]: 0 });
  };

  return (
    <div style={{ position:'absolute', inset:0, background:T.bg, overflow:'hidden', direction: isAr ? 'rtl' : 'ltr' }}>
      <window.SilkBg opacity={0.9} />
      <style>{`
        @font-face { font-family: 'QPC'; src: url('fonts/QPC-V2.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        .adhkar-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
        .adhkar-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .settings-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
        .settings-scroll { -ms-overflow-style: none; scrollbar-width: none; }
      `}</style>

      {/* Top header */}
      <div style={{ position:'relative', zIndex:2, padding:'58px 20px 16px' }}>
        <div style={{ textAlign:'center', marginBottom:18 }}>
          <div style={{ fontFamily:'Amiri, serif', fontSize:30, color:T.text, fontWeight:700, letterSpacing:'0.01em', lineHeight:1.55, padding:'6px 0 4px', overflow:'visible' }}>
            {titles[tab][lang] || titles[tab].ar}
          </div>
          <div style={{ display:'flex', justifyContent:'center', alignItems:'center', gap:16, marginTop:12, opacity:0.9 }}>
            <div style={{ width:5, height:5, transform:'rotate(45deg)', background:'#F4D89B', boxShadow:'0 0 5px rgba(255,225,150,0.85), 0 1px 2px rgba(0,0,0,0.6)', animation:'starSparkle 2.4s ease-in-out infinite', animationDelay:'0s' }}/>
            <div style={{ width:7, height:7, transform:'rotate(45deg)', background:'#FFE9B8', boxShadow:'0 0 7px rgba(255,225,150,0.95), 0 1px 2px rgba(0,0,0,0.6)', animation:'starSparkle 2.4s ease-in-out infinite', animationDelay:'0.5s' }}/>
            <div style={{ width:5, height:5, transform:'rotate(45deg)', background:'#F4D89B', boxShadow:'0 0 5px rgba(255,225,150,0.85), 0 1px 2px rgba(0,0,0,0.6)', animation:'starSparkle 2.4s ease-in-out infinite', animationDelay:'1s' }}/>
          </div>
        </div>

        {/* Tab switcher */}
        <div style={{
          display:'flex', gap:0, margin:'0 auto', maxWidth:280,
          background:'rgba(11,13,16,0.5)', borderRadius:99,
          border:'0.5px solid rgba(232,200,140,0.22)',
          backdropFilter:'blur(10px)', WebkitBackdropFilter:'blur(10px)',
          padding:4,
        }}>
          {['morning','evening'].map(t => (
            <button key={t} onClick={() => setTab(t)} style={{
              flex:1, padding:'9px 14px', borderRadius:99, border:'none', cursor:'pointer',
              fontFamily:'Amiri, serif', fontSize:14, fontWeight:700,
              background: tab === t ? 'linear-gradient(165deg, #FBE6AE 0%, #E8B97A 42%, #C68A3C 100%)' : 'transparent',
              color: tab === t ? '#2A1A08' : T.textMuted,
              transition:'all 0.25s ease',
              boxShadow: tab === t ? '0 4px 14px rgba(201,124,46,0.45), inset 0 1px 0 rgba(255,245,210,0.7)' : 'none',
            }}>
              {t === 'morning' ? (isAr ? 'الصَّبَاح' : 'Matin') : (isAr ? 'المَسَاء' : 'Soir')}
            </button>
          ))}
        </div>
      </div>

      {/* List of adhkar — scrollable */}

        position:'absolute', top:228, left:0, right:0, bottom:30,
        overflowY:'auto', padding:'8px 16px 30px', zIndex:2,
        WebkitOverflowScrolling:'touch',
        touchAction:'pan-y',
      }}>
        {list.map((d, i) => {
          const key = `${tab}-${i}`;
          const count = counters[key] || 0;
          const done = count >= d.t;
          const progress = d.t > 0 ? count / d.t : 0;
          return (
            <div
              key={i}
              onClick={() => tap(i)}
              style={{
                marginBottom:14, padding:'18px 18px 14px', borderRadius:18,

                transition:'background 0.2s ease, border-color 0.2s ease',

              {/* Progress fill bar at bottom */}
              <div style={{

                background: done

              {/* Header row: number + counter */}
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
                <div style={{
                  fontFamily:'Inter, sans-serif', fontSize:10, letterSpacing:'0.18em',
                  color: T.gold, opacity: 0.6, fontWeight:600,
                }}>{String(i+1).padStart(2,'0')} / {String(list.length).padStart(2,'0')}</div>
                <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                  {done && (
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                      <circle cx="9" cy="9" r="8" fill="#4A8A6F"/>
                      <path d="M5 9.5L8 12.5L13.5 6.5" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>

                  )}
                  <div style={{
                    display:'flex', alignItems:'baseline', gap:4,
                    fontFamily:'"DM Serif Display","Cormorant Garamond",serif',
                  }}>
                    <span style={{
                      fontSize:22, fontWeight:400,
                      background: done
                        ? `linear-gradient(180deg, #5BAA88, #4A8A6F)`
                        : `linear-gradient(180deg, ${T.goldLight}, ${T.gold}, ${T.goldDark})`,
                      WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent',
                      lineHeight:1, letterSpacing:'-0.02em',
                    }}>{String(count).padStart(2,'0')}</span>
                    <span style={{ fontSize:11, color:T.textMuted, letterSpacing:'0.1em' }}>×{d.t}</span>
                  </div>
                </div>
              </div>

              {/* Arabic text — tout en QPC V2, layout Mushaf pour les versets */}
              {(() => {
                const fontStack = '"QPC","Amiri Quran","Amiri",serif';
                const { leads, body } = splitQuranLead(d.ar);
                return (
                  <div style={{ marginBottom:12, opacity: done ? 0.85 : 1 }}>
                    {leads.map((ln, k) => (
                      <div key={k} style={{
                        fontFamily: fontStack,
                        fontSize: k === 0 ? 18 : 20, lineHeight: 1.9,
                        color: T.gold, direction:'rtl', textAlign:'center', fontWeight:400,
                        textShadow:'0 1px 8px rgba(0,0,0,0.4)',
                        opacity: 0.92, marginBottom: 2,
                      }}>{ln}</div>
                    ))}
                    {leads.length > 0 && (
                      <div style={{ display:'flex', justifyContent:'center', margin:'6px 0 10px' }}>
                        <div style={{ width:46, height:1, background:`linear-gradient(90deg, transparent, ${T.gold}, transparent)`, opacity:0.5 }}/>
                      </div>
                    )}
                    <div style={{
                      fontFamily: fontStack,
                      fontSize: 23, lineHeight: 2.05,
                      color: T.text, direction:'rtl', textAlign:'justify', textAlignLast:'center',
                      fontWeight: 400, textShadow:'0 1px 10px rgba(0,0,0,0.4)',
                    }}>{body}</div>
                  </div>
                );
              })()}

              {/* Reference */}
              <div style={{
                fontFamily:'Amiri, serif', fontSize:12, color:T.textDim,
                direction:'rtl', textAlign: isAr ? 'left' : 'right',
              }}>{d.ref}</div>

              {/* Reset button (only if count > 0) */}
              {count > 0 && !done && (
                <button
                  onClick={(e) => { e.stopPropagation(); reset(i); }}
                  style={{
                    position:'absolute', top:14, [isAr ? 'left' : 'right']:14,
                    background:'transparent', border:'none', color:T.textDim,
                    cursor:'pointer', padding:6, fontSize:11, fontFamily:'Amiri, serif',
                  }}>
                  ↻
                </button>
              )}
            </div>
          );
        })}

        {/* Footer hint */}
        <div style={{ textAlign:'center', padding:'16px 0 24px', fontFamily:'Amiri, serif', fontSize:13, color:T.textDim }}>
          {isAr ? 'اضغط على الذكر لعدّه' : (lang === 'fr' ? 'Tape sur le dhikr pour compter' : lang === 'nl' ? 'Tik op de dhikr om te tellen' : 'Tap a dhikr to count')}
        </div>
      </div>
    </div>
  );
}

  try {
    const fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day:'numeric', month:'numeric' });
    const parts = {}; fmt.formatToParts(now).forEach(p => { parts[p.type] = p.value; });
    h = { d: parseInt(parts.day, 10), m: parseInt(parts.month, 10) };
    if (isNaN(h.d) || isNaN(h.m)) h = null;

        fr:'Ô Allah, fais lever ce mois sur nous avec la bénédiction, la foi, la sécurité et l’Islam. Mon Seigneur et ton Seigneur est Allah.',
